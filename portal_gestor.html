  // Dia / Semana / Mês controla TUDO na tela -- KPIs, "Por setor" e a lista de baixo -- o acompanhamento
  // real do gestor é por semana e por mês, então os números do topo precisam responder ao período
  // escolhido (antes só a lista de baixo reagia). "Em atraso" fica de fora dessa regra de propósito: é
  // sempre o atraso ATUAL (hoje), não faz sentido "atraso" de um período passado ou futuro.
  function pcmPainelHTML(){
    const today = todayISO();
    const active = state.serviceOrders.filter(o=>o.status==="distribuida"||o.status==="realizada");
    const pendentesGlobal = active.filter(o=>o.status==="distribuida");
    const emAtraso = pendentesGlobal.filter(o=>o.scheduledDate && o.scheduledDate<today);

    const viewMode = ["dia","semana","mes"].includes(state.pcmPainelViewMode) ? state.pcmPainelViewMode : "dia";
    const painelDate = state.pcmPainelDate || today;
    const painelWeek = state.pcmPainelWeek || isoWeekString(today);
    const painelMonth = state.pcmPainelMonth || today.slice(0,7);

    let periodStart, periodEnd, periodLabel;
    if(viewMode==="semana"){
      const weekInfo = parseWeekInput(painelWeek) || isoWeekOf(today);
      periodStart = isoWeekMonday(weekInfo.year, weekInfo.week);
      periodEnd = addDays(periodStart, 6);
      periodLabel = `Semana ${weekInfo.week} de ${weekInfo.year} — ${brDate(periodStart)} a ${brDate(periodEnd)}`;
    } else if(viewMode==="mes"){
      const [y,m] = painelMonth.split("-").map(Number);
      periodStart = `${painelMonth}-01`;
      periodEnd = `${painelMonth}-${String(new Date(y,m,0).getDate()).padStart(2,"0")}`;
      periodLabel = new Date(y, m-1, 1).toLocaleDateString("pt-BR", {month:"long", year:"numeric"});
    } else {
      periodStart = periodEnd = painelDate;
      periodLabel = new Date(painelDate+"T00:00:00").toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long", year:"numeric"});
    }
    const periodoOS = active.filter(o=>{
      if(!o.scheduledDate || o.scheduledDate<periodStart || o.scheduledDate>periodEnd) return false;
      // Na Semana/Mês, a OS de HOJE que ainda não foi marcada não conta como "pendente" -- o dia não
      // acabou, ainda dá tempo de fazer. Só vira pendente de verdade (e derruba o % concluído) a partir
      // de amanhã, se continuar sem ser feita. No modo Dia isso não se aplica -- é o dia que a pessoa
      // tá olhando de propósito, então mostra normal.
      if(viewMode!=="dia" && o.scheduledDate===today && o.status==="distribuida") return false;
      return true;
    });
    const periodoPendentes = periodoOS.filter(o=>o.status==="distribuida");
    const periodoRealizadas = periodoOS.filter(o=>o.status==="realizada");
    const pctConcluido = periodoOS.length ? Math.round((periodoRealizadas.length/periodoOS.length)*100) : null;
    const reprogramadasNoPeriodo = periodoOS.filter(o=>(o.reprogrammedCount||0)>0).length;

    // "Por setor" -- responde de cara "qual setor tem OS pendente", sem precisar contar item por item.
    const bySetor = new Map();
    periodoOS.forEach(o => {
      const key = o.setor || "Sem setor";
      if(!bySetor.has(key)) bySetor.set(key, { setor:key, pendentes:0, realizadas:0 });
      const row = bySetor.get(key);
      if(o.status==="distribuida") row.pendentes++; else row.realizadas++;
    });
    const setorRows = [...bySetor.values()].sort((a,b)=>a.setor.localeCompare(b.setor,"pt-BR"));

    function groupBySetor(list){
      const map = new Map();
      list.forEach(o => { const key = o.setor||"Sem setor"; if(!map.has(key)) map.set(key, []); map.get(key).push(o); });
      return [...map.entries()].sort((a,b)=> a[0]==="Sem setor" ? 1 : b[0]==="Sem setor" ? -1 : a[0].localeCompare(b[0],"pt-BR"));
    }
    const periodoPendentesPorSetor = groupBySetor(periodoPendentes);
    const periodoRealizadasPorSetor = groupBySetor(periodoRealizadas);
    const periodoWord = viewMode==="mes" ? "no mês" : viewMode==="semana" ? "na semana" : "no dia";

    return `
      <div class="tabs2" style="margin-bottom:10px">
        <div class="t ${viewMode==='dia'?'active':''}" data-pcmpainelmode="dia">Dia</div>
        <div class="t ${viewMode==='semana'?'active':''}" data-pcmpainelmode="semana">Semana</div>
        <div class="t ${viewMode==='mes'?'active':''}" data-pcmpainelmode="mes">Mês</div>
      </div>
      <div class="field" style="margin-bottom:4px">${viewMode==="semana"
        ? `<input type="week" class="input" id="pcmPainelWeek" value="${painelWeek}" />`
        : viewMode==="mes"
        ? `<input type="month" class="input" id="pcmPainelMonth" value="${painelMonth}" />`
        : `<input type="date" class="input" id="pcmPainelDate" value="${painelDate}" />`}</div>
      <p style="font-size:11.5px;color:var(--muted);margin:4px 0 14px;text-transform:capitalize">${esc(periodLabel)}</p>
      <div class="kpis" style="margin-bottom:16px">
        <div class="card kpi"><div class="label">Pendentes ${periodoWord}</div><div class="value">${periodoPendentes.length}</div></div>
        <div class="card kpi"><div class="label">Realizadas ${periodoWord}</div><div class="value" style="color:var(--emerald)">${periodoRealizadas.length}</div></div>
        <div class="card kpi"><div class="label">% concluído ${periodoWord}</div><div class="value">${pctConcluido==null?"—":pctConcluido+"%"}</div></div>
        <div class="card kpi"><div class="label">Em atraso (hoje)</div><div class="value" style="color:${emAtraso.length?'var(--rose)':'var(--emerald)'}">${emAtraso.length}</div></div>
        <div class="card kpi" style="grid-column:1/-1"><div class="label">Reprogramadas ${periodoWord}</div><div class="value" style="color:var(--amber)">${reprogramadasNoPeriodo}</div></div>
      </div>
      <h2 class="section">Por setor (${periodoWord})</h2>
      <div class="card" style="padding:0;margin-bottom:16px">
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Setor</th><th>Pendentes</th><th>Realizadas</th></tr></thead>
          <tbody>${setorRows.map(r=>`<tr${r.pendentes>0?' style="font-weight:700"':''}><td>${esc(r.setor)}</td><td style="color:${r.pendentes>0?'var(--rose)':'var(--brand-light)'}">${r.pendentes}</td><td style="color:var(--emerald)">${r.realizadas}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">Nada agendado nesse período.</td></tr>`}</tbody>
        </table>
        </div>
      </div>
      ${!periodoOS.length ? `<p class="empty">Nenhuma OS agendada pra esse período.</p>` : `
      ${periodoPendentesPorSetor.length ? `
      <h2 class="section">Pendentes (${periodoPendentes.length})</h2>
      ${periodoPendentesPorSetor.map(([setor,list])=>`
        <div style="font-size:11.5px;font-weight:700;color:var(--rose);margin:8px 2px 4px">${esc(setor)} (${list.length})</div>
        <div class="card" style="padding:4px 16px;margin-bottom:10px">${list.map(o=>pcmPainelCardHTML(o)).join("")}</div>`).join("")}
      ` : ""}
      ${periodoRealizadasPorSetor.length ? `
      <h2 class="section">Realizadas (${periodoRealizadas.length})</h2>
      ${periodoRealizadasPorSetor.map(([setor,list])=>`
        <div style="font-size:11.5px;font-weight:700;color:var(--emerald);margin:8px 2px 4px">${esc(setor)} (${list.length})</div>
        <div class="card" style="padding:4px 16px;margin-bottom:10px">${list.map(o=>pcmPainelCardHTML(o)).join("")}</div>`).join("")}
      ` : ""}
      `}
    `;
  }

  // Mesma lógica de dados/PDF do painel desktop, sem alterações (cálculo puro, não depende de tela).
  function buildManagementReportData(companyId, month){
    const companies = companyId ? state.companies.filter(c=>c.id===companyId) : state.companies;
    const scopeEmployees = state.employees.filter(e => !companyId || e.companyId===companyId).sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
    const companyCosts = companies.map(c => ({ company:c, ...companyMonthCostSummary(c, month) }));
    const statsByEmp = companyId ? new Map(scopeEmployees.map(e=>[e.id, employeeMonthStats(e, month)])) : null;
    const employeeCostRows = companyId ? scopeEmployees.map(e => {
      const company = companies.find(c=>c.id===e.companyId);
      const m = statsByEmp.get(e.id);
      return { employee:e, real: employeeMonthRealCost(e, company, month), estimated: employeeMonthEstimatedCost(e, company, month), hours:m.hours, overtimeHours:m.overtimeHours };
    }) : [];
    const employeeFreqRows = companyId ? scopeEmployees.map(e => {
      const m = statsByEmp.get(e.id);
      return { employee:e, ...m, unjustified: employeeMonthUnjustifiedAbsences(e, month) };
    }) : [];
    const companyFreqRows = companyId ? [] : companies.map(c => {
      const emps = state.employees.filter(e=>e.companyId===c.id);
      const totals = emps.reduce((acc,e) => { const m=employeeMonthStats(e,month); acc.workedDays+=m.workedDays; acc.absences+=m.absences; acc.folgas+=m.folgas; acc.ferias+=m.ferias; acc.unjustified+=employeeMonthUnjustifiedAbsences(e,month); return acc; }, {workedDays:0,absences:0,folgas:0,ferias:0,unjustified:0});
      return { company:c, ...totals };
    });
    const streakAlerts = scopeEmployees.map(e=>({ employee:e, streak:computeStreak(e) })).filter(x=>x.streak>=7);
    const unjustifiedAlerts = scopeEmployees.map(e=>({ employee:e, count:employeeMonthUnjustifiedAbsences(e, month) })).filter(x=>x.count>=3);
    const overtimeEmployeeRows = companyId ? scopeEmployees.map(e => {
      const company = companies.find(c=>c.id===e.companyId);
      return { employee:e, cost: employeeMonthOvertimeCost(e, company, month) };
    }).filter(x=>x.cost>0) : [];
    const overtimeCompanyRows = companyId ? [] : companies.map(c => {
      const emps = state.employees.filter(e=>e.companyId===c.id);
      const total = round2(emps.reduce((s,e)=>s+employeeMonthOvertimeCost(e, c, month), 0));
      return { company:c, total };
    }).filter(x=>x.total>0);
    const totalOvertimeCost = round2((companyId ? overtimeEmployeeRows.map(r=>r.cost) : overtimeCompanyRows.map(r=>r.total)).reduce((s,v)=>s+v,0));
    const monthStart = `${month}-01`;
    const [yy,mm] = month.split("-").map(Number);
    const monthEnd = `${month}-${String(new Date(yy,mm,0).getDate()).padStart(2,"0")}`;
    const feriasRows = scopeEmployees.flatMap(e => state.timeOffRequests
      .filter(r=>r.employeeId===e.id && r.type==="ferias" && r.status==="aprovado" && r.dateStart<=monthEnd && r.dateEnd>=monthStart)
      .map(r => ({ employee:e, request:r })));
    return {
      companyId, month, monthLabel: monthRangeLabel(month), generatedAt: new Date(),
      scopeLabel: companyId ? (companies[0]?.name || "—") : "Todas as empresas",
      companyCosts, employeeCostRows, employeeFreqRows, companyFreqRows,
      streakAlerts, unjustifiedAlerts, overtimeEmployeeRows, overtimeCompanyRows, totalOvertimeCost,
      feriasRows,
    };
  }
  function generateManagementReportPDF(data){
    const doc = new jspdf.jsPDF();
    const BRAND = [11,107,51], BRANDLIGHT = [230,242,222];
    const pageWidth = doc.internal.pageSize.getWidth();
    let y = 18;
    doc.setFillColor(...BRAND); doc.rect(0,0,pageWidth,24,"F");
    doc.setTextColor(255,255,255); doc.setFontSize(15); doc.setFont(undefined,"bold");
    doc.text("Fertgrow — Relatório Gerencial de Mão de Obra", 14, 15);
    doc.setFontSize(9); doc.setFont(undefined,"normal");
    doc.text(`${data.scopeLabel} · Referência: ${data.monthLabel} · Emitido em ${data.generatedAt.toLocaleString("pt-BR")}`, 14, 21);
    doc.setTextColor(0,0,0);
    y = 32;
    const sectionTitle = (title) => {
      if(y > 270){ doc.addPage(); y = 16; }
      doc.setFillColor(...BRAND); doc.rect(14, y-5.5, pageWidth-28, 7, "F");
      doc.setTextColor(255,255,255); doc.setFontSize(11); doc.setFont(undefined,"bold");
      doc.text(title, 16, y);
      doc.setTextColor(0,0,0); doc.setFont(undefined,"normal");
      y += 6;
    };
    const table = (head, body) => {
      doc.autoTable({ head:[head], body, startY:y, margin:{left:14,right:14}, styles:{fontSize:8.5, textColor:[0,0,0], lineColor:[0,0,0], lineWidth:0.1}, headStyles:{fillColor:BRAND, textColor:255}, alternateRowStyles:{fillColor:BRANDLIGHT} });
      y = doc.lastAutoTable.finalY + 8;
    };
    sectionTitle("Resumo de custos");
    table(["Empresa","Custo real (até hoje)","Custo estimado (mês fechado)"], data.companyCosts.map(c=>[c.company.name, money(c.real), money(c.estimated)]));
    if(data.employeeCostRows.length){
      table(["Funcionário","Custo real","Custo estimado","Horas normais","Horas extras"], data.employeeCostRows.map(r=>[r.employee.name, money(r.real), money(r.estimated), String(r.hours), String(r.overtimeHours)]));
    }
    sectionTitle("Frequência e faltas");
    if(data.employeeFreqRows.length){
      table(["Funcionário","Dias trabalhados","Faltas","Não justificadas","Folgas","Férias no mês"], data.employeeFreqRows.map(r=>[r.employee.name, String(r.workedDays), String(r.absences), String(r.unjustified), String(r.folgas), String(r.ferias)]));
    } else {
      table(["Empresa","Dias trabalhados","Faltas","Não justificadas","Folgas","Férias no mês"], data.companyFreqRows.map(r=>[r.company.name, String(r.workedDays), String(r.absences), String(r.unjustified), String(r.folgas), String(r.ferias)]));
    }
    sectionTitle("Alertas");
    if(!data.streakAlerts.length && !data.unjustifiedAlerts.length){
      doc.setFontSize(9.5); doc.text("Nenhum alerta no período.", 14, y); y += 8;
    } else {
      if(data.streakAlerts.length) table(["Funcionário sem folga há 7+ dias","Dias consecutivos"], data.streakAlerts.map(r=>[r.employee.name, String(r.streak)]));
      if(data.unjustifiedAlerts.length) table(["Funcionário com 3+ faltas não justificadas","Faltas não justificadas no mês"], data.unjustifiedAlerts.map(r=>[r.employee.name, String(r.count)]));
    }
    sectionTitle("Horas extras");
    if(data.employeeCostRows.length || data.overtimeEmployeeRows.length){
      table(["Funcionário","Custo de hora extra no mês"], data.overtimeEmployeeRows.map(r=>[r.employee.name, money(r.cost)]));
    } else {
      table(["Empresa","Custo de hora extra no mês"], data.overtimeCompanyRows.map(r=>[r.company.name, money(r.total)]));
    }
    doc.setFontSize(9.5); doc.setFont(undefined,"bold"); doc.text(`Total: ${money(data.totalOvertimeCost)}`, 14, y); doc.setFont(undefined,"normal"); y += 8;
    sectionTitle("Férias");
    if(!data.feriasRows.length){
      doc.setFontSize(9.5); doc.text("Nenhuma férias aprovada sobrepondo o período.", 14, y); y += 8;
    } else {
      table(["Funcionário","Período","Dias vendidos","Saldo atual"], data.feriasRows.map(r=>[r.employee.name, `${brDate(r.request.dateStart)} a ${brDate(r.request.dateEnd)}`, String(r.request.diasVendidos||0), String(r.employee.feriasSaldoDias??0)]));
    }
    const safeName = (data.scopeLabel||"todas").replace(/[^a-zA-Z0-9]+/g,"-").toLowerCase();
    doc.save(`relatorio-gerencial-${safeName}-${data.month}.pdf`);
  }

  function openWorkShiftModal(shift){

      id: uid(), name:"", startTime:"08:00", endTime:"17:00",
      breakMinutes: cltSuggestedBreakMinutes(shiftRawDurationHours("08:00","17:00")), hoursPerDay:8, weeklyHours:44, mode:"semanal",

      <div class="field">
        <label>Dias da semana trabalhados</label>
        <div class="row-flex" style="flex-wrap:wrap;gap:8px">

      <div class="field"><label>Data de referência (1º dia de trabalho de um ciclo)</label><input type="date" class="input" id="s_anchor" value="${f.cycleAnchor}" /></div>
    `;
    $("#modalRoot").innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="modal-head"><h3>${shift?"Editar turno":"Novo turno"}</h3><button class="btn ghost small" id="closeModal" type="button">✕</button></div>

          <div class="field"><label>Início</label><input type="time" class="input" id="s_start" value="${f.startTime}" /></div>
          <div class="field"><label>Término</label><input type="time" class="input" id="s_end" value="${f.endTime}" /></div>
          <div class="field"><label>Intervalo (min)</label><input type="number" step="5" min="0" class="input" id="s_break" value="${f.breakMinutes}" /></div>
          <div class="field"><label>Horas efetivas/dia</label><div class="input" id="s_hoursInfo" style="background:transparent;border-style:dashed;color:var(--brand-light);font-weight:700">${f.hoursPerDay}h</div></div>
          <div class="field"><label>Padrão de jornada</label>
            <select class="input" id="s_mode">
              <option value="semanal" ${f.mode==='semanal'?'selected':''}>Semanal fixo</option>
              <option value="escala" ${f.mode==='escala'?'selected':''}>Escala rotativa (6x1, 12x36...)</option>
            </select>
          </div>
          <div class="field"><label>Jornada semanal contratual (CLT)</label><input type="number" step="1" min="1" max="44" class="input" id="s_weeklyhours" value="${f.weeklyHours||44}" /></div>

          <label style="display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:12.5px"><input type="checkbox" id="s_worksholidays" ${f.worksOnHolidays?'checked':''} style="width:auto;margin-top:2px"/> Trabalha em feriados (escala contínua, ex: 2x2 com equipes A/B/C/D — não folga em feriado)</label>
          <div class="modal-actions">
            <button class="btn ghost" id="cancelModal" type="button">Cancelar</button>
            <button class="btn" id="saveShift" type="button">Salvar turno</button>
          </div>
        </div>
      </div>
    `;
    const close = () => { $("#modalRoot").innerHTML = ""; };
    $("#closeModal").addEventListener("click", close);
    $("#cancelModal").addEventListener("click", close);
    $("#backdrop").addEventListener("click", e => { if(e.target.id==="backdrop") close(); });
    function wireModeFields(){
      document.querySelectorAll("[data-weekday]").forEach(el => el.addEventListener("change", () => {
        const day = Number(el.dataset.weekday);
        if(el.checked){ if(!f.weekdays.includes(day)) f.weekdays.push(day); }
        else f.weekdays = f.weekdays.filter(d=>d!==day);
      }));
    }
    $("#s_mode").addEventListener("change", e => { f.mode = e.target.value; $("#shiftModeFields").innerHTML = renderModeFields(); wireModeFields(); });
    const refreshWorkedHours = () => {
      const worked = shiftWorkedHours($("#s_start").value, $("#s_end").value, $("#s_break").value);
      $("#s_hoursInfo").textContent = `${Math.round(worked*100)/100}h`;
    };
    $("#s_start").addEventListener("input", () => { $("#s_break").value = cltSuggestedBreakMinutes(shiftRawDurationHours($("#s_start").value, $("#s_end").value)); refreshWorkedHours(); });
    $("#s_end").addEventListener("input", () => { $("#s_break").value = cltSuggestedBreakMinutes(shiftRawDurationHours($("#s_start").value, $("#s_end").value)); refreshWorkedHours(); });
    $("#s_break").addEventListener("input", refreshWorkedHours);
    wireModeFields();
    $("#saveShift").addEventListener("click", async () => {
      const breakMinutes = Number($("#s_break").value||0);
      const updated = {
        id: f.id, name: $("#s_name").value.trim() || "Sem nome",
        startTime: $("#s_start").value, endTime: $("#s_end").value, breakMinutes,
        hoursPerDay: Math.round(shiftWorkedHours($("#s_start").value, $("#s_end").value, breakMinutes)*100)/100,
        weeklyHours: Math.min(44, Math.max(1, Number($("#s_weeklyhours").value||44))),
        mode: $("#s_mode").value, weekdays: f.weekdays,
        cycleWork: Number($("#s_cyclework")?.value || f.cycleWork || 1),
        cycleRest: Number($("#s_cyclerest")?.value || f.cycleRest || 1),
        cycleAnchor: $("#s_anchor")?.value || f.cycleAnchor || todayISO(),
        worksOnHolidays: $("#s_worksholidays").checked,
      };
      const btn = $("#saveShift"); btn.disabled = true; btn.textContent = "Salvando…";
      const { error } = await supabase.from("shifts").upsert(shiftToRow(updated));
      if(error){ alert("Não consegui salvar: "+error.message); btn.disabled = false; btn.textContent = "Salvar turno"; return; }
      const exists = state.shifts.some(s=>s.id===updated.id);
      state.shifts = exists ? state.shifts.map(s=>s.id===updated.id?updated:s) : [...state.shifts, updated];
      close(); render();
    });
  }

  // ---------------- Calendário (mês inteiro de um funcionário) ----------------
  function calendarioHTML(){
    if(!state.employees.length){
      return `<h2 class="section">Calendário</h2><span class="link" data-tab="mais">← Mais</span><p class="empty" style="margin-top:14px">Nenhum funcionário cadastrado.</p>`;
    }
    if(!state.calendarEmployeeId || !state.employees.some(e=>e.id===state.calendarEmployeeId)) state.calendarEmployeeId = state.employees[0].id;
    const employee = state.employees.find(e=>e.id===state.calendarEmployeeId);
    const month = state.calendarMonth;
    const [y,m] = month.split("-").map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const firstDow = new Date(y, m-1, 1).getDay();
    const shift = state.shifts.find(s=>s.id===shiftIdForEmployeeOnDate(employee, `${month}-01`));
    const cells = [];
    for(let i=0;i<firstDow;i++) cells.push(null);
    for(let d=1; d<=daysInMonth; d++) cells.push(`${month}-${String(d).padStart(2,"0")}`);
    function cellHTML(dateISO){
      if(!dateISO) return `<div></div>`;
      const info = scheduledDayInfo(employee, dateISO);
      const status = info.attendance ? attendanceStatus(info.attendance) : null;
      const day = Number(dateISO.slice(8,10));
      let bg = "transparent", color = "var(--muted)", label = "Folga";
      if(info.holiday){ bg="rgba(167,139,250,.18)"; color="#c4b5fd"; label=info.holiday.name; }
      else if(status==="presente"){ bg="rgba(52,211,153,.18)"; color="var(--emerald)"; label="Trabalhou"; }
      else if(status==="falta"){ bg="rgba(251,113,133,.18)"; color="var(--rose)"; label="Falta"; }
      else if(status==="ferias"){ bg="rgba(34,211,238,.18)"; color="var(--cyan)"; label="Férias"; }
      else if(status==="folga"){ bg="transparent"; color="var(--muted)"; label="Folga (registrada)"; }
      else if(info.scheduled && dateISO < todayISO()){ bg="rgba(251,191,36,.15)"; color="var(--amber)"; label="Sem apontamento"; }
      else if(info.scheduled){ bg="rgba(11,107,51,.1)"; color="var(--brand-light)"; label="Previsto"; }
      const outline = dateISO===todayISO() ? "outline:1px solid var(--brand-light);" : "";
      return `<div data-daycell="${dateISO}" title="${esc(label)}" style="cursor:pointer;background:${bg};color:${color};${outline}border-radius:6px;padding:6px 2px;text-align:center;font-size:11px">${day}</div>`;
    }
    return `
      <div class="row-flex" style="justify-content:space-between;margin-bottom:10px">
        <h2 class="section" style="margin:0">Calendário</h2>
        <span class="link" data-tab="mais">← Mais</span>
      </div>
      <div class="card" style="margin-bottom:14px">
        <div class="field" style="margin-bottom:10px"><label>Funcionário</label>
          <input class="input" id="calEmployeeSearch" list="calEmployeeOptions" placeholder="Buscar funcionário..." value="${esc((state.employees.find(e=>e.id===state.calendarEmployeeId)||{}).name||'')}" autocomplete="off" />
          <datalist id="calEmployeeOptions">${[...state.employees].sort((a,b)=>a.name.localeCompare(b.name,"pt-BR")).map(e=>`<option value="${esc(e.name)}"></option>`).join("")}</datalist>
        </div>
        <div class="field" style="margin-bottom:0"><label>Mês</label><input type="month" class="input" id="calMonth" value="${month}" /></div>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px;font-size:13px">${esc(employee.name)} <span style="color:var(--muted);font-weight:400;font-size:11.5px">— ${shift?shiftLabel(shift):"sem turno padrão"}</span></div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px">
          ${WEEKDAY_LABELS.map(w=>`<div style="text-align:center;font-size:9.5px;color:var(--muted);font-weight:700">${w}</div>`).join("")}
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells.map(cellHTML).join("")}</div>
        <div class="legend" style="margin-top:10px;font-size:10px;row-gap:4px">
          <span><span class="dot" style="background:rgba(52,211,153,.8)"></span>Trabalhou</span>
          <span><span class="dot" style="background:rgba(251,113,133,.8)"></span>Falta</span>
          <span><span class="dot" style="background:rgba(251,191,36,.8)"></span>Sem apontamento</span>
          <span><span class="dot" style="background:rgba(167,139,250,.8)"></span>Feriado</span>
        </div>
      </div>
    `;
  }

  // ---------------- Frequência (lançar por turno — a rotina do dia a dia) ----------------
  let frequencySelected = new Set(); // ids de funcionários marcados na Frequência pra apontamento em lote
  function frequenciaHTML(){
    const roster = computeDayRoster(state.frequencyDate);
    const presentIds = new Set(roster.present.map(r=>r.employee.id));
    [...frequencySelected].forEach(id => { if(!presentIds.has(id)) frequencySelected.delete(id); });
    // Quem não tem turno previsto pra essa data (folga por escala, sem turno cadastrado, etc.) não
    // aparece em nenhuma das duas listas abaixo -- computeDayRoster só devolve quem TEM algum turno
    // válido nesse dia. Sem isso, não existia jeito de abrir o lançamento pra alguém fora da escala
    // (ex: cobrindo outro colega, corrigindo um esquecimento) -- o funcionário simplesmente não
    // aparecia em lugar nenhum da tela pra tocar.
    const rosterIds = new Set([...roster.present.map(r=>r.employee.id), ...roster.off.map(r=>r.employee.id)]);
    const notScheduled = state.employees.filter(e=>e.status==="Ativo" && !rosterIds.has(e.id)).sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
    const allSelected = roster.present.length>0 && roster.present.every(r=>frequencySelected.has(r.employee.id));
    const rosterRowHTML = (r, isPresent) => `
      <div class="req-row" data-freqrow="${r.employee.id}">
        <div style="display:flex;align-items:flex-start;gap:10px">
          ${isPresent ? `<input type="checkbox" data-freqcheck="${r.employee.id}" ${frequencySelected.has(r.employee.id)?'checked':''} style="margin-top:3px;width:18px;height:18px;flex-shrink:0" />` : ""}
          <div style="flex:1;min-width:0">
            <div class="d">${esc(r.employee.name)}</div>
            <div class="sub">${isPresent ? (r.shift?esc(r.shift.name):"—") : (r.status==="ferias"?"Férias":"Folga")}</div>
            ${isPresent ? `<span class="badge ${r.status==='presente'?'presente':r.status==='falta'?'falta':''}" style="margin-top:6px;display:inline-block;${!r.status?'background:rgba(251,191,36,.15);color:var(--amber);':''}">${r.status==='presente'?'Trabalhou':r.status==='falta'?'Faltou':'Sem apontamento'}</span>` : ""}
          </div>
        </div>
      </div>`;
    return `
      <div class="row-flex" style="justify-content:space-between;margin-bottom:14px">
        <h2 class="section" style="margin:0">Frequência</h2>
        <span class="link" data-tab="mais">← Mais</span>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="field" style="margin-bottom:0"><label>Data</label><input type="date" class="input" id="freq_date" value="${state.frequencyDate}" /></div>
      </div>
      <div class="row-flex" style="justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap">
        <h2 class="section" style="margin:0">Deveriam trabalhar (${roster.present.length})</h2>
        ${roster.present.length ? `<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)"><input type="checkbox" id="freq_selectAll" ${allSelected?'checked':''} style="width:16px;height:16px" /> Selecionar todos</label>` : ""}
      </div>
      ${frequencySelected.size ? `<button class="btn small" id="bulkAttendanceBtn" type="button" style="margin-bottom:12px">📋 Apontar em lote (${frequencySelected.size})</button>` : ""}
      <div class="card" style="padding:4px 16px;margin-bottom:20px">
        ${roster.present.length ? roster.present.map(r=>rosterRowHTML(r,true)).join("") : `<p class="empty">Ninguém escalado.</p>`}
      </div>
      <h2 class="section">Folga / férias (${roster.off.length})</h2>
      <div class="card" style="padding:4px 16px;margin-bottom:20px">
        ${roster.off.length ? roster.off.map(r=>rosterRowHTML(r,false)).join("") : `<p class="empty">Ninguém de folga/férias.</p>`}
      </div>
      <h2 class="section">Lançar pra quem não está escalado</h2>
      <div class="card">
        ${!notScheduled.length ? `<p class="empty" style="margin:0">Todo mundo ativo já aparece nas listas acima pra esse dia.</p>` : `
        <div class="field" style="margin-bottom:0"><label>Funcionário</label><select class="input" id="freq_notScheduledSelect">
          <option value="">Selecione…</option>
          ${notScheduled.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")}
        </select></div>
        <button class="btn small" id="freq_notScheduledBtn" type="button" style="margin-top:10px">Lançar apontamento</button>
        `}
      </div>
    `;
  }
  // Lançamento individual de um dia — toque num funcionário na Frequência abre isso. Data editável
  // (input nativo, sem o calendário de intervalo do painel desktop — mais direto no celular).
  function openAttendanceModal(employee, dateISO){
    const existing = (employee.attendance||[]).find(a=>a.date===dateISO);
    const info = scheduledDayInfo(employee, dateISO);
    const expected = info.shift ? info.shift.hoursPerDay : 8;
    const f = {
      date: dateISO,
      status: existing ? attendanceStatus(existing) : "presente",
      turno: (existing && TURNOS.includes(existing.turno)) ? existing.turno : (info.shift && TURNOS.includes(info.shift.name) ? info.shift.name : TURNOS[0]),
      hours: existing ? existing.hours : expected,
      justification: (existing && existing.justification) || "",
      atestado: !!(existing && existing.atestado),
      atraso: !!(existing && existing.atraso),
    };
    $("#modalRoot").innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="modal-head"><h3>${esc(employee.name)}</h3><button class="btn ghost small" id="closeModal" type="button">✕</button></div>
          <div class="field"><label>Data</label><input type="date" class="input" id="a_date" value="${f.date}" /></div>
          <div class="field"><label>Status</label>

  // Apontamento em lote pra quem foi marcado na lista de Frequência — mesma lógica do painel desktop
  // (cada funcionário recebe o lançamento só nos próprios dias previstos quando "vários dias" está
  // ligado), adaptada pro layout de tela cheia do celular em vez de modal largo.
  function openBulkAttendanceModal(employees){
    if(!employees.length) return;
    const shiftByEmployee = new Map(employees.map(e => [e.id, state.shifts.find(s=>s.id===e.shiftId)]));
    const expectedByEmployee = new Map(employees.map(e => [e.id, shiftByEmployee.get(e.id)?.hoursPerDay ?? 8]));
    const expectedValues = [...expectedByEmployee.values()];
    const uniformExpected = expectedValues.every(v=>v===expectedValues[0]) ? expectedValues[0] : null;
    let rangeMode = false;
    function expectedHoursForEmployeeAt(employee, dateISO){
      const s = state.shifts.find(sh=>sh.id===shiftIdForEmployeeOnDate(employee, dateISO));
      return s ? s.hoursPerDay : 8;
    }
    function refreshRangeSummary(){
      if(!rangeMode){ $("#b_rangeSummary").style.display = "none"; $("#saveModal").textContent = `Aplicar a ${employees.length} funcionário(s)`; return; }
      const start = $("#b_date").value, until = $("#b_untilDate").value || start;
      $("#b_rangeSummary").style.display = "block";
      if(until < start){ $("#b_rangeSummary").textContent = 'A data "até" precisa ser igual ou depois da data inicial.'; return; }
      const perEmployee = employees.map(e => {
        const n = shiftByEmployee.get(e.id) ? scheduledDatesInRangeForEmployee(e, start, until).length : (Math.round((new Date(until)-new Date(start))/86400000)+1);
        return `${esc(e.name)}: ${n}d`;
      });
      $("#b_rangeSummary").textContent = `Cada funcionário recebe apontamento só nos dias previstos pelo próprio turno dentro do período (${perEmployee.join(" · ")}).`;
      $("#saveModal").textContent = `Aplicar ao período pra ${employees.length} funcionário(s)`;
      refreshCostPreview();
    }
    const useOwnHours = () => { const el = $("#b_useOwnHours"); return el ? el.checked : false; };
    function refreshCostPreview(){
      const box = $("#b_costPreview");
      if(!box) return;
      const status = $("#b_status").value;
      const sharedHours = Number($("#b_hours").value||0);
      const own = useOwnHours();
      if(status!=="presente" || (!own && sharedHours<=0)){ box.style.display = "none"; return; }
      const start = $("#b_date").value, until = rangeMode ? ($("#b_untilDate").value||start) : start;
      let totalCost = 0, totalOvertimeH = 0, anyBilled = false;
      employees.forEach(employee => {
        const empCompany = state.companies.find(c=>c.id===employee.companyId);
        if(!empCompany || !empCompany.billing.hh) return;
        anyBilled = true;
        const expected = expectedHoursForEmployeeAt(employee, start);
        const hours = own ? expected : sharedHours;
        const normalH = Math.min(hours, expected);
        const overtimeH = round2(Math.max(0, hours-expected));
        const pct = Number(overtimeRules.normalPct||0);
        const hhRate = Number(employee.rates?.hh||0);
        const days = rangeMode ? (shiftByEmployee.get(employee.id) ? scheduledDatesInRangeForEmployee(employee, start, until).length : 1) : 1;
        totalOvertimeH += overtimeH*days;
        totalCost += (normalH*hhRate + overtimeH*hhRate*(1+pct/100)) * days;
      });
      if(!anyBilled){ box.style.display = "none"; return; }
      totalOvertimeH = round2(totalOvertimeH);
      box.style.display = "block";
      box.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
        <span style="font-size:11.5px;color:var(--muted)">${totalOvertimeH>0?`Inclui ${totalOvertimeH}h extra no total`:"Sem horas extras"}</span>
        <span style="font-size:15px;font-weight:700;color:var(--brand-light)">${money(totalCost)}</span>
      </div>`;
    }
    $("#modalRoot").innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="modal-head"><h3>Apontar em lote</h3><button class="btn ghost small" id="closeModal" type="button">✕</button></div>
          <p style="font-size:12px;color:var(--muted);margin-top:0">Vai aplicar o mesmo lançamento pra <b>${employees.length} funcionário(s)</b>:</p>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
            ${employees.map(e=>`<span style="background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11.5px">${esc(e.name)} (${expectedByEmployee.get(e.id)}h)</span>`).join("")}
          </div>
          <div class="field"><label>Data</label><input type="date" class="input" id="b_date" value="${state.frequencyDate}" /></div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:-4px 0 12px"><input type="checkbox" id="b_rangeToggle" style="width:auto" /> Apontar vários dias de uma vez</label>
          <div class="field" id="b_untilWrap" style="display:none">
            <label>Até</label>
            <input type="date" class="input" id="b_untilDate" value="${state.frequencyDate}" />
          </div>
          <p id="b_rangeSummary" style="font-size:11px;color:var(--muted);margin:0 0 10px;display:none"></p>
          <div class="field"><label>Turno</label><select class="input" id="b_turno">${TURNOS.map(t=>`<option>${t}</option>`).join("")}</select></div>
          ${uniformExpected===null ? `
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:2px 0 10px">
            <input type="checkbox" id="b_useOwnHours" checked style="width:auto" /> Usar o horário padrão de cada funcionário (os selecionados têm turnos diferentes: ${[...new Set(expectedValues)].join('h / ')}h)
          </label>` : ""}
          <div class="field"><label>Horas trabalhadas</label><input type="number" step="0.5" class="input" id="b_hours" value="${uniformExpected!==null?uniformExpected:expectedValues[0]}" ${uniformExpected===null?'disabled':''} /></div>
          <div class="field"><label>Situação</label>
            <select class="input" id="b_status">${ATTENDANCE_STATUSES.map(s=>`<option value="${s}">${ATTENDANCE_STATUS_LABELS[s]}</option>`).join("")}</select>
          </div>
          <p style="font-size:11px;color:var(--muted);margin:0 0 10px">${uniformExpected!==null ? `Horas puxadas do turno de todos (${uniformExpected}h) quando presente.` : `Desmarque acima pra informar um valor único pra todos em vez do padrão de cada um.`} Falta/folga zeram as horas.</p>
          <div class="field" id="b_atestadoWrap" style="display:none">
            <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="b_atestado" style="width:auto" /> Atestado médico (falta justificada)</label>
          </div>
          <div class="field" id="b_atrasoWrap" style="display:none">
            <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="b_atraso" style="width:auto" /> Atraso</label>
          </div>
          <div class="field"><label id="b_justifyLabel">Observação (opcional)</label><textarea class="input" id="b_justify" rows="2"></textarea></div>
          <div class="card" id="b_costPreview" style="display:none;margin-bottom:14px"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="cancelModal" type="button">Cancelar</button>
            <button class="btn" id="saveModal" type="button">Aplicar a ${employees.length} funcionário(s)</button>
          </div>
        </div>
      </div>
    `;
    refreshCostPreview();
    const close = () => { $("#modalRoot").innerHTML = ""; };
    $("#closeModal").addEventListener("click", close);
    $("#cancelModal").addEventListener("click", close);
    $("#backdrop").addEventListener("click", e => { if(e.target.id==="backdrop") close(); });
    const anyMismatch = () => {
      if($("#b_status").value!=="presente") return false;
      if(useOwnHours()) return false; // cada um recebe o próprio padrão, não existe "descompasso" aqui
      const hours = Number($("#b_hours").value||0);
      const dateForCheck = $("#b_date").value;
      return employees.some(e => Math.abs(hours - expectedHoursForEmployeeAt(e, dateForCheck)) > 0.001);
    };
    const refreshJustifyLabel = () => { $("#b_justifyLabel").textContent = anyMismatch() ? "Motivo da alteração das horas (obrigatório)" : "Observação (opcional)"; };
    $("#b_hours").addEventListener("input", () => { refreshJustifyLabel(); refreshCostPreview(); });
    const useOwnHoursEl = $("#b_useOwnHours");
    if(useOwnHoursEl) useOwnHoursEl.addEventListener("change", () => {
      $("#b_hours").disabled = useOwnHoursEl.checked;
      refreshJustifyLabel(); refreshCostPreview();
    });
    $("#b_status").addEventListener("change", () => {
      const status = $("#b_status").value;
      const hoursInput = $("#b_hours");
      if(status==="presente"){
        hoursInput.disabled = false;
        if(Number(hoursInput.value)===0) hoursInput.value = uniformExpected!==null ? uniformExpected : expectedValues[0];
      } else {
        hoursInput.value = 0;
        hoursInput.disabled = true;
      }
      $("#b_atestadoWrap").style.display = status==="falta" ? "block" : "none";
      $("#b_atrasoWrap").style.display = status==="presente" ? "block" : "none";
      refreshJustifyLabel();
      refreshCostPreview();
    });
    $("#b_rangeToggle").addEventListener("change", e => {
      rangeMode = e.target.checked;
      $("#b_untilWrap").style.display = rangeMode ? "block" : "none";
      if(rangeMode && $("#b_untilDate").value < $("#b_date").value) $("#b_untilDate").value = $("#b_date").value;
      refreshRangeSummary();
    });
    $("#b_date").addEventListener("change", refreshRangeSummary);
    $("#b_untilDate").addEventListener("change", refreshRangeSummary);
    $("#saveModal").addEventListener("click", async () => {
      const status = $("#b_status").value;
      const own = useOwnHours();
      const sharedHours = Number($("#b_hours").value||0);
      const justification = $("#b_justify").value.trim();
      if(anyMismatch() && !justification){
        alert("As horas informadas não batem com o padrão do turno de pelo menos um funcionário selecionado. Preencha o motivo antes de aplicar.");
        return;
      }
      const start = $("#b_date").value;
      const until = rangeMode ? ($("#b_untilDate").value || start) : start;
      if(!start){ alert("Selecione uma data."); return; }
      if(rangeMode && until < start){
        alert('A data "até" precisa ser igual ou depois da data inicial.');
        return;
      }
      const turno = $("#b_turno").value;
      const atestado = status==="falta" && $("#b_atestado").checked;
      const atraso = status==="presente" && $("#b_atraso").checked;
      const skippedEmployees = [];
      const rows = [];
      const entriesByEmployee = [];
      employees.forEach(employee => {
        const shift = shiftByEmployee.get(employee.id);
        let dates;
        if(!rangeMode) dates = [start];
        else if(shift) dates = scheduledDatesInRangeForEmployee(employee, start, until);
        else { dates = []; let cursor = start, guard = 0; while(cursor <= until && guard < 1100){ dates.push(cursor); cursor = addDays(cursor,1); guard++; } }
        if(!dates.length){ skippedEmployees.push(employee.name); return; }
        const newEntries = dates.map(date => {
          const expectedHours = expectedHoursForEmployeeAt(employee, date);
          return {
            id: uid(), date, turno, hours: status==="presente" ? (own ? expectedHours : sharedHours) : 0, status, expectedHours,
            justification, atestado, atraso,
          };
        });
        const dateSet = new Set(dates);
        employee.attendance = [...(employee.attendance||[]).filter(a=>!dateSet.has(a.date)), ...newEntries];
        newEntries.forEach(entry => rows.push(attendanceToRow(employee.id, entry)));
        entriesByEmployee.push([employee.id, newEntries]);
      });
      const btn = $("#saveModal"); btn.disabled = true; btn.textContent = "Salvando…";
      const { error } = await trackedCloudCall(supabase.from("attendance").upsert(rows, { onConflict:"employee_id,date" }));
      if(error){ alert("Não consegui salvar: "+error.message); btn.disabled = false; btn.textContent = `Aplicar a ${employees.length} funcionário(s)`; return; }
      frequencySelected.clear();
      close();
      render();
      if(skippedEmployees.length) alert(`Nenhum dia previsto no período pra: ${skippedEmployees.join(", ")}.`);
      entriesByEmployee.forEach(([employeeId, newEntries]) => notifyPerformanceEntries(employeeId, newEntries));
    });
  }

  function wireView(){

      if(el.dataset.tab==="logout"){ await supabase.auth.signOut(); state = {...state, view:"auth", session:null, profile:null}; render(); return; }
      if(el.dataset.tab==="fotorelatorio" && state.tab!=="fotorelatorio"){
        state.prTab = "list";
        prRefreshList().then(() => { if(state.tab==="fotorelatorio") render(); });
      }
      state.tab = el.dataset.tab; render();
    }));
    document.querySelectorAll("[data-goto]").forEach(el => el.addEventListener("click", () => { state.tab = el.dataset.goto; render(); }));

    }
    if(state.tab==="dss"){
      document.querySelectorAll("[data-dsstopic]").forEach(el => el.addEventListener("click", () => { state.dssFormDate = el.dataset.dsstopic; render(); }));
      const dateInput = $("#dss_date");
      if(dateInput) dateInput.addEventListener("change", () => { state.dssFormDate = dateInput.value; render(); });
      const saveBtn = $("#dss_saveBtn");
      if(saveBtn) saveBtn.addEventListener("click", async () => {
        const date = $("#dss_date").value;
        const title = $("#dss_title").value.trim();
        const description = $("#dss_description").value.trim();
        if(!title){ alert("Informe o título do tema."); return; }
        const isNew = !state.dssTopics.some(t=>t.date===date);
        saveBtn.disabled = true; saveBtn.textContent = "Salvando…";
        const { error } = await supabase.from("dss_topics").upsert(dssTopicToRow({date,title,description}), {onConflict:"date"});
        if(error){ alert("Não consegui salvar o tema de DSS: "+error.message); saveBtn.disabled = false; saveBtn.textContent = "💾 Salvar tema"; return; }
        state.dssTopics = [{ id: state.dssTopics.find(t=>t.date===date)?.id || uid(), date, title, description }, ...state.dssTopics.filter(t=>t.date!==date)];
        state.dssFormDate = date;
        render();
        if(isNew){
          const rows = state.employees.filter(e=>e.status==="Ativo").map(e => ({ employee_id:e.id, type:"dss", title:"Novo tema de DSS disponível", body:`Tema de hoje: ${title}` }));
          insertNotifications(rows);
        }
      });
    }
    if(state.tab==="checklist"){
      const subTabs = document.querySelectorAll("[data-checklistsub]");
      if(subTabs.length){
        subTabs.forEach(el => el.addEventListener("click", () => { state.checklistSubTab = el.dataset.checklistsub; render(); }));
      }
      if(state.checklistSubTab==="historico"){
        const monthInput = $("#checklistHistMonth"), empSelect = $("#checklistHistEmployee"), catSelect = $("#checklistHistCategory");
        const reload = async () => {
          state.checklistHistoryMonth = monthInput.value;
          state.checklistHistoryEmployeeId = empSelect.value;
          state.checklistHistoryCategoryId = catSelect.value;
          await fetchChecklistHistory({ month: state.checklistHistoryMonth, employeeId: state.checklistHistoryEmployeeId, categoryId: state.checklistHistoryCategoryId });
          render();
        };
        if(monthInput) monthInput.addEventListener("change", reload);
        if(empSelect) empSelect.addEventListener("change", reload);
        if(catSelect) catSelect.addEventListener("change", reload);
        if(!checklistHistoryLoaded){ checklistHistoryLoaded = true; reload(); }
        document.querySelectorAll("[data-histentry]").forEach(el => el.addEventListener("click", () => {
          const detail = document.querySelector(`[data-histdetail="${el.dataset.histentry}"]`);
          if(detail) detail.style.display = detail.style.display==="none" ? "block" : "none";
        }));
      } else {
        const newCatBtn = $("#newChecklistCategoryBtn");
        if(newCatBtn) newCatBtn.addEventListener("click", () => openChecklistCategoryModal(null));
        document.querySelectorAll("[data-checklistcat]").forEach(el => el.addEventListener("click", () => { state.checklistModeloCategoryId = el.dataset.checklistcat; render(); }));
        const editCatBtn = $("#editChecklistCategoryBtn");
        if(editCatBtn) editCatBtn.addEventListener("click", () => openChecklistCategoryModal(state.checklistCategories.find(c=>c.id===state.checklistModeloCategoryId)));
        const delCatBtn = $("#delChecklistCategoryBtn");
        if(delCatBtn) delCatBtn.addEventListener("click", async () => {
          const delId = state.checklistModeloCategoryId;
          const areaCount = state.checklistAreas.filter(a=>a.categoryId===delId).length;
          if(!confirm(areaCount ? `Essa categoria tem ${areaCount} área(s). Excluir a categoria também apaga as áreas e equipamentos dela. Continuar?` : "Excluir esta categoria?")) return;
          const { error } = await supabase.from("checklist_categories").delete().eq("id", delId);
          if(error){ alert("Não consegui excluir: "+error.message); return; }
          const removedAreaIds = new Set(state.checklistAreas.filter(a=>a.categoryId===delId).map(a=>a.id));
          state.checklistCategories = state.checklistCategories.filter(c=>c.id!==delId);
          state.checklistAreas = state.checklistAreas.filter(a=>a.categoryId!==delId);
          state.checklistEquipment = state.checklistEquipment.filter(e=>!removedAreaIds.has(e.areaId));
          state.checklistModeloCategoryId = "";
          render();
        });
        const newAreaBtn = $("#newChecklistAreaBtn");
        if(newAreaBtn) newAreaBtn.addEventListener("click", () => openChecklistAreaModal(null, state.checklistModeloCategoryId));
        document.querySelectorAll("[data-editarea]").forEach(el => el.addEventListener("click", () => openChecklistAreaModal(state.checklistAreas.find(a=>a.id===el.dataset.editarea))));
        document.querySelectorAll("[data-delarea]").forEach(el => el.addEventListener("click", async () => {
          const delId = el.dataset.delarea;
          const hasEquip = state.checklistEquipment.some(e=>e.areaId===delId);
          if(!confirm(hasEquip ? "Essa área tem equipamentos. Excluir a área também apaga os equipamentos dela. Continuar?" : "Excluir esta área?")) return;
          const { error } = await supabase.from("checklist_areas").delete().eq("id", delId);
          if(error){ alert("Não consegui excluir: "+error.message); return; }
          state.checklistAreas = state.checklistAreas.filter(a=>a.id!==delId);
          state.checklistEquipment = state.checklistEquipment.filter(e=>e.areaId!==delId);
          render();
        }));
        document.querySelectorAll("[data-newequip]").forEach(el => el.addEventListener("click", () => openChecklistEquipmentModal(null, el.dataset.newequip)));
        document.querySelectorAll("[data-editequip]").forEach(el => el.addEventListener("click", () => openChecklistEquipmentModal(state.checklistEquipment.find(e=>e.id===el.dataset.editequip))));
        document.querySelectorAll("[data-delequip]").forEach(el => el.addEventListener("click", async () => {
          if(!confirm("Excluir este equipamento?")) return;
          const delId = el.dataset.delequip;
          const { error } = await supabase.from("checklist_equipment").delete().eq("id", delId);
          if(error){ alert("Não consegui excluir: "+error.message); return; }
          state.checklistEquipment = state.checklistEquipment.filter(e=>e.id!==delId);
          render();
        }));
      }
    } else {
      checklistHistoryLoaded = false;
    }
    if(state.tab==="pcm"){
      $$("[data-pcmsub]").forEach(el => el.addEventListener("click", () => { state.pcmSubTab = el.dataset.pcmsub; render(); }));
      if(state.pcmSubTab==="distribuidas"){
        const searchInput = $("#pcmDistSearchInput");
        if(searchInput) searchInput.addEventListener("input", e => { state.pcmDistribuidasSearch = e.target.value; render(); });
        const setorFilter = $("#pcmDistSetorFilter");
        if(setorFilter) setorFilter.addEventListener("change", e => { state.pcmDistribuidasSetorFilter = e.target.value; render(); });
        const distDateFilter = $("#pcmDistDateFilter");
        if(distDateFilter) distDateFilter.addEventListener("change", e => { state.pcmDistribuidasDateFilter = e.target.value; render(); });
        const distDateClear = $("#pcmDistDateFilterClear");
        if(distDateClear) distDateClear.addEventListener("click", () => { state.pcmDistribuidasDateFilter = ""; render(); });
        $$("[data-pcmscheduledate]").forEach(el => el.addEventListener("change", async () => {
          const o = state.serviceOrders.find(x=>x.id===el.dataset.pcmscheduledate); if(!o) return;
          if(o.scheduledDate && el.value && o.scheduledDate!==el.value) o.reprogrammedCount = (o.reprogrammedCount||0)+1;
          o.scheduledDate = el.value;
          render();
          await cloudUpsertServiceOrder(o);
        }));
        $$("[data-pcmfinalizar]").forEach(el => el.addEventListener("click", async () => {
          const o = state.serviceOrders.find(x=>x.id===el.dataset.pcmfinalizar); if(!o) return;
          o.status = "realizada"; o.completedAt = new Date().toISOString();
          render();
          await cloudUpsertServiceOrder(o);
        }));
        $$("[data-pcmrevert]").forEach(el => el.addEventListener("click", async () => {
          if(!confirm("Voltar esta OS pro backlog?")) return;
          const o = state.serviceOrders.find(x=>x.id===el.dataset.pcmrevert); if(!o) return;
          o.status = "backlog"; o.distributedAt = ""; o.scheduledDate = ""; o.reprogrammedCount = 0;
          render();
          await cloudUpsertServiceOrder(o);
        }));
        $$("[data-pcmdistsel]").forEach(el => el.addEventListener("change", () => {
          if(el.checked) pcmDistribuidasSelected.add(el.dataset.pcmdistsel); else pcmDistribuidasSelected.delete(el.dataset.pcmdistsel);
          render();
        }));
        const bulkFinalizarBtn = $("#pcmBulkFinalizarBtn");
        if(bulkFinalizarBtn) bulkFinalizarBtn.addEventListener("click", async () => {
          const targets = [...pcmDistribuidasSelected].map(id=>state.serviceOrders.find(o=>o.id===id)).filter(o=>o && o.status!=="realizada");
          const completedAt = new Date().toISOString();
          targets.forEach(o => { o.status = "realizada"; o.completedAt = completedAt; });
          pcmDistribuidasSelected.clear();
          render();
          await Promise.all(targets.map(cloudUpsertServiceOrder));
        });
        const bulkReprogramBtn = $("#pcmBulkReprogramBtn");
        if(bulkReprogramBtn) bulkReprogramBtn.addEventListener("click", async () => {
          const newDate = $("#pcmBulkReprogramDate")?.value;
          if(!newDate){ alert("Escolha a nova data antes de reprogramar."); return; }
          const targets = [...pcmDistribuidasSelected].map(id=>state.serviceOrders.find(o=>o.id===id)).filter(Boolean);
          targets.forEach(o => {
            if(o.scheduledDate && o.scheduledDate!==newDate) o.reprogrammedCount = (o.reprogrammedCount||0)+1;
            o.scheduledDate = newDate;
          });
          pcmDistribuidasSelected.clear();
          render();
          await Promise.all(targets.map(cloudUpsertServiceOrder));
        });
        const bulkRevertBtn = $("#pcmBulkRevertBtn");
        if(bulkRevertBtn) bulkRevertBtn.addEventListener("click", async () => {
          const targets = [...pcmDistribuidasSelected].map(id=>state.serviceOrders.find(o=>o.id===id)).filter(Boolean);
          if(!confirm(`Voltar ${targets.length} OS selecionada(s) pro backlog?`)) return;
          targets.forEach(o => { o.status = "backlog"; o.distributedAt = ""; o.scheduledDate = ""; o.reprogrammedCount = 0; });
          pcmDistribuidasSelected.clear();
          render();
          await Promise.all(targets.map(cloudUpsertServiceOrder));
        });
      } else if(state.pcmSubTab==="finalizadas"){
        const searchInput = $("#pcmFinalizadasSearchInput");
        if(searchInput) searchInput.addEventListener("input", e => { state.pcmFinalizadasSearch = e.target.value; render(); });
        const setorFilter = $("#pcmFinalizadasSetorFilter");
        if(setorFilter) setorFilter.addEventListener("change", e => { state.pcmFinalizadasSetorFilter = e.target.value; render(); });
        const finDateFilter = $("#pcmFinalizadasDateFilter");
        if(finDateFilter) finDateFilter.addEventListener("change", e => { state.pcmFinalizadasDateFilter = e.target.value; render(); });
        const finDateClear = $("#pcmFinalizadasDateFilterClear");
        if(finDateClear) finDateClear.addEventListener("click", () => { state.pcmFinalizadasDateFilter = ""; render(); });
        $$("[data-pcmreabrir]").forEach(el => el.addEventListener("click", async () => {
          const o = state.serviceOrders.find(x=>x.id===el.dataset.pcmreabrir); if(!o) return;
          o.status = "distribuida"; o.completedAt = "";
          render();
          await cloudUpsertServiceOrder(o);
        }));
      } else if(state.pcmSubTab==="painel"){
        const dateInput = $("#pcmPainelDate");
        if(dateInput) dateInput.addEventListener("change", e => { state.pcmPainelDate = e.target.value; render(); });
        const weekInput = $("#pcmPainelWeek");
        if(weekInput) weekInput.addEventListener("change", e => { state.pcmPainelWeek = e.target.value; render(); });
        const monthInput = $("#pcmPainelMonth");
        if(monthInput) monthInput.addEventListener("change", e => { state.pcmPainelMonth = e.target.value; render(); });
        $$("[data-pcmpainelmode]").forEach(el => el.addEventListener("click", () => { state.pcmPainelViewMode = el.dataset.pcmpainelmode; render(); }));
      } else {
        const searchInput = $("#pcmBacklogSearchInput");
        if(searchInput) searchInput.addEventListener("input", e => { state.pcmBacklogSearch = e.target.value; render(); });
        const setorFilter = $("#pcmBacklogSetorFilter");
        if(setorFilter) setorFilter.addEventListener("change", e => { state.pcmBacklogSetorFilter = e.target.value; render(); });
        $$("[data-pcmsetor]").forEach(el => el.addEventListener("change", async () => {
          const o = state.serviceOrders.find(x=>x.id===el.dataset.pcmsetor); if(!o) return;
          o.setor = el.value;
          render();
          await cloudUpsertServiceOrder(o);
        }));
        $$("[data-pcmdistribuir]").forEach(el => el.addEventListener("click", async () => {
          const o = state.serviceOrders.find(x=>x.id===el.dataset.pcmdistribuir); if(!o || !o.setor) return;
          o.status = "distribuida"; o.distributedAt = new Date().toISOString();
          if(!o.scheduledDate) o.scheduledDate = pcmFirstScheduledDate(o.weekStart, o.schedule);
          render();
          await cloudUpsertServiceOrder(o);
        }));
        $$("[data-pcmdescartar]").forEach(el => el.addEventListener("click", async () => {
          if(!confirm("Descartar esta OS do backlog? Ela não aparecerá mais em lugar nenhum do sistema.")) return;
          const id = el.dataset.pcmdescartar;
          state.serviceOrders = state.serviceOrders.filter(x=>x.id!==id);
          render();
          await cloudDeleteServiceOrder(id);
        }));
        const backlogSelAll = $("#pcmBacklogSelAll");
        if(backlogSelAll) backlogSelAll.addEventListener("change", () => {
          const q = (state.pcmBacklogSearch||"").trim().toLowerCase();
          const visible = state.serviceOrders
            .filter(o=>o.status==="backlog")
            .filter(o=>!state.pcmBacklogSetorFilter || o.setor===state.pcmBacklogSetorFilter)
            .filter(o=>!q || [o.osNumber,o.description,o.tag,o.assetName].join(" ").toLowerCase().includes(q));
          if(backlogSelAll.checked) visible.forEach(o=>pcmBacklogSelected.add(o.id)); else visible.forEach(o=>pcmBacklogSelected.delete(o.id));
          render();
        });
        $$("[data-pcmbacklogsel]").forEach(el => el.addEventListener("change", () => {
          if(el.checked) pcmBacklogSelected.add(el.dataset.pcmbacklogsel); else pcmBacklogSelected.delete(el.dataset.pcmbacklogsel);
          render();
        }));
        const bulkSetorBtn = $("#pcmBulkSetorBtn");
        if(bulkSetorBtn) bulkSetorBtn.addEventListener("click", async () => {
          const setorValue = $("#pcmBulkSetorSelect")?.value;
          if(!setorValue){ alert("Escolha um setor antes de aplicar."); return; }
          const targets = [...pcmBacklogSelected].map(id=>state.serviceOrders.find(o=>o.id===id)).filter(Boolean);
          targets.forEach(o => { o.setor = setorValue; });
          render();
          await Promise.all(targets.map(cloudUpsertServiceOrder));
        });
        const bulkDistribuirBtn = $("#pcmBulkDistribuirBtn");
        if(bulkDistribuirBtn) bulkDistribuirBtn.addEventListener("click", async () => {
          const all = [...pcmBacklogSelected].map(id=>state.serviceOrders.find(o=>o.id===id)).filter(Boolean);
          const targets = all.filter(o=>o.setor);
          const missing = all.filter(o=>!o.setor);
          if(missing.length) alert(`${missing.length} OS selecionada(s) ainda sem setor definido -- essas continuam no Backlog: ${missing.map(o=>o.osNumber).join(", ")}.`);
          if(!targets.length) return;
          targets.forEach(o => { o.status = "distribuida"; o.distributedAt = new Date().toISOString(); if(!o.scheduledDate) o.scheduledDate = pcmFirstScheduledDate(o.weekStart, o.schedule); });
          pcmBacklogSelected.clear();
          render();
          await Promise.all(targets.map(cloudUpsertServiceOrder));
        });
        const bulkDescartarBtn = $("#pcmBulkDescartarBtn");
        if(bulkDescartarBtn) bulkDescartarBtn.addEventListener("click", async () => {
          const ids = [...pcmBacklogSelected];
          if(!confirm(`Descartar ${ids.length} OS selecionada(s) do backlog? Elas não aparecerão mais em lugar nenhum do sistema.`)) return;
          state.serviceOrders = state.serviceOrders.filter(o=>!ids.includes(o.id));
          pcmBacklogSelected.clear();
          render();
          await Promise.all(ids.map(cloudDeleteServiceOrder));
        });
      }
    }
    if(state.tab==="banners"){
      wireBanners();
    }
    if(state.tab==="fotorelatorio"){
      wirePhotoReport();
    }
  }

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => { navigator.serviceWorker.register("./sw-gestor.js").catch(()=>{}); });
  }

  bootstrap();
})();
</script>
</body>
</html>
