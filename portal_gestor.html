<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Fertgrow Gestão</title>
<link rel="manifest" href="manifest-gestor.json" />
<meta name="theme-color" content="#0B6B33" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Fertgrow Gestão" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#0a1410; --surface:#101d16; --surface2:#16261d; --border:#213328;
    --text:#e9f2ea; --muted:#8aa08d; --brand:#0B6B33; --brand-light:#AFD676;
    --emerald:#34d399; --amber:#fbbf24; --rose:#fb7185; --cyan:#22d3ee; --violet:#a78bfa;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Inter,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:76px;}
  header.top{padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,20,16,.95);backdrop-filter:blur(6px);z-index:20;}
  header.top .brand{font-weight:700;font-size:15px;}
  header.top .who{font-size:12px;color:var(--muted);margin-top:2px;}
  main{flex:1;padding:16px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:9px;font-size:15px;}
  .input:focus{outline:none;border-color:var(--brand);}
  .btn{width:100%;background:var(--brand);color:#fff;border:none;padding:12px 16px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn:active{background:var(--brand-light);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn.small{padding:8px 12px;font-size:13px;width:auto;}
  .btn.danger{background:var(--rose);}
  .msg{font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;}
  .msg.err{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fca5b1;}
  .msg.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#6ee7b7;}
  .tabs2{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:10px;margin-bottom:16px;overflow-x:auto;}
  .tabs2 .t{flex:0 0 auto;text-align:center;padding:8px 12px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .tabs2 .t.active{background:var(--brand);color:#fff;font-weight:600;}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;max-width:480px;margin:0 auto;z-index:30;}
  nav.bottom .n{flex:1;text-align:center;padding:10px 4px 12px;color:var(--muted);cursor:pointer;font-size:11px;position:relative;}
  nav.bottom .n .ic{font-size:19px;display:block;margin-bottom:2px;}
  nav.bottom .n.active{color:var(--brand-light);}
  .nav-badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--rose);color:#fff;border-radius:999px;min-width:16px;height:16px;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  h2.section{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px;font-weight:700;}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi .label{font-size:11px;color:var(--muted);}
  .kpi .value{font-size:22px;font-weight:700;margin-top:4px;}
  .kpi-click{cursor:pointer;}
  .tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 14px;cursor:pointer;text-align:center;}
  .tile:active{border-color:var(--brand-light);}
  .tile .ic{font-size:24px;display:block;margin-bottom:6px;}
  .tile .lbl{font-size:12.5px;font-weight:600;}
  .menu-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid rgba(33,51,40,.6);cursor:pointer;}
  .menu-row:last-child{border-bottom:none;}
  .menu-row .lbl{font-size:14px;font-weight:600;}
  .menu-row .ic{font-size:18px;margin-right:10px;}
  .menu-row .arrow{color:var(--muted);}
  .badge{padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge.presente{background:rgba(11,107,51,.15);color:var(--brand-light);border:1px solid rgba(11,107,51,.35);}
  .badge.falta{background:rgba(251,113,133,.15);color:var(--rose);border:1px solid rgba(251,113,133,.35);}
  .badge.folga{background:#1c2b21;color:var(--muted);}
  .badge.ferias{background:rgba(34,211,238,.15);color:var(--cyan);border:1px solid rgba(34,211,238,.35);}
  .badge.pendente{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.35);}
  .badge.aprovado{background:rgba(52,211,153,.15);color:var(--emerald);border:1px solid rgba(52,211,153,.35);}
  .badge.rejeitado{background:rgba(251,113,133,.15);color:var(--rose);border:1px solid rgba(251,113,133,.35);}
  .ts-progress{background:rgba(11,107,51,.15);color:var(--brand-light);border:1px solid rgba(11,107,51,.35);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(4,10,7,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
  .modal h3{margin:0;font-size:16px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .req-row{padding:12px 0;border-bottom:1px solid rgba(33,51,40,.6);cursor:pointer;}
  .req-row:last-child{border-bottom:none;}
  .req-row .d{font-size:13.5px;font-weight:600;}
  .req-row .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .row-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:13px;}
  .spinner{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
  .alert-banner{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.3);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;}
  a.link{color:var(--brand-light);cursor:pointer;text-decoration:underline;font-size:13px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  // ===================================================================
  // CONFIGURAÇÃO — mesmo projeto Supabase do painel e do portal do colaborador.
  // ===================================================================
  const SUPABASE_URL = "https://eusvotyusfwxolczqzlc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_2Uee6RYvUtvR5m4Vy6yyDQ_fgEeGEsX";

  const configured = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  const supabase = configured && window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // ---------------- helpers ----------------
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // new Date().toISOString() converte pra UTC — perto da meia-noite local (Brasil, UTC-3) isso pode
  // devolver o dia de AMANHÃ. Monta a data a partir dos componentes locais em vez disso.
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c==="x" ? r : (r&0x3|0x8);
    return v.toString(16);
  });
  function toISO(d){ return d.toISOString().slice(0,10); }
  function brDate(iso){ if(!iso) return "—"; const [y,m,d]=String(iso).slice(0,10).split("-"); return `${d}/${m}/${y}`; }
  function addDays(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return toISO(d); }
  function addMonths(monthStr, delta){
    const [y,m] = monthStr.split("-").map(Number);
    const d = new Date(y, (m-1)+delta, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }
  function diffDays(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
  function round2(n){ return Math.round((Number(n)||0)*100)/100; }
  function money(n){ return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}); }
  function monthRangeLabel(month){
    const [y,m] = month.split("-");
    return new Date(+y, +m-1, 1).toLocaleDateString("pt-BR", {month:"long", year:"numeric"});
  }
  const WEEKDAY_LABELS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const WEEKDAY_LABELS_LONG = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const BILLING_KEYS = ["hh","insalubridade","periculosidade","bonusAssiduidade","planoSaude","valeTransporte","valeRefeicao"];
  const BILLING_LABELS = {
    hh:"H.H (hora trabalhada)", insalubridade:"Insalubridade", periculosidade:"Periculosidade",
    bonusAssiduidade:"Bônus assiduidade", planoSaude:"Plano de saúde",
    valeTransporte:"Vale transporte", valeRefeicao:"Vale refeição",
  };
  const TURNOS = ["Manhã","Tarde","Noite","Turno único"];
  const ATTENDANCE_STATUSES = ["presente","falta","folga","ferias"];
  const ATTENDANCE_STATUS_LABELS = { presente:"Presente", falta:"Falta", folga:"Folga", ferias:"Férias" };
  const TIME_OFF_TYPE_LABEL = { falta:"Falta", folga:"Folga", ferias:"Férias", solicitacao_geral:"Solicitação", atraso:"Atraso" };
  const REQUEST_STATUS_LABEL = { pendente:"Pendente", aprovado:"Aprovado", rejeitado:"Rejeitado" };
  function attendanceStatus(entry){
    if(!entry) return null;
    if(entry.status) return entry.status;
    return entry.present ? "presente" : "falta";
  }
  // Padrão CLT mínimo (Art. 7º XVI) — sobrescrito em loadAllData() com o valor real configurado no
  // painel desktop (tabela overtime_rules), se o schema já tiver essa tabela.
  const overtimeRules = { normalPct: 50, restDayPct: 100 };

  // ---------------- conversores linha<->objeto (mesmo formato do painel do gestor) ----------------
  function companyFromRow(r){ return { id:r.id, name:r.name, billing:r.billing||{}, roleRates:r.role_rates||[] }; }
  function companyToRow(c){ return { id:c.id, name:c.name, billing:c.billing||{}, role_rates:c.roleRates||[] }; }
  function shiftFromRow(r){ return { id:r.id, name:r.name, startTime:r.start_time, endTime:r.end_time, breakMinutes:r.break_minutes, hoursPerDay:r.hours_per_day, weeklyHours:r.weekly_hours, mode:r.mode, weekdays:r.weekdays||[], cycleWork:r.cycle_work, cycleRest:r.cycle_rest, cycleAnchor:r.cycle_anchor }; }
  function shiftToRow(s){ return { id:s.id, name:s.name, start_time:s.startTime, end_time:s.endTime, break_minutes:Number(s.breakMinutes||0), hours_per_day:Number(s.hoursPerDay||0), weekly_hours:Number(s.weeklyHours||44), mode:s.mode, weekdays:s.weekdays||[], cycle_work:Number(s.cycleWork||1), cycle_rest:Number(s.cycleRest||1), cycle_anchor:s.cycleAnchor||null }; }
  function holidayFromRow(r){ return { id:r.id, date:r.date, name:r.name, recurring:!!r.recurring }; }
  function holidayToRow(h){ return { id:h.id, date:h.date, name:h.name, recurring:!!h.recurring }; }
  function dssTopicFromRow(r){ return { id:r.id, date:r.date, title:r.title, description:r.description||"" }; }
  function dssTopicToRow(t){ return { date:t.date, title:t.title, description:t.description||"" }; }
  function checklistCategoryFromRow(r){ return { id:r.id, name:r.name, order:r.order||0 }; }
  function checklistCategoryToRow(c){ return { id:c.id, name:c.name, order:c.order||0 }; }
  function checklistAreaFromRow(r){ return { id:r.id, categoryId:r.category_id, name:r.name, order:r.order||0 }; }
  function checklistAreaToRow(a){ return { id:a.id, category_id:a.categoryId, name:a.name, order:a.order||0 }; }
  function checklistEquipmentFromRow(r){ return { id:r.id, areaId:r.area_id, name:r.name, order:r.order||0 }; }
  function checklistEquipmentToRow(e){ return { id:e.id, area_id:e.areaId, name:e.name, order:e.order||0 }; }
  function employeeToRow(e){ return { id:e.id, name:e.name, email:e.email?e.email.trim().toLowerCase():null, cargo:e.cargo||"", company_id:e.companyId||null, shift_id:e.shiftId||null, admissao:e.admissao||null, status:e.status||"Ativo", rates:e.rates||{}, ferias_saldo_dias: e.feriasSaldoDias ?? 30 }; }
  function employeeFromRow(r, attendance, shiftHistory, profile){ return { id:r.id, name:r.name, email:r.email||"", cargo:r.cargo||"", companyId:r.company_id||"", shiftId:r.shift_id||"", admissao:r.admissao||"", status:r.status||"Ativo", rates:r.rates||{}, feriasSaldoDias: r.ferias_saldo_dias ?? 30, attendance: attendance||[], shiftHistory: shiftHistory||[], profileId: profile?.id||null, lockedAt: profile?.locked_at||null }; }
  function shiftHistoryRowToObj(r){ return { id:r.id, shiftId:r.shift_id, effectiveFrom:r.effective_from }; }
  function shiftHistoryObjToRow(employeeId, h){ return { employee_id:employeeId, shift_id:h.shiftId||null, effective_from:h.effectiveFrom }; }
  function attendanceToRow(employeeId, a){ return { id:a.id, employee_id:employeeId, date:a.date, turno:a.turno||"", hours:Number(a.hours||0), status: attendanceStatus(a), expected_hours: a.expectedHours ?? null, justification: a.justification||"", atestado: !!a.atestado, atraso: !!a.atraso }; }
  function attendanceFromRow(r){ return { id:r.id, date:r.date, turno:r.turno||"", hours:Number(r.hours||0), status:r.status, expectedHours:r.expected_hours, justification:r.justification||"", atestado: !!r.atestado, atraso: !!r.atraso }; }
  function timeOffRequestToRow(r){ return { id:r.id, employee_id:r.employeeId, type:r.type, date_start:r.dateStart, date_end:r.dateEnd, reason:r.reason||"", status:r.status||"pendente", dias_vendidos:r.diasVendidos||0, title:r.title||null, admin_response:r.adminResponse||null, admin_responded_at:r.adminRespondedAt||null, colaborador_reply:r.colaboradorReply||null, finalizado_em:r.finalizadoEm||null }; }
  function timeOffRequestFromRow(r){ return { id:r.id, employeeId:r.employee_id, type:r.type, dateStart:r.date_start, dateEnd:r.date_end, reason:r.reason||"", status:r.status, diasVendidos:r.dias_vendidos||0, createdAt:r.created_at, title:r.title||"", adminResponse:r.admin_response||"", ticketNumber:r.ticket_number||null, adminRespondedAt:r.admin_responded_at||null, colaboradorReply:r.colaborador_reply||"", finalizadoEm:r.finalizado_em||null }; }

  // ---------------- cálculos de turno/frequência/custo (mesma lógica do painel do gestor) ----------------
  function timeToMinutes(t){ const [h,m] = String(t||"0:0").split(":").map(Number); return (h||0)*60 + (m||0); }
  function shiftRawDurationHours(startTime, endTime){
    let diff = timeToMinutes(endTime) - timeToMinutes(startTime);
    if(diff <= 0) diff += 24*60;
    return diff/60;
  }
  function shiftWorkedHours(startTime, endTime, breakMinutes){
    return Math.max(0, shiftRawDurationHours(startTime, endTime) - Number(breakMinutes||0)/60);
  }
  // Sugestão de intervalo pela CLT (Art. 71): 1h acima de 6h de jornada, 15min entre 4h e 6h, sem
  // intervalo obrigatório até 4h.
  function cltSuggestedBreakMinutes(rawHours){
    if(rawHours > 6) return 60;
    if(rawHours > 4) return 15;
    return 0;
  }
  function monthlyDivisor(shift){ return Number(shift?.weeklyHours || 44) * 5; }
  function shiftLabel(shift){
    if(!shift) return "—";
    if(shift.mode==="semanal") return `${esc(shift.name)} (${(shift.weekdays||[]).map(d=>WEEKDAY_LABELS[d]).join("/")||"sem dias"}, ${shift.hoursPerDay}h/dia, ${shift.weeklyHours||44}h/semana)`;
    return `${esc(shift.name)} (escala ${shift.cycleWork}x${shift.cycleRest}, ${shift.hoursPerDay}h/dia, ${shift.weeklyHours||44}h/semana)`;
  }
  function findHoliday(dateISO){
    return state.holidays.find(h => h.date===dateISO || (h.recurring && h.date.slice(5)===dateISO.slice(5)));
  }
  function shiftWorksOnDate(shift, dateISO){
    if(!shift) return false;
    if(shift.mode==="semanal"){
      const dow = new Date(dateISO+"T00:00:00").getDay();
      return (shift.weekdays||[]).includes(dow);
    }
    const cycleLen = Math.max(1, Number(shift.cycleWork||0) + Number(shift.cycleRest||0));
    const anchor = shift.cycleAnchor || todayISO();
    let offset = diffDays(anchor, dateISO) % cycleLen;
    if(offset < 0) offset += cycleLen;
    return offset < Number(shift.cycleWork||0);
  }
  function shiftIdForEmployeeOnDate(employee, dateISO){
    const history = employee?.shiftHistory || [];
    if(!history.length) return employee?.shiftId;
    let resolved = null;
    history.forEach(h => { if(h.effectiveFrom <= dateISO && (!resolved || h.effectiveFrom > resolved.effectiveFrom)) resolved = h; });
    if(resolved) return resolved.shiftId;
    return history.reduce((a,b) => a.effectiveFrom < b.effectiveFrom ? a : b).shiftId;
  }
  function scheduledDayInfo(employee, dateISO){
    const shift = state.shifts.find(s=>s.id===shiftIdForEmployeeOnDate(employee, dateISO));
    const holiday = findHoliday(dateISO);
    const scheduled = !!shift && shiftWorksOnDate(shift, dateISO) && !holiday;
    const attendance = (employee?.attendance||[]).find(a=>a.date===dateISO);
    return { shift, holiday, scheduled, attendance };
  }
  function attendanceDayStyle(employee, dateISO){
    const info = scheduledDayInfo(employee, dateISO);
    if(info.holiday) return { bg:"rgba(167,139,250,.22)", color:"#c4b5fd", label:info.holiday.name };
    const status = info.attendance ? attendanceStatus(info.attendance) : null;
    if(status==="presente") return { bg:"rgba(52,211,153,.22)", color:"var(--emerald)", label:"Trabalhou" };
    if(status==="falta") return { bg:"rgba(251,113,133,.22)", color:"var(--rose)", label:"Faltou" };
    if(status==="ferias") return { bg:"rgba(34,211,238,.22)", color:"var(--cyan)", label:"Férias" };
    if(status==="folga") return { bg:"transparent", color:"var(--muted)", label:"Folga (registrada)" };
    if(info.scheduled) return { bg:"rgba(251,191,36,.22)", color:"var(--amber)", label:"Deveria trabalhar" };
    return { bg:"transparent", color:"var(--muted)", label:"Folga" };
  }
  function attendanceEntryHoursBreakdown(employee, entry){
    if(!entry || attendanceStatus(entry)!=="presente") return { normalHours:0, overtimeHours:0, overtimeKind:null };
    const hours = round2(Number(entry.hours||0));
    if(hours<=0) return { normalHours:0, overtimeHours:0, overtimeKind:null };
    const info = scheduledDayInfo(employee, entry.date);
    const expected = entry.expectedHours ?? (info.shift ? info.shift.hoursPerDay : hours);
    if(!info.scheduled) return { normalHours:0, overtimeHours:hours, overtimeKind:"restday" };
    if(hours > expected) return { normalHours: expected, overtimeHours: round2(hours-expected), overtimeKind:"workday" };
    return { normalHours: hours, overtimeHours:0, overtimeKind:null };
  }
  function attendanceEntryCost(employee, entry, hhRate){
    const b = attendanceEntryHoursBreakdown(employee, entry);
    const pct = b.overtimeKind==="restday" ? overtimeRules.restDayPct : overtimeRules.normalPct;
    const overtimeRate = Number(hhRate||0) * (1 + pct/100);
    const normalCost = b.normalHours * Number(hhRate||0);
    const overtimeCost = b.overtimeHours * overtimeRate;
    return { ...b, pct, normalCost: round2(normalCost), overtimeCost: round2(overtimeCost), total: round2(normalCost+overtimeCost) };
  }
  function computeStreak(employee){
    const statusByDate = new Map((employee.attendance||[]).map(a=>[a.date, attendanceStatus(a)]));
    let streak = 0, cursor = todayISO();
    if(!statusByDate.has(cursor)) cursor = addDays(cursor, -1);
    let guard = 0;
    while(statusByDate.get(cursor)==="presente" && guard < 3660){ streak++; cursor = addDays(cursor, -1); guard++; }
    return streak;
  }
  function employeeMonthStats(employee, month){
    const entries = (employee.attendance||[]).filter(a => a.date.slice(0,7)===month);
    const present = entries.filter(a=>attendanceStatus(a)==="presente");
    const absent = entries.filter(a=>attendanceStatus(a)==="falta");
    const folga = entries.filter(a=>attendanceStatus(a)==="folga");
    const ferias = entries.filter(a=>attendanceStatus(a)==="ferias");
    const hours = round2(present.reduce((s,a)=>s+Number(a.hours||0), 0));
    let overtimeHours = 0;
    present.forEach(a => { overtimeHours += attendanceEntryHoursBreakdown(employee, a).overtimeHours; });
    return { workedDays: present.length, absences: absent.length, folgas: folga.length, ferias: ferias.length, hours, overtimeHours: round2(overtimeHours) };
  }
  function employeeMonthUnjustifiedAbsences(employee, month){
    return (employee.attendance||[]).filter(a => a.date.slice(0,7)===month && attendanceStatus(a)==="falta" && !a.justification && !a.atestado).length;
  }
  function employeeMonthOvertimeCost(employee, company, month){
    if(!company || !company.billing.hh) return 0;
    const hhRate = Number(employee.rates.hh||0);
    const entries = (employee.attendance||[]).filter(a=>a.date.slice(0,7)===month);
    return round2(entries.reduce((s,a)=>s+attendanceEntryCost(employee, a, hhRate).overtimeCost, 0));
  }
  function employeeMonthRealCost(employee, company, month){
    if(!company) return 0;
    let total = 0;
    if(company.billing.hh){
      const hhRate = Number(employee.rates.hh||0);
      const entries = (employee.attendance||[]).filter(a=>a.date.slice(0,7)===month);
      total += entries.reduce((s,a)=>s+attendanceEntryCost(employee, a, hhRate).total, 0);
    }
    if(month <= todayISO().slice(0,7)){
      BILLING_KEYS.filter(k=>k!=="hh").forEach(key => { if(company.billing[key]) total += Number(employee.rates[key]||0); });
    }
    return round2(total);
  }
  function isEmployeeOffOnDate(employee, dateISO){
    const entry = (employee.attendance||[]).find(a=>a.date===dateISO);
    if(entry && ["ferias","folga"].includes(attendanceStatus(entry))) return true;
    return state.timeOffRequests.some(r => r.employeeId===employee.id && r.type==="ferias" && r.status==="aprovado" && r.dateStart<=dateISO && dateISO<=r.dateEnd);
  }
  function scheduledDatesInRangeForEmployee(employee, startISO, endISO){
    const dates = [];
    if(!startISO || !endISO || endISO < startISO) return dates;
    let cursor = startISO, guard = 0;
    while(cursor <= endISO && guard < 3660){
      const shift = state.shifts.find(s=>s.id===shiftIdForEmployeeOnDate(employee, cursor));
      if(shift && shiftWorksOnDate(shift, cursor) && !findHoliday(cursor)) dates.push(cursor);
      cursor = addDays(cursor, 1); guard++;
    }
    return dates;
  }
  function employeeMonthEstimatedCost(employee, company, month){
    if(!company) return 0;
    const [y,m] = month.split("-").map(Number);
    const monthStart = `${month}-01`;
    const monthEnd = `${month}-${String(new Date(y,m,0).getDate()).padStart(2,"0")}`;
    let total = 0;
    if(company.billing.hh){
      const hhRate = Number(employee.rates.hh||0);
      const entries = (employee.attendance||[]).filter(a=>a.date.slice(0,7)===month);
      total += entries.reduce((s,a)=>s+attendanceEntryCost(employee, a, hhRate).total, 0);
      const recordedDates = new Set(entries.map(a=>a.date));
      const missingScheduledDates = scheduledDatesInRangeForEmployee(employee, monthStart, monthEnd)
        .filter(d => !recordedDates.has(d) && !isEmployeeOffOnDate(employee, d));
      missingScheduledDates.forEach(d => {
        const shift = state.shifts.find(s=>s.id===shiftIdForEmployeeOnDate(employee, d));
        if(shift) total += shiftWorkedHours(shift.startTime, shift.endTime, shift.breakMinutes) * hhRate;
      });
    }
    BILLING_KEYS.filter(k=>k!=="hh").forEach(key => { if(company.billing[key]) total += Number(employee.rates[key]||0); });
    return round2(total);
  }
  function companyMonthCostSummary(company, month){
    const employees = state.employees.filter(e=>e.companyId===company.id);
    let real = 0, estimated = 0;
    employees.forEach(e => { real += employeeMonthRealCost(e, company, month); estimated += employeeMonthEstimatedCost(e, company, month); });
    return { real: round2(real), estimated: round2(estimated), employeeCount: employees.length };
  }
  function computeDayRoster(dateISO){
    const present = [], off = [];
    state.employees.filter(e=>e.status==="Ativo").forEach(employee => {
      const info = scheduledDayInfo(employee, dateISO);
      if(!info.scheduled) return;
      const status = info.attendance ? attendanceStatus(info.attendance) : null;
      if(isEmployeeOffOnDate(employee, dateISO)){ off.push({ employee, status }); return; }
      present.push({ employee, status, shift: info.shift });
    });
    present.sort((a,b)=>a.employee.name.localeCompare(b.employee.name));
    off.sort((a,b)=>a.employee.name.localeCompare(b.employee.name));
    return { present, off };
  }
  function timeOffRequestToAttendanceRows(req, employee){
    const byDate = new Map((employee.attendance||[]).map(a=>[a.date, a]));
    const makeRow = (date, status, justification) => {
      const existing = byDate.get(date);
      return { id: existing?.id || uid(), date, status, hours:0, turno:"", expectedHours:null, justification: justification||"" };
    };
    if(req.type==="falta") return [makeRow(req.dateStart, "falta", req.reason)];
    if(req.type==="folga") return [makeRow(req.dateStart, "folga", "")];
    // Atraso não é uma ausência — é um dia trabalhado com a flag "atraso" marcada. Preserva
    // horas/turno já lançados nesse dia (se houver); sem lançamento ainda, usa o previsto pelo turno.
    if(req.type==="atraso"){
      const existing = byDate.get(req.dateStart);
      const shift = state.shifts.find(s=>s.id===shiftIdForEmployeeOnDate(employee, req.dateStart));
      return [{
        id: existing?.id || uid(), date: req.dateStart, status: "presente",
        hours: existing ? existing.hours : (shift ? shiftWorkedHours(shift.startTime, shift.endTime, shift.breakMinutes) : 0),
        turno: existing?.turno || (shift ? shift.name : ""),
        expectedHours: existing?.expectedHours ?? (shift ? shift.hoursPerDay : null),
        justification: req.reason || "",
        atestado: !!(existing && existing.atestado),
        atraso: true,
      }];
    }
    const rows = [];
    let cursor = req.dateStart, guard = 0;
    while(cursor <= req.dateEnd && guard < 400){ rows.push(makeRow(cursor, "ferias", "")); cursor = addDays(cursor, 1); guard++; }
    return rows;
  }

  // ---------------- decisão de solicitações (mesma lógica do painel desktop, sem Kanban) ----------------
  async function applyApprovedTimeOff(req, employee){
    const dayCount = Math.round((new Date(req.dateEnd) - new Date(req.dateStart)) / 86400000) + 1;
    if(dayCount > 120){ alert(`Esse intervalo tem ${dayCount} dias — grande demais pra aplicar automaticamente. Ajuste pelo painel desktop.`); return false; }
    if(req.type==="ferias"){
      const totalDebit = dayCount + (req.diasVendidos||0);
      const saldo = employee.feriasSaldoDias ?? 0;
      if(totalDebit > saldo){
        alert(`Saldo de férias insuficiente: ${employee.name} tem ${saldo} dia(s) disponíveis, e esse pedido descontaria ${totalDebit}.`);
        return false;
      }
    }
    const rows = timeOffRequestToAttendanceRows(req, employee);
    const { error } = await supabase.from("attendance").upsert(rows.map(r=>attendanceToRow(employee.id, r)), { onConflict:"employee_id,date" });
    if(error){ alert("Não consegui gravar a frequência: "+error.message); return false; }
    const byDate = new Map(rows.map(r=>[r.date, r]));
    employee.attendance = [...(employee.attendance||[]).filter(a=>!byDate.has(a.date)), ...rows];
    if(req.type==="ferias"){
      employee.feriasSaldoDias = (employee.feriasSaldoDias ?? 0) - (dayCount + (req.diasVendidos||0));
      await supabase.from("employees").update({ ferias_saldo_dias: employee.feriasSaldoDias }).eq("id", employee.id);
    }
    req.status = "aprovado";
    return true;
  }
  async function decideRequest(reqId, status, responseText){
    const { data: fresh, error: fetchErr } = await supabase.from("time_off_requests").select("*").eq("id", reqId).maybeSingle();
    if(fetchErr){ alert("Não consegui confirmar o pedido: "+fetchErr.message); return; }
    if(!fresh || fresh.status!=="pendente"){ alert("Esse pedido já não está mais pendente (decidido em outro dispositivo)."); await refreshAllData(); return; }
    const req = timeOffRequestFromRow(fresh);
    const employee = state.employees.find(e=>e.id===req.employeeId);
    if(!employee){ alert("Funcionário não encontrado."); return; }
    closeModalRoot();
    if(req.type==="solicitacao_geral"){
      req.status = status;
      req.adminResponse = responseText||"";
      req.adminRespondedAt = new Date().toISOString();
      const { error } = await supabase.from("time_off_requests").upsert(timeOffRequestToRow(req));
      if(error){ alert("Não consegui salvar a decisão: "+error.message); return; }
      state.timeOffRequests = [req, ...state.timeOffRequests.filter(r=>r.id!==req.id)];
      render();
      insertNotifications([{ employee_id: req.employeeId, type:"solicitacao_geral", title:"Sua solicitação foi respondida", body: responseText || `Sua solicitação "${req.title||''}" foi ${status==="aprovado"?"aprovada":"rejeitada"}.` }]);
      return;
    }
    if(status==="rejeitado"){
      req.status = "rejeitado";
      const { error } = await supabase.from("time_off_requests").upsert(timeOffRequestToRow(req));
      if(error){ alert("Não consegui salvar a decisão: "+error.message); return; }
    } else {
      const ok = await applyApprovedTimeOff(req, employee);
      if(!ok) return;
      const { error } = await supabase.from("time_off_requests").upsert(timeOffRequestToRow(req));
      if(error){ alert("Não consegui salvar a decisão: "+error.message); return; }
    }
    state.timeOffRequests = [req, ...state.timeOffRequests.filter(r=>r.id!==req.id)];
    render();
    notifyRequestStatus(req);
  }

      if(f.shiftId && updated.shiftId && f.shiftId!==updated.shiftId){

        const newShift = state.shifts.find(s=>s.id===updated.shiftId);
        const effectiveDate = shiftEffectiveDateInput || todayISO();
        const newRows = [];
        if(!updated.shiftHistory.length) newRows.push({ shiftId: f.shiftId, effectiveFrom: f.admissao || "2000-01-01" });
        newRows.push({ shiftId: updated.shiftId, effectiveFrom: effectiveDate });
        updated.shiftHistory = [...updated.shiftHistory, ...newRows];
        try{
          await supabase.from("employee_shift_history").upsert(newRows.map(h=>shiftHistoryObjToRow(updated.id, h)), { onConflict:"employee_id,effective_from" });
        }catch(err){ console.error("Falha ao gravar histórico de turno", err); }
        insertNotifications([{ employee_id: updated.id, type:"turno", title:"Seu turno foi alterado", body:`Seu turno foi alterado de ${oldShift?oldShift.name:"—"} para ${newShift?newShift.name:"—"}, a partir de ${brDate(effectiveDate)}.` }]);
      }
    });
  }

  // Mesma lógica de dados/PDF do painel desktop, sem alterações (cálculo puro, não depende de tela).
  function buildManagementReportData(companyId, month){
    const companies = companyId ? state.companies.filter(c=>c.id===companyId) : state.companies;
    const scopeEmployees = state.employees.filter(e => !companyId || e.companyId===companyId);
    const companyCosts = companies.map(c => ({ company:c, ...companyMonthCostSummary(c, month) }));
    const statsByEmp = companyId ? new Map(scopeEmployees.map(e=>[e.id, employeeMonthStats(e, month)])) : null;
    const employeeCostRows = companyId ? scopeEmployees.map(e => {
      const company = companies.find(c=>c.id===e.companyId);
      const m = statsByEmp.get(e.id);
      return { employee:e, real: employeeMonthRealCost(e, company, month), estimated: employeeMonthEstimatedCost(e, company, month), hours:m.hours, overtimeHours:m.overtimeHours };
    }) : [];
    const employeeFreqRows = companyId ? scopeEmployees.map(e => {
      const m = statsByEmp.get(e.id);
      return { employee:e, ...m, unjustified: employeeMonthUnjustifiedAbsences(e, month) };
    }) : [];
    const companyFreqRows = companyId ? [] : companies.map(c => {
      const emps = state.employees.filter(e=>e.companyId===c.id);
      const totals = emps.reduce((acc,e) => { const m=employeeMonthStats(e,month); acc.workedDays+=m.workedDays; acc.absences+=m.absences; acc.folgas+=m.folgas; acc.ferias+=m.ferias; acc.unjustified+=employeeMonthUnjustifiedAbsences(e,month); return acc; }, {workedDays:0,absences:0,folgas:0,ferias:0,unjustified:0});
      return { company:c, ...totals };
    });
    const streakAlerts = scopeEmployees.map(e=>({ employee:e, streak:computeStreak(e) })).filter(x=>x.streak>=7);
    const unjustifiedAlerts = scopeEmployees.map(e=>({ employee:e, count:employeeMonthUnjustifiedAbsences(e, month) })).filter(x=>x.count>=3);
    const overtimeEmployeeRows = companyId ? scopeEmployees.map(e => {
      const company = companies.find(c=>c.id===e.companyId);
      return { employee:e, cost: employeeMonthOvertimeCost(e, company, month) };
    }).filter(x=>x.cost>0) : [];
    const overtimeCompanyRows = companyId ? [] : companies.map(c => {
      const emps = state.employees.filter(e=>e.companyId===c.id);
      const total = round2(emps.reduce((s,e)=>s+employeeMonthOvertimeCost(e, c, month), 0));
      return { company:c, total };
    }).filter(x=>x.total>0);
    const totalOvertimeCost = round2((companyId ? overtimeEmployeeRows.map(r=>r.cost) : overtimeCompanyRows.map(r=>r.total)).reduce((s,v)=>s+v,0));
    const monthStart = `${month}-01`;
    const [yy,mm] = month.split("-").map(Number);
    const monthEnd = `${month}-${String(new Date(yy,mm,0).getDate()).padStart(2,"0")}`;
    const feriasRows = scopeEmployees.flatMap(e => state.timeOffRequests
      .filter(r=>r.employeeId===e.id && r.type==="ferias" && r.status==="aprovado" && r.dateStart<=monthEnd && r.dateEnd>=monthStart)
      .map(r => ({ employee:e, request:r })));
    return {
      companyId, month, monthLabel: monthRangeLabel(month), generatedAt: new Date(),
      scopeLabel: companyId ? (companies[0]?.name || "—") : "Todas as empresas",
      companyCosts, employeeCostRows, employeeFreqRows, companyFreqRows,
      streakAlerts, unjustifiedAlerts, overtimeEmployeeRows, overtimeCompanyRows, totalOvertimeCost,
      feriasRows,
    };
  }
  function generateManagementReportPDF(data){
    const doc = new jspdf.jsPDF();
    const BRAND = [11,107,51], BRANDLIGHT = [230,242,222];
    const pageWidth = doc.internal.pageSize.getWidth();
    let y = 18;
    doc.setFillColor(...BRAND); doc.rect(0,0,pageWidth,24,"F");
    doc.setTextColor(255,255,255); doc.setFontSize(15); doc.setFont(undefined,"bold");
    doc.text("Fertgrow — Relatório Gerencial de Mão de Obra", 14, 15);
    doc.setFontSize(9); doc.setFont(undefined,"normal");
    doc.text(`${data.scopeLabel} · Referência: ${data.monthLabel} · Emitido em ${data.generatedAt.toLocaleString("pt-BR")}`, 14, 21);
    doc.setTextColor(0,0,0);
    y = 32;
    const sectionTitle = (title) => {
      if(y > 270){ doc.addPage(); y = 16; }
      doc.setFillColor(...BRAND); doc.rect(14, y-5.5, pageWidth-28, 7, "F");
      doc.setTextColor(255,255,255); doc.setFontSize(11); doc.setFont(undefined,"bold");
      doc.text(title, 16, y);
      doc.setTextColor(0,0,0); doc.setFont(undefined,"normal");
      y += 6;
    };
    const table = (head, body) => {
      doc.autoTable({ head:[head], body, startY:y, margin:{left:14,right:14}, styles:{fontSize:8.5, textColor:[0,0,0], lineColor:[0,0,0], lineWidth:0.1}, headStyles:{fillColor:BRAND, textColor:255}, alternateRowStyles:{fillColor:BRANDLIGHT} });
      y = doc.lastAutoTable.finalY + 8;
    };
    sectionTitle("Resumo de custos");
    table(["Empresa","Custo real (até hoje)","Custo estimado (mês fechado)"], data.companyCosts.map(c=>[c.company.name, money(c.real), money(c.estimated)]));
    if(data.employeeCostRows.length){
      table(["Funcionário","Custo real","Custo estimado","Horas normais","Horas extras"], data.employeeCostRows.map(r=>[r.employee.name, money(r.real), money(r.estimated), String(r.hours), String(r.overtimeHours)]));
    }
    sectionTitle("Frequência e faltas");
    if(data.employeeFreqRows.length){
      table(["Funcionário","Dias trabalhados","Faltas","Não justificadas","Folgas","Férias no mês"], data.employeeFreqRows.map(r=>[r.employee.name, String(r.workedDays), String(r.absences), String(r.unjustified), String(r.folgas), String(r.ferias)]));
    } else {
      table(["Empresa","Dias trabalhados","Faltas","Não justificadas","Folgas","Férias no mês"], data.companyFreqRows.map(r=>[r.company.name, String(r.workedDays), String(r.absences), String(r.unjustified), String(r.folgas), String(r.ferias)]));
    }
    sectionTitle("Alertas");
    if(!data.streakAlerts.length && !data.unjustifiedAlerts.length){
      doc.setFontSize(9.5); doc.text("Nenhum alerta no período.", 14, y); y += 8;
    } else {
      if(data.streakAlerts.length) table(["Funcionário sem folga há 7+ dias","Dias consecutivos"], data.streakAlerts.map(r=>[r.employee.name, String(r.streak)]));
      if(data.unjustifiedAlerts.length) table(["Funcionário com 3+ faltas não justificadas","Faltas não justificadas no mês"], data.unjustifiedAlerts.map(r=>[r.employee.name, String(r.count)]));
    }
    sectionTitle("Horas extras");
    if(data.employeeCostRows.length || data.overtimeEmployeeRows.length){
      table(["Funcionário","Custo de hora extra no mês"], data.overtimeEmployeeRows.map(r=>[r.employee.name, money(r.cost)]));
    } else {
      table(["Empresa","Custo de hora extra no mês"], data.overtimeCompanyRows.map(r=>[r.company.name, money(r.total)]));
    }
    doc.setFontSize(9.5); doc.setFont(undefined,"bold"); doc.text(`Total: ${money(data.totalOvertimeCost)}`, 14, y); doc.setFont(undefined,"normal"); y += 8;
    sectionTitle("Férias");
    if(!data.feriasRows.length){
      doc.setFontSize(9.5); doc.text("Nenhuma férias aprovada sobrepondo o período.", 14, y); y += 8;
    } else {
      table(["Funcionário","Período","Dias vendidos","Saldo atual"], data.feriasRows.map(r=>[r.employee.name, `${brDate(r.request.dateStart)} a ${brDate(r.request.dateEnd)}`, String(r.request.diasVendidos||0), String(r.employee.feriasSaldoDias??0)]));
    }
    const safeName = (data.scopeLabel||"todas").replace(/[^a-zA-Z0-9]+/g,"-").toLowerCase();
    doc.save(`relatorio-gerencial-${safeName}-${data.month}.pdf`);
  }

  function openWorkShiftModal(shift){
    const f = shift ? {...shift, weekdays:[...(shift.weekdays||[])]} : {
      id: uid(), name:"", startTime:"08:00", endTime:"17:00",
      breakMinutes: cltSuggestedBreakMinutes(shiftRawDurationHours("08:00","17:00")), hoursPerDay:8, weeklyHours:44, mode:"semanal",
      weekdays:[1,2,3,4,5], cycleWork:6, cycleRest:1, cycleAnchor: todayISO(),
    };
    const renderModeFields = () => f.mode==="semanal" ? `
      <div class="field">
        <label>Dias da semana trabalhados</label>
        <div class="row-flex" style="flex-wrap:wrap;gap:8px">
          ${WEEKDAY_LABELS_LONG.map((w,i)=>`<label style="display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px"><input type="checkbox" data-weekday="${i}" ${f.weekdays.includes(i)?'checked':''} style="width:auto"/> ${w}</label>`).join("")}
        </div>
      </div>
    ` : `
      <div class="field"><label>Dias trabalhados seguidos</label><input type="number" min="1" class="input" id="s_cyclework" value="${f.cycleWork}" /></div>
      <div class="field"><label>Dias de folga seguidos</label><input type="number" min="1" class="input" id="s_cyclerest" value="${f.cycleRest}" /></div>
      <div class="field"><label>Data de referência (1º dia de trabalho de um ciclo)</label><input type="date" class="input" id="s_anchor" value="${f.cycleAnchor}" /></div>
    `;
    $("#modalRoot").innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="modal-head"><h3>${shift?"Editar turno":"Novo turno"}</h3><button class="btn ghost small" id="closeModal" type="button">✕</button></div>
          <div class="field"><label>Nome do turno</label><input class="input" id="s_name" value="${esc(f.name)}" placeholder="Ex: Turno 6x1 diurno" /></div>
          <div class="field"><label>Início</label><input type="time" class="input" id="s_start" value="${f.startTime}" /></div>
          <div class="field"><label>Término</label><input type="time" class="input" id="s_end" value="${f.endTime}" /></div>
          <div class="field"><label>Intervalo (min)</label><input type="number" step="5" min="0" class="input" id="s_break" value="${f.breakMinutes}" /></div>
          <div class="field"><label>Horas efetivas/dia</label><div class="input" id="s_hoursInfo" style="background:transparent;border-style:dashed;color:var(--brand-light);font-weight:700">${f.hoursPerDay}h</div></div>
          <div class="field"><label>Padrão de jornada</label>
            <select class="input" id="s_mode">
              <option value="semanal" ${f.mode==='semanal'?'selected':''}>Semanal fixo</option>
              <option value="escala" ${f.mode==='escala'?'selected':''}>Escala rotativa (6x1, 12x36...)</option>
            </select>
          </div>
          <div class="field"><label>Jornada semanal contratual (CLT)</label><input type="number" step="1" min="1" max="44" class="input" id="s_weeklyhours" value="${f.weeklyHours||44}" /></div>
          <div id="shiftModeFields">${renderModeFields()}</div>
          <div class="modal-actions">
            <button class="btn ghost" id="cancelModal" type="button">Cancelar</button>
            <button class="btn" id="saveShift" type="button">Salvar turno</button>
          </div>
        </div>
      </div>
    `;
    const close = () => { $("#modalRoot").innerHTML = ""; };
    $("#closeModal").addEventListener("click", close);
    $("#cancelModal").addEventListener("click", close);
    $("#backdrop").addEventListener("click", e => { if(e.target.id==="backdrop") close(); });
    function wireModeFields(){
      document.querySelectorAll("[data-weekday]").forEach(el => el.addEventListener("change", () => {
        const day = Number(el.dataset.weekday);
        if(el.checked){ if(!f.weekdays.includes(day)) f.weekdays.push(day); }
        else f.weekdays = f.weekdays.filter(d=>d!==day);
      }));
    }
    $("#s_mode").addEventListener("change", e => { f.mode = e.target.value; $("#shiftModeFields").innerHTML = renderModeFields(); wireModeFields(); });
    const refreshWorkedHours = () => {
      const worked = shiftWorkedHours($("#s_start").value, $("#s_end").value, $("#s_break").value);
      $("#s_hoursInfo").textContent = `${Math.round(worked*100)/100}h`;
    };
    $("#s_start").addEventListener("input", () => { $("#s_break").value = cltSuggestedBreakMinutes(shiftRawDurationHours($("#s_start").value, $("#s_end").value)); refreshWorkedHours(); });
    $("#s_end").addEventListener("input", () => { $("#s_break").value = cltSuggestedBreakMinutes(shiftRawDurationHours($("#s_start").value, $("#s_end").value)); refreshWorkedHours(); });
    $("#s_break").addEventListener("input", refreshWorkedHours);
    wireModeFields();
    $("#saveShift").addEventListener("click", async () => {
      const breakMinutes = Number($("#s_break").value||0);
      const updated = {
        id: f.id, name: $("#s_name").value.trim() || "Sem nome",
        startTime: $("#s_start").value, endTime: $("#s_end").value, breakMinutes,
        hoursPerDay: Math.round(shiftWorkedHours($("#s_start").value, $("#s_end").value, breakMinutes)*100)/100,
        weeklyHours: Math.min(44, Math.max(1, Number($("#s_weeklyhours").value||44))),
        mode: $("#s_mode").value, weekdays: f.weekdays,
        cycleWork: Number($("#s_cyclework")?.value || f.cycleWork || 1),

  // ---------------- Calendário (mês inteiro de um funcionário) ----------------
  function calendarioHTML(){
    if(!state.employees.length){
      return `<h2 class="section">Calendário</h2><span class="link" data-tab="mais">← Mais</span><p class="empty" style="margin-top:14px">Nenhum funcionário cadastrado.</p>`;
    }
    if(!state.calendarEmployeeId || !state.employees.some(e=>e.id===state.calendarEmployeeId)) state.calendarEmployeeId = state.employees[0].id;
    const employee = state.employees.find(e=>e.id===state.calendarEmployeeId);
    const month = state.calendarMonth;
    const [y,m] = month.split("-").map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const firstDow = new Date(y, m-1, 1).getDay();
    const shift = state.shifts.find(s=>s.id===shiftIdForEmployeeOnDate(employee, `${month}-01`));
    const cells = [];
    for(let i=0;i<firstDow;i++) cells.push(null);
    for(let d=1; d<=daysInMonth; d++) cells.push(`${month}-${String(d).padStart(2,"0")}`);
    function cellHTML(dateISO){
      if(!dateISO) return `<div></div>`;
      const info = scheduledDayInfo(employee, dateISO);
      const status = info.attendance ? attendanceStatus(info.attendance) : null;
      const day = Number(dateISO.slice(8,10));
      let bg = "transparent", color = "var(--muted)", label = "Folga";
      if(info.holiday){ bg="rgba(167,139,250,.18)"; color="#c4b5fd"; label=info.holiday.name; }
      else if(status==="presente"){ bg="rgba(52,211,153,.18)"; color="var(--emerald)"; label="Trabalhou"; }
      else if(status==="falta"){ bg="rgba(251,113,133,.18)"; color="var(--rose)"; label="Falta"; }
      else if(status==="ferias"){ bg="rgba(34,211,238,.18)"; color="var(--cyan)"; label="Férias"; }
      else if(status==="folga"){ bg="transparent"; color="var(--muted)"; label="Folga (registrada)"; }
      else if(info.scheduled && dateISO < todayISO()){ bg="rgba(251,191,36,.15)"; color="var(--amber)"; label="Sem apontamento"; }
      else if(info.scheduled){ bg="rgba(11,107,51,.1)"; color="var(--brand-light)"; label="Previsto"; }
      const outline = dateISO===todayISO() ? "outline:1px solid var(--brand-light);" : "";
      return `<div data-daycell="${dateISO}" title="${esc(label)}" style="cursor:pointer;background:${bg};color:${color};${outline}border-radius:6px;padding:6px 2px;text-align:center;font-size:11px">${day}</div>`;
    }
    return `
      <div class="row-flex" style="justify-content:space-between;margin-bottom:10px">
        <h2 class="section" style="margin:0">Calendário</h2>
        <span class="link" data-tab="mais">← Mais</span>
      </div>
      <div class="card" style="margin-bottom:14px">
        <div class="field" style="margin-bottom:10px"><label>Funcionário</label>
          <select class="input" id="calEmployee">${state.employees.map(e=>`<option value="${e.id}" ${e.id===state.calendarEmployeeId?'selected':''}>${esc(e.name)}</option>`).join("")}</select>
        </div>
        <div class="field" style="margin-bottom:0"><label>Mês</label><input type="month" class="input" id="calMonth" value="${month}" /></div>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px;font-size:13px">${esc(employee.name)} <span style="color:var(--muted);font-weight:400;font-size:11.5px">— ${shift?shiftLabel(shift):"sem turno padrão"}</span></div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px">
          ${WEEKDAY_LABELS.map(w=>`<div style="text-align:center;font-size:9.5px;color:var(--muted);font-weight:700">${w}</div>`).join("")}
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells.map(cellHTML).join("")}</div>
        <div class="legend" style="margin-top:10px;font-size:10px;row-gap:4px">
          <span><span class="dot" style="background:rgba(52,211,153,.8)"></span>Trabalhou</span>
          <span><span class="dot" style="background:rgba(251,113,133,.8)"></span>Falta</span>
          <span><span class="dot" style="background:rgba(251,191,36,.8)"></span>Sem apontamento</span>
          <span><span class="dot" style="background:rgba(167,139,250,.8)"></span>Feriado</span>
        </div>
      </div>
    `;
  }

  // Lançamento individual de um dia — toque num funcionário na Frequência abre isso. Data editável

        turno: status==="presente" ? $("#a_turno").value : "",
        hours: status==="presente" ? Number($("#a_hours").value||0) : 0,
        expectedHours: status==="presente" ? expected : null,
        justification: $("#a_justify").value.trim(),
        atestado: status==="falta" && $("#a_atestado").checked,
        atraso: status==="presente" && $("#a_atraso").checked,
      };
      const btn = $("#saveAttendance"); btn.disabled = true; btn.textContent = "Salvando…";
      const { error } = await supabase.from("attendance").upsert([attendanceToRow(employee.id, entry)], { onConflict:"employee_id,date" });
      if(error){ alert("Não consegui salvar: "+error.message); btn.disabled = false; btn.textContent = "Salvar"; return; }
      employee.attendance = [...(employee.attendance||[]).filter(a=>a.date!==date), entry];
      close(); render();
      notifyPerformanceEntries(employee.id, [entry]);
    });
  }

  // Apontamento em lote pra quem foi marcado na lista de Frequência — mesma lógica do painel desktop
  // (cada funcionário recebe o lançamento só nos próprios dias previstos quando "vários dias" está
  // ligado), adaptada pro layout de tela cheia do celular em vez de modal largo.
  function openBulkAttendanceModal(employees){
    if(!employees.length) return;
    const shiftByEmployee = new Map(employees.map(e => [e.id, state.shifts.find(s=>s.id===e.shiftId)]));
    const expectedByEmployee = new Map(employees.map(e => [e.id, shiftByEmployee.get(e.id)?.hoursPerDay ?? 8]));
    const expectedValues = [...expectedByEmployee.values()];
    const uniformExpected = expectedValues.every(v=>v===expectedValues[0]) ? expectedValues[0] : null;
    let rangeMode = false;
    function expectedHoursForEmployeeAt(employee, dateISO){
      const s = state.shifts.find(sh=>sh.id===shiftIdForEmployeeOnDate(employee, dateISO));
      return s ? s.hoursPerDay : 8;
    }
    function refreshRangeSummary(){
      if(!rangeMode){ $("#b_rangeSummary").style.display = "none"; $("#saveModal").textContent = `Aplicar a ${employees.length} funcionário(s)`; return; }
      const start = $("#b_date").value, until = $("#b_untilDate").value || start;
      $("#b_rangeSummary").style.display = "block";
      if(until < start){ $("#b_rangeSummary").textContent = 'A data "até" precisa ser igual ou depois da data inicial.'; return; }
      const perEmployee = employees.map(e => {
        const n = shiftByEmployee.get(e.id) ? scheduledDatesInRangeForEmployee(e, start, until).length : (Math.round((new Date(until)-new Date(start))/86400000)+1);
        return `${esc(e.name)}: ${n}d`;
      });
      $("#b_rangeSummary").textContent = `Cada funcionário recebe apontamento só nos dias previstos pelo próprio turno dentro do período (${perEmployee.join(" · ")}).`;
      $("#saveModal").textContent = `Aplicar ao período pra ${employees.length} funcionário(s)`;
      refreshCostPreview();
    }
    function refreshCostPreview(){
      const box = $("#b_costPreview");
      if(!box) return;
      const status = $("#b_status").value;
      const hours = Number($("#b_hours").value||0);
      if(status!=="presente" || hours<=0){ box.style.display = "none"; return; }
      const start = $("#b_date").value, until = rangeMode ? ($("#b_untilDate").value||start) : start;
      let totalCost = 0, totalOvertimeH = 0, anyBilled = false;
      employees.forEach(employee => {
        const empCompany = state.companies.find(c=>c.id===employee.companyId);
        if(!empCompany || !empCompany.billing.hh) return;
        anyBilled = true;
        const expected = expectedHoursForEmployeeAt(employee, start);
        const normalH = Math.min(hours, expected);
        const overtimeH = round2(Math.max(0, hours-expected));
        const pct = Number(overtimeRules.normalPct||0);
        const hhRate = Number(employee.rates?.hh||0);
        const days = rangeMode ? (shiftByEmployee.get(employee.id) ? scheduledDatesInRangeForEmployee(employee, start, until).length : 1) : 1;
        totalOvertimeH += overtimeH*days;
        totalCost += (normalH*hhRate + overtimeH*hhRate*(1+pct/100)) * days;
      });
      if(!anyBilled){ box.style.display = "none"; return; }
      totalOvertimeH = round2(totalOvertimeH);
      box.style.display = "block";
      box.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
        <span style="font-size:11.5px;color:var(--muted)">${totalOvertimeH>0?`Inclui ${totalOvertimeH}h extra no total`:"Sem horas extras"}</span>
        <span style="font-size:15px;font-weight:700;color:var(--brand-light)">${money(totalCost)}</span>
      </div>`;
    }
    $("#modalRoot").innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="modal-head"><h3>Apontar em lote</h3><button class="btn ghost small" id="closeModal" type="button">✕</button></div>
          <p style="font-size:12px;color:var(--muted);margin-top:0">Vai aplicar o mesmo lançamento pra <b>${employees.length} funcionário(s)</b>:</p>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
            ${employees.map(e=>`<span style="background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11.5px">${esc(e.name)} (${expectedByEmployee.get(e.id)}h)</span>`).join("")}
          </div>
          <div class="field"><label>Data</label><input type="date" class="input" id="b_date" value="${state.frequencyDate}" /></div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:-4px 0 12px"><input type="checkbox" id="b_rangeToggle" style="width:auto" /> Apontar vários dias de uma vez</label>
          <div class="field" id="b_untilWrap" style="display:none">
            <label>Até</label>
            <input type="date" class="input" id="b_untilDate" value="${state.frequencyDate}" />
          </div>
          <p id="b_rangeSummary" style="font-size:11px;color:var(--muted);margin:0 0 10px;display:none"></p>
          <div class="field"><label>Turno</label><select class="input" id="b_turno">${TURNOS.map(t=>`<option>${t}</option>`).join("")}</select></div>
          <div class="field"><label>Horas trabalhadas</label><input type="number" step="0.5" class="input" id="b_hours" value="${uniformExpected!==null?uniformExpected:expectedValues[0]}" /></div>
          <div class="field"><label>Situação</label>
            <select class="input" id="b_status">${ATTENDANCE_STATUSES.map(s=>`<option value="${s}">${ATTENDANCE_STATUS_LABELS[s]}</option>`).join("")}</select>
          </div>
          <p style="font-size:11px;color:var(--muted);margin:0 0 10px">${uniformExpected!==null ? `Horas puxadas do turno de todos (${uniformExpected}h) quando presente.` : `Turnos com cargas diferentes entre os selecionados (${[...new Set(expectedValues)].join('h / ')}h).`} Falta/folga zeram as horas.</p>
          <div class="field" id="b_atestadoWrap" style="display:none">
            <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="b_atestado" style="width:auto" /> Atestado médico (falta justificada)</label>
          </div>
          <div class="field" id="b_atrasoWrap" style="display:none">
            <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="b_atraso" style="width:auto" /> Atraso</label>
          </div>
          <div class="field"><label id="b_justifyLabel">Observação (opcional)</label><textarea class="input" id="b_justify" rows="2"></textarea></div>
          <div class="card" id="b_costPreview" style="display:none;margin-bottom:14px"></div>
          <div class="modal-actions">
            <button class="btn ghost" id="cancelModal" type="button">Cancelar</button>
            <button class="btn" id="saveModal" type="button">Aplicar a ${employees.length} funcionário(s)</button>
          </div>
        </div>
      </div>
    `;
    refreshCostPreview();
    const close = () => { $("#modalRoot").innerHTML = ""; };
    $("#closeModal").addEventListener("click", close);
    $("#cancelModal").addEventListener("click", close);
    $("#backdrop").addEventListener("click", e => { if(e.target.id==="backdrop") close(); });
    const anyMismatch = () => {
      if($("#b_status").value!=="presente") return false;
      const hours = Number($("#b_hours").value||0);
      const dateForCheck = $("#b_date").value;
      return employees.some(e => Math.abs(hours - expectedHoursForEmployeeAt(e, dateForCheck)) > 0.001);
    };
    const refreshJustifyLabel = () => { $("#b_justifyLabel").textContent = anyMismatch() ? "Motivo da alteração das horas (obrigatório)" : "Observação (opcional)"; };
    $("#b_hours").addEventListener("input", () => { refreshJustifyLabel(); refreshCostPreview(); });
    $("#b_status").addEventListener("change", () => {
      const status = $("#b_status").value;
      const hoursInput = $("#b_hours");
      if(status==="presente"){
        hoursInput.disabled = false;
        if(Number(hoursInput.value)===0) hoursInput.value = uniformExpected!==null ? uniformExpected : expectedValues[0];
      } else {
        hoursInput.value = 0;
        hoursInput.disabled = true;
      }
      $("#b_atestadoWrap").style.display = status==="falta" ? "block" : "none";
      $("#b_atrasoWrap").style.display = status==="presente" ? "block" : "none";
      refreshJustifyLabel();
      refreshCostPreview();
    });
    $("#b_rangeToggle").addEventListener("change", e => {
      rangeMode = e.target.checked;
      $("#b_untilWrap").style.display = rangeMode ? "block" : "none";
      if(rangeMode && $("#b_untilDate").value < $("#b_date").value) $("#b_untilDate").value = $("#b_date").value;
      refreshRangeSummary();
    });
    $("#b_date").addEventListener("change", refreshRangeSummary);
    $("#b_untilDate").addEventListener("change", refreshRangeSummary);
    $("#saveModal").addEventListener("click", async () => {
      const status = $("#b_status").value;
      const hours = Number($("#b_hours").value||0);
      const justification = $("#b_justify").value.trim();
      if(anyMismatch() && !justification){
        alert("As horas informadas não batem com o padrão do turno de pelo menos um funcionário selecionado. Preencha o motivo antes de aplicar.");
        return;
      }
      const start = $("#b_date").value;
      const until = rangeMode ? ($("#b_untilDate").value || start) : start;
      if(!start){ alert("Selecione uma data."); return; }
      if(rangeMode && until < start){
        alert('A data "até" precisa ser igual ou depois da data inicial.');
        return;
      }
      const turno = $("#b_turno").value;
      const atestado = status==="falta" && $("#b_atestado").checked;
      const atraso = status==="presente" && $("#b_atraso").checked;
      const skippedEmployees = [];
      const rows = [];
      const entriesByEmployee = [];
      employees.forEach(employee => {
        const shift = shiftByEmployee.get(employee.id);
        let dates;
        if(!rangeMode) dates = [start];
        else if(shift) dates = scheduledDatesInRangeForEmployee(employee, start, until);
        else { dates = []; let cursor = start, guard = 0; while(cursor <= until && guard < 1100){ dates.push(cursor); cursor = addDays(cursor,1); guard++; } }
        if(!dates.length){ skippedEmployees.push(employee.name); return; }
        const newEntries = dates.map(date => ({
          id: uid(), date, turno, hours, status, expectedHours: expectedHoursForEmployeeAt(employee, date),
          justification, atestado, atraso,
        }));
        const dateSet = new Set(dates);
        employee.attendance = [...(employee.attendance||[]).filter(a=>!dateSet.has(a.date)), ...newEntries];
        newEntries.forEach(entry => rows.push(attendanceToRow(employee.id, entry)));
        entriesByEmployee.push([employee.id, newEntries]);
      });
      const btn = $("#saveModal"); btn.disabled = true; btn.textContent = "Salvando…";
      const { error } = await supabase.from("attendance").upsert(rows, { onConflict:"employee_id,date" });
      if(error){ alert("Não consegui salvar: "+error.message); btn.disabled = false; btn.textContent = `Aplicar a ${employees.length} funcionário(s)`; return; }
      frequencySelected.clear();
      close();
      render();
      if(skippedEmployees.length) alert(`Nenhum dia previsto no período pra: ${skippedEmployees.join(", ")}.`);
      entriesByEmployee.forEach(([employeeId, newEntries]) => notifyPerformanceEntries(employeeId, newEntries));
    });
  }

          const hasEquip = state.checklistEquipment.some(e=>e.areaId===delId);
          if(!confirm(hasEquip ? "Essa área tem equipamentos. Excluir a área também apaga os equipamentos dela. Continuar?" : "Excluir esta área?")) return;
          const { error } = await supabase.from("checklist_areas").delete().eq("id", delId);
          if(error){ alert("Não consegui excluir: "+error.message); return; }
          state.checklistAreas = state.checklistAreas.filter(a=>a.id!==delId);
          state.checklistEquipment = state.checklistEquipment.filter(e=>e.areaId!==delId);
          render();
        }));
        document.querySelectorAll("[data-newequip]").forEach(el => el.addEventListener("click", () => openChecklistEquipmentModal(null, el.dataset.newequip)));
        document.querySelectorAll("[data-editequip]").forEach(el => el.addEventListener("click", () => openChecklistEquipmentModal(state.checklistEquipment.find(e=>e.id===el.dataset.editequip))));
        document.querySelectorAll("[data-delequip]").forEach(el => el.addEventListener("click", async () => {
          if(!confirm("Excluir este equipamento?")) return;
          const delId = el.dataset.delequip;
          const { error } = await supabase.from("checklist_equipment").delete().eq("id", delId);
          if(error){ alert("Não consegui excluir: "+error.message); return; }
          state.checklistEquipment = state.checklistEquipment.filter(e=>e.id!==delId);
          render();
        }));
      }
    } else {
      checklistHistoryLoaded = false;
    }
  }

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => { navigator.serviceWorker.register("./sw-gestor.js").catch(()=>{}); });
  }

  bootstrap();
})();
</script>
</body>
</html>
