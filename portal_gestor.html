<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Fertgrow Gestão</title>
<link rel="manifest" href="manifest-gestor.json" />
<meta name="theme-color" content="#0B6B33" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Fertgrow Gestão" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<!-- Fraunces + Manrope: só usadas pelo gerador de Banners, pra desenhar texto bonito no <canvas> da
     prévia/exportação -- o resto do app continua na fonte padrão. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,400..700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#0a1410; --surface:#101d16; --surface2:#16261d; --border:#213328;
    --text:#e9f2ea; --muted:#8aa08d; --brand:#0B6B33; --brand-light:#AFD676;
    --emerald:#34d399; --amber:#fbbf24; --rose:#fb7185; --cyan:#22d3ee; --violet:#a78bfa;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Inter,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:76px;}
  header.top{padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,20,16,.95);backdrop-filter:blur(6px);z-index:20;}
  header.top .brand{font-weight:700;font-size:15px;}
  header.top .who{font-size:12px;color:var(--muted);margin-top:2px;}
  main{flex:1;padding:16px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:9px;font-size:15px;}
  .input:focus{outline:none;border-color:var(--brand);}
  .btn{width:100%;background:var(--brand);color:#fff;border:none;padding:12px 16px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn:active{background:var(--brand-light);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn.small{padding:8px 12px;font-size:13px;width:auto;}
  .btn.danger{background:var(--rose);}
  .msg{font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;}
  .msg.err{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fca5b1;}
  .msg.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#6ee7b7;}
  .tabs2{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:10px;margin-bottom:16px;overflow-x:auto;}
  .tabs2 .t{flex:0 0 auto;text-align:center;padding:8px 12px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .tabs2 .t.active{background:var(--brand);color:#fff;font-weight:600;}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;max-width:480px;margin:0 auto;z-index:30;}
  nav.bottom .n{flex:1;text-align:center;padding:9px 3px 11px;color:var(--muted);cursor:pointer;font-size:10px;line-height:1.15;letter-spacing:-.01em;position:relative;}
  nav.bottom .n .ic{display:flex;align-items:center;justify-content:center;height:20px;margin-bottom:2px;position:relative;overflow:visible;}
  nav.bottom .n .ic svg{width:18px;height:18px;flex-shrink:0;}
  nav.bottom .n.active{color:var(--brand-light);}
  .nav-badge{position:absolute;top:-4px;right:-6px;background:var(--rose);color:#fff;border-radius:999px;min-width:15px;height:15px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;z-index:2;}
  h2.section{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px;font-weight:700;}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi .label{font-size:11px;color:var(--muted);}
  .kpi .value{font-size:22px;font-weight:700;margin-top:4px;}
  .kpi-click{cursor:pointer;}
  .tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 14px;cursor:pointer;text-align:center;}
  .tile:active{border-color:var(--brand-light);}
  .tile .ic{font-size:24px;display:block;margin-bottom:6px;}
  .tile .lbl{font-size:12.5px;font-weight:600;}
  .menu-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid rgba(33,51,40,.6);cursor:pointer;}
  .menu-row:last-child{border-bottom:none;}
  .menu-row .lbl{font-size:14px;font-weight:600;}
  .menu-row .ic{font-size:18px;margin-right:10px;}
  .menu-row .arrow{color:var(--muted);}
  .badge{padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge.presente{background:rgba(11,107,51,.15);color:var(--brand-light);border:1px solid rgba(11,107,51,.35);}
  .badge.falta{background:rgba(251,113,133,.15);color:var(--rose);border:1px solid rgba(251,113,133,.35);}
  .badge.folga{background:#1c2b21;color:var(--muted);}
  .badge.ferias{background:rgba(34,211,238,.15);color:var(--cyan);border:1px solid rgba(34,211,238,.35);}
  .badge.pendente{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.35);}
  .badge.aprovado{background:rgba(52,211,153,.15);color:var(--emerald);border:1px solid rgba(52,211,153,.35);}
  .badge.rejeitado{background:rgba(251,113,133,.15);color:var(--rose);border:1px solid rgba(251,113,133,.35);}
  .ts-progress{background:rgba(11,107,51,.15);color:var(--brand-light);border:1px solid rgba(11,107,51,.35);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(4,10,7,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
  .modal h3{margin:0;font-size:16px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .req-row{padding:12px 0;border-bottom:1px solid rgba(33,51,40,.6);cursor:pointer;}
  .req-row:last-child{border-bottom:none;}
  .req-row .d{font-size:13.5px;font-weight:600;}
  .req-row .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .row-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:13px;}
  .spinner{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
  .alert-banner{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.3);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;}
  a.link{color:var(--brand-light);cursor:pointer;text-decoration:underline;font-size:13px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  // ===================================================================
  // CONFIGURAÇÃO — mesmo projeto Supabase do painel e do portal do colaborador.
  // ===================================================================
  const SUPABASE_URL = "https://eusvotyusfwxolczqzlc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_2Uee6RYvUtvR5m4Vy6yyDQ_fgEeGEsX";

  const configured = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  const supabase = configured && window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // Mesmo guard do painel desktop: avisa antes de sair/recarregar enquanto uma gravação (frequência,
  // OS, etc.) ainda está em voo, pra não perder silenciosamente um apontamento por causa de alguém
  // fechar o app/recarregar bem na hora em que o upsert pro Supabase ainda não tinha terminado.
  let pendingCloudWrites = 0;
  function trackedCloudCall(promiseLike){
    pendingCloudWrites++;
    const done = () => { pendingCloudWrites = Math.max(0, pendingCloudWrites-1); };
    Promise.resolve(promiseLike).then(done, done);
    return promiseLike;
  }
  window.addEventListener("beforeunload", (e) => {
    if(pendingCloudWrites > 0){ e.preventDefault(); e.returnValue = ""; }
  });

  // Mesma proteção do painel desktop: mantém o token de sessão sempre renovado. O auto-refresh embutido
  // do supabase-js roda num timer que pode atrasar ou nunca disparar quando o app fica muito tempo em
  // segundo plano no celular (aba/app minimizado) -- isso já causou "permission denied" numa sessão
  // longa do painel e só resolvia com logout/login (token mesmo vencido, não era bug de RLS/GRANT).
  // Força uma checagem/renovação explícita sempre que o app volta a ficar visível, e periodicamente.
  // Trava pra nunca ter duas renovações em voo ao mesmo tempo -- o token de refresh só pode ser usado
  // UMA vez (o Supabase invalida a sessão inteira se detectar reuso), então visibilitychange + o
  // intervalo periódico + uma chamada explícita antes de uma ação podiam disparar refreshSession() quase
  // ao mesmo tempo, um "vencer a corrida" do outro e invalidar a sessão de propósito -- causava "Sessão
  // inválida ou expirada" mesmo pegando um token "fresco" pelo relógio local. Com a trava, quem chamar
  // ensureFreshSession() enquanto já tem uma renovação em andamento espera essa MESMA renovação.
  let freshSessionRefreshPromise = null;
  async function ensureFreshSession(){
    if(!configured || !supabase) return;
    try{
      const { data, error } = await supabase.auth.getSession();
      if(error || !data || !data.session) return;
      const expiresAt = data.session.expires_at;
      const now = Math.floor(Date.now()/1000);
      if(expiresAt && (expiresAt - now) < 300){
        if(!freshSessionRefreshPromise){
          freshSessionRefreshPromise = supabase.auth.refreshSession().finally(() => { freshSessionRefreshPromise = null; });
        }
        await freshSessionRefreshPromise;
      }
    }catch(err){ /* melhor esforço -- se falhar aqui, a próxima gravação real ainda reporta o erro visivelmente */ }
  }
  if(configured && supabase){
    document.addEventListener("visibilitychange", () => {
      if(document.visibilityState === "visible") ensureFreshSession();
    });
    setInterval(ensureFreshSession, 4*60*1000);
  }

  // ---------------- instalação do app (PWA) -- mesmo mecanismo do Portal do Colaborador. A sessão do
  // Supabase já fica salva sozinha entre uma abertura e outra (só pede senha de novo se der logout) --
  // mas isso só é confiável quando o app está instalado na tela de início. Aberto como aba comum do
  // navegador (Safari especialmente), o iOS pode limpar os dados salvos do site depois de um tempo sem
  // uso, e aí parece que o login "não fica salvo" quando na verdade é o navegador limpando o dado. ------
  let deferredInstallPrompt = null; // guardado quando o Chrome/Android dispara beforeinstallprompt
  let installDismissed = false; // esconde o botão nesta sessão depois de instalar ou de mostrar a dica do iOS
  function isIOSDevice(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
  function isStandaloneApp(){ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }
  function installButtonHTML(){
    if(isStandaloneApp() || installDismissed) return "";
    if(deferredInstallPrompt) return `<button type="button" class="btn small" id="installAppBtn" style="width:auto;padding:8px 12px;white-space:nowrap">📲 Instalar app</button>`;
    if(isIOSDevice()) return `<button type="button" class="btn ghost small" id="installAppHint" style="width:auto;padding:8px 12px;white-space:nowrap">📲 Instalar</button>`;
    return "";
  }
  function wireInstallButtons(){
    const installBtn = $("#installAppBtn");
    if(installBtn) installBtn.addEventListener("click", async () => {
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if(choice.outcome==="accepted") installDismissed = true;
      render();
    });
    const installHint = $("#installAppHint");
    if(installHint) installHint.addEventListener("click", () => {
      alert('Pra instalar no iPhone: toque no ícone de Compartilhar (o quadrado com a seta pra cima) e escolha "Adicionar à Tela de Início".');
    });
  }
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if(state.view==="app" || state.view==="auth") render();
  });
  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null; installDismissed = true;
    if(state.view==="app" || state.view==="auth") render();
  });

  // Mesmo problema real encontrado no painel desktop: o Supabase (PostgREST) trunca silenciosamente
  // um "select('*')" sem paginação no limite do projeto (1000 linhas por padrão) -- attendance é 1
  // linha por funcionário por dia, passa de 1000 rapidinho, e sem "order by" o recorte que volta é
  // praticamente aleatório, fazendo apontamentos recentes "sumirem" ao recarregar mesmo salvando
  // certo. Sempre continua até uma página vazia (não assume tamanho pedido == devolvido).
  async function fetchAllRows(table, orderCol, filterFn){
    const PAGE = 1000;
    let allRows = [];
    let from = 0;
    while(true){
      let q = supabase.from(table).select("*").order(orderCol);
      if(filterFn) q = filterFn(q);
      const { data, error } = await q.range(from, from+PAGE-1);
      if(error) return { data: null, error };
      if(!data || !data.length) break;
      allRows = allRows.concat(data);
      from += data.length;
    }
    return { data: allRows, error: null };
  }

  // ---------------- helpers ----------------
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // Ícones de linha fina (SVG inline) na barra de baixo, em vez dos emojis coloridos -- pedido
  // explícito do usuário ("faz algo mais prêmio com ícones otimizados"). Mesmo conjunto do Portal do
  // Colaborador (stroke="currentColor" herda a cor do estado ativo/inativo já definido em .n/.n.active).
  const NAV_ICONS = {
    home: `<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/>`,
    inbox: `<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>`,
    users: `<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
    grid: `<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>`,
    logout: `<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>`,
  };
  function navIcon(name){
    return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${NAV_ICONS[name]||""}</svg>`;
  }
  // new Date().toISOString() converte pra UTC — perto da meia-noite local (Brasil, UTC-3) isso pode
  // devolver o dia de AMANHÃ. Monta a data a partir dos componentes locais em vez disso.
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c==="x" ? r : (r&0x3|0x8);
    return v.toString(16);
  });
  function toISO(d){ return d.toISOString().slice(0,10); }
  function brDate(iso){ if(!iso) return "—"; const [y,m,d]=String(iso).slice(0,10).split("-"); return `${d}/${m}/${y}`; }
  function addDays(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return toISO(d); }
  function mondayOf(dateISO){
    const d = new Date(dateISO+"T00:00:00");
    const day = d.getDay(); // 0=domingo
    const diff = (day===0? -6 : 1-day);
    d.setDate(d.getDate()+diff);
    return toISO(d);
  }
  // Semana ISO 8601 ("semana 38" etc., a mesma numeração que o PCM usa) -- ver mesma lógica no painel
  // desktop. Guarda no formato nativo do <input type="week"> ("AAAA-Wnn").
  function isoWeekOf(dateISO){
    const d = new Date(dateISO+"T00:00:00");
    const day = (d.getDay()+6)%7; // segunda=0 ... domingo=6
    d.setDate(d.getDate()-day+3); // quinta-feira da mesma semana
    const firstThursday = new Date(d.getFullYear(),0,4);
    const fdDay = (firstThursday.getDay()+6)%7;
    firstThursday.setDate(firstThursday.getDate()-fdDay+3);
    const week = 1 + Math.round((d-firstThursday)/(7*86400000));
    return { year: d.getFullYear(), week };
  }
  function isoWeekString(dateISO){
    const { year, week } = isoWeekOf(dateISO);
    return `${year}-W${String(week).padStart(2,"0")}`;
  }
  function isoWeekMonday(year, week){
    const jan4 = new Date(year,0,4);
    const jan4Day = (jan4.getDay()+6)%7;
    const week1Monday = new Date(jan4); week1Monday.setDate(jan4.getDate()-jan4Day);
    const monday = new Date(week1Monday); monday.setDate(week1Monday.getDate()+(week-1)*7);
    return toISO(monday);
  }
  function parseWeekInput(value){
    const m = /^(\d{4})-W(\d{2})$/.exec(value||"");
    if(!m) return null;
    return { year: Number(m[1]), week: Number(m[2]) };
  }
  function addMonths(monthStr, delta){
    const [y,m] = monthStr.split("-").map(Number);
    const d = new Date(y, (m-1)+delta, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }
  function diffDays(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
  function round2(n){ return Math.round((Number(n)||0)*100)/100; }
  function money(n){ return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}); }
  function monthRangeLabel(month){
    const [y,m] = month.split("-");
    return new Date(+y, +m-1, 1).toLocaleDateString("pt-BR", {month:"long", year:"numeric"});
  }
  const WEEKDAY_LABELS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const WEEKDAY_LABELS_LONG = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  const BILLING_KEYS = ["hh","insalubridade","periculosidade","bonusAssiduidade","planoSaude","valeTransporte","valeRefeicao"];
  const BILLING_LABELS = {
    hh:"H.H (hora trabalhada)", insalubridade:"Insalubridade", periculosidade:"Periculosidade",
    bonusAssiduidade:"Bônus assiduidade", planoSaude:"Plano de saúde",
    valeTransporte:"Vale transporte", valeRefeicao:"Vale refeição",
  };
  const TURNOS = ["Manhã","Tarde","Noite","Turno único"];
  const ATTENDANCE_STATUSES = ["presente","falta","folga","ferias"];
  const ATTENDANCE_STATUS_LABELS = { presente:"Presente", falta:"Falta", folga:"Folga", ferias:"Férias" };
  const TIME_OFF_TYPE_LABEL = { falta:"Falta", folga:"Folga", ferias:"Férias", solicitacao_geral:"Solicitação", atraso:"Atraso" };
  const REQUEST_STATUS_LABEL = { pendente:"Pendente", aprovado:"Aprovado", rejeitado:"Rejeitado" };
  function attendanceStatus(entry){
    if(!entry) return null;
    if(entry.status) return entry.status;
    return entry.present ? "presente" : "falta";
  }
  // Padrão CLT mínimo (Art. 7º XVI) — sobrescrito em loadAllData() com o valor real configurado no
  // painel desktop (tabela overtime_rules), se o schema já tiver essa tabela.
  const overtimeRules = { normalPct: 50, restDayPct: 100 };

  // ---------------- conversores linha<->objeto (mesmo formato do painel do gestor) ----------------
  function companyFromRow(r){ return { id:r.id, name:r.name, billing:r.billing||{}, roleRates:r.role_rates||[] }; }
  function companyToRow(c){ return { id:c.id, name:c.name, billing:c.billing||{}, role_rates:c.roleRates||[] }; }

    const active = document.activeElement;
    let focusInfo = null;
    if(active && root.contains(active) && active.id && (active.tagName==="INPUT" || active.tagName==="TEXTAREA")){
      focusInfo = { id: active.id, selectionStart: null, selectionEnd: null };
      try{ focusInfo.selectionStart = active.selectionStart; focusInfo.selectionEnd = active.selectionEnd; }
      catch(err){ /* tipos como date/number não suportam seleção de texto -- ainda restaura o foco */ }
    }
    root.innerHTML = viewHTML();
    wireView();
    if(focusInfo){
      const el = document.getElementById(focusInfo.id);
      if(el && (el.tagName==="INPUT" || el.tagName==="TEXTAREA")){
        el.focus();
        if(focusInfo.selectionStart!=null){
          try{ el.setSelectionRange(focusInfo.selectionStart, focusInfo.selectionEnd); }catch(err){ /* idem acima */ }
        }
      }
    }
  }
  function viewHTML(){
    if(state.view==="unconfigured") return `<div class="card" style="margin:40px 16px"><p style="margin-top:0">App ainda não conectado ao banco compartilhado.</p></div>`;
    if(state.view==="loading") return `<div class="spinner">Carregando…</div>`;
    if(state.view==="auth") return authHTML();
    if(state.view==="unauthorized") return unauthorizedHTML();
    return appShellHTML();
  }

  async function onAuthSubmit(){

    const password = $("#auth_password").value;
    state.authError = "";

  // ---------------- boot / carga de dados ----------------
  async function bootstrap(){
    if(!configured){ state.view = "unconfigured"; render(); return; }
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){ state.view = "auth"; render(); return; }
    state.session = session;

  async function afterLogin(){
    state.view = "loading"; render();
    const { data: profile } = await supabase.from("profiles").select("*").eq("id", state.session.user.id).maybeSingle();
    state.profile = profile;
    if(!profile || profile.role!=="admin"){
      await supabase.auth.signOut();
      state.view = "unauthorized";
      state.authError = profile ? `Essa conta não tem permissão de administrador (role atual: "${profile.role}").` : "Sessão válida, mas não existe registro em \"profiles\" pra essa conta.";
      render();
      return;
    }
    await loadAllData();
    state.view = "app"; state.tab = "inicio";
    render();
  }
  async function loadAllData(){
    const [c1,c2,c3,c4,c5,c6,c7,c8,c9,c10,c11] = await Promise.all([
      supabase.from("companies").select("*"),
      supabase.from("shifts").select("*"),
      supabase.from("holidays").select("*"),
      supabase.from("employees").select("*"),
      fetchAllRows("attendance", "id"),
      supabase.from("employee_shift_history").select("*"),
      supabase.from("profiles").select("id, employee_id, failed_login_attempts, locked_at").not("employee_id", "is", null),
      supabase.from("dss_topics").select("*").order("date",{ascending:false}).limit(30),
      supabase.from("checklist_categories").select("*").order("order"),
      supabase.from("checklist_areas").select("*").order("order"),
      supabase.from("checklist_equipment").select("*").order("order"),
    ]);
    const attByEmployee = {};
    (c5.data||[]).forEach(r => { (attByEmployee[r.employee_id] = attByEmployee[r.employee_id]||[]).push(attendanceFromRow(r)); });
    const shiftHistByEmployee = {};
    (c6.data||[]).forEach(r => { (shiftHistByEmployee[r.employee_id] = shiftHistByEmployee[r.employee_id]||[]).push(shiftHistoryRowToObj(r)); });
    Object.values(shiftHistByEmployee).forEach(list => list.sort((a,b)=> a.effectiveFrom < b.effectiveFrom ? -1 : 1));
    const profileByEmployee = {};
    (c7.data||[]).forEach(p => { profileByEmployee[p.employee_id] = p; });
    state.companies = (c1.data||[]).map(companyFromRow);
    state.shifts = (c2.data||[]).map(shiftFromRow);
    state.holidays = (c3.data||[]).map(holidayFromRow);
    state.employees = (c4.data||[]).map(r => employeeFromRow(r, attByEmployee[r.id]||[], shiftHistByEmployee[r.id]||[], profileByEmployee[r.id]));
    state.dssTopics = (c8.data||[]).map(dssTopicFromRow);
    state.checklistCategories = (c9.data||[]).map(checklistCategoryFromRow);
    state.checklistAreas = (c10.data||[]).map(checklistAreaFromRow);
    state.checklistEquipment = (c11.data||[]).map(checklistEquipmentFromRow);
    const { data: reqRows } = await fetchAllRows("time_off_requests", "created_at");
    state.timeOffRequests = (reqRows||[]).map(timeOffRequestFromRow).sort((a,b)=> a.createdAt < b.createdAt ? 1 : -1);
    // Fora do Promise.all de propósito: se essa tabela ainda não existir (schema não atualizado no
    // banco), não pode derrubar o carregamento do resto — best-effort, mantém o padrão CLT se falhar.
    try{
      const { data: otRow } = await supabase.from("overtime_rules").select("*").eq("id", true).maybeSingle();
      if(otRow){ overtimeRules.normalPct = Number(otRow.normal_pct); overtimeRules.restDayPct = Number(otRow.rest_day_pct); }
    }catch(err){ /* sem essa tabela ainda, ou sem conexão — mantém o padrão CLT */ }
    // Idem: tabela nova (Backlog de OS do PCM), fora do Promise.all pra não derrubar o resto se o
    // schema ainda não tiver rodado nesse banco.
    try{
      const { data: soRows, error: soErr } = await supabase.from("service_orders").select("*");
      if(soErr) throw soErr;
      state.serviceOrders = (soRows||[]).map(serviceOrderFromRow);
    }catch(err){ state.serviceOrders = state.serviceOrders || []; }
    // Idem: lista mestre de setores (cadastrada no painel desktop), fora do Promise.all pelo mesmo motivo.
    try{
      const { data: setorRows, error: setorErr } = await supabase.from("setores").select("*");
      if(setorErr) throw setorErr;
      state.setores = (setorRows||[]).map(setorFromRow);
    }catch(err){ state.setores = state.setores || []; }
  }
  // Histórico de checklists preenchidos — sob demanda (só quando a subaba Histórico é aberta/filtrada),
  // não no boot. Sem o join do painel desktop (select("*, employees(name)")): o nome do funcionário já
  // está disponível localmente em state.employees, então uma segunda ida ao banco só pra isso é
  // desnecessária.
  async function fetchChecklistHistory({month, employeeId, categoryId}){
    let q = supabase.from("daily_checklists").select("*").order("date", {ascending:false});
    // Nunca usar "${month}-31" como limite superior: fevereiro/abril/etc não têm 31 dias, e um filtro
    // com data inválida (ex: "2026-09-31") faz a query inteira falhar no Postgres. Usa o dia 1 do mês
    // seguinte como limite exclusivo, que funciona pra qualquer mês sem precisar calcular dias no mês.
    if(month) q = q.gte("date", `${month}-01`).lt("date", `${addMonths(month,1)}-01`);
    if(employeeId) q = q.eq("employee_id", employeeId);
    if(categoryId) q = q.eq("category_id", categoryId);
    const { data, error } = await q;
    if(error){ alert("Não consegui carregar o histórico de checklists: "+error.message); return; }
    state.checklistHistory = (data||[]).map(r => ({
      id:r.id, employeeId:r.employee_id,
      employeeName: state.employees.find(e=>e.id===r.employee_id)?.name || "—",
      date:r.date, categoryId:r.category_id, items:r.items||[],
      completedServiceOrders:r.completed_service_orders||[],
    }));
  }

  // ---------------- decisão de solicitações (mesma lógica do painel desktop, sem Kanban) ----------------
  async function applyApprovedTimeOff(req, employee){
    const dayCount = Math.round((new Date(req.dateEnd) - new Date(req.dateStart)) / 86400000) + 1;
    if(dayCount > 120){ alert(`Esse intervalo tem ${dayCount} dias — grande demais pra aplicar automaticamente. Ajuste pelo painel desktop.`); return false; }
    if(req.type==="ferias"){
      const totalDebit = dayCount + (req.diasVendidos||0);
      const saldo = employee.feriasSaldoDias ?? 0;
      if(totalDebit > saldo){
        alert(`Saldo de férias insuficiente: ${employee.name} tem ${saldo} dia(s) disponíveis, e esse pedido descontaria ${totalDebit}.`);
        return false;
      }
    }
    const rows = timeOffRequestToAttendanceRows(req, employee);
    const { error } = await trackedCloudCall(supabase.from("attendance").upsert(rows.map(r=>attendanceToRow(employee.id, r)), { onConflict:"employee_id,date" }));
    if(error){ alert("Não consegui gravar a frequência: "+error.message); return false; }
    const byDate = new Map(rows.map(r=>[r.date, r]));
    employee.attendance = [...(employee.attendance||[]).filter(a=>!byDate.has(a.date)), ...rows];
    if(req.type==="ferias"){
      employee.feriasSaldoDias = (employee.feriasSaldoDias ?? 0) - (dayCount + (req.diasVendidos||0));
      await trackedCloudCall(supabase.from("employees").update({ ferias_saldo_dias: employee.feriasSaldoDias }).eq("id", employee.id));
    }
    req.status = "aprovado";
    return true;
  }
  async function decideRequest(reqId, status, responseText){
    const { data: fresh, error: fetchErr } = await supabase.from("time_off_requests").select("*").eq("id", reqId).maybeSingle();
    if(fetchErr){ alert("Não consegui confirmar o pedido: "+fetchErr.message); return; }
    if(!fresh || fresh.status!=="pendente"){ alert("Esse pedido já não está mais pendente (decidido em outro dispositivo)."); await refreshAllData(); return; }
    const req = timeOffRequestFromRow(fresh);
    const employee = state.employees.find(e=>e.id===req.employeeId);
    if(!employee){ alert("Funcionário não encontrado."); return; }
    closeModalRoot();
    if(req.type==="solicitacao_geral"){
      req.status = status;
      req.adminResponse = responseText||"";
      req.adminRespondedAt = new Date().toISOString();
      const { error } = await supabase.from("time_off_requests").upsert(timeOffRequestToRow(req));
      if(error){ alert("Não consegui salvar a decisão: "+error.message); return; }
      state.timeOffRequests = [req, ...state.timeOffRequests.filter(r=>r.id!==req.id)];
      render();
      insertNotifications([{ employee_id: req.employeeId, type:"solicitacao_geral", title:"Sua solicitação foi respondida", body: responseText || `Sua solicitação "${req.title||''}" foi ${status==="aprovado"?"aprovada":"rejeitada"}.` }]);
      return;
    }
    if(status==="rejeitado"){
      req.status = "rejeitado";
      const { error } = await supabase.from("time_off_requests").upsert(timeOffRequestToRow(req));
      if(error){ alert("Não consegui salvar a decisão: "+error.message); return; }
    } else {
      const ok = await applyApprovedTimeOff(req, employee);
      if(!ok) return;
      const { error } = await supabase.from("time_off_requests").upsert(timeOffRequestToRow(req));
      if(error){ alert("Não consegui salvar a decisão: "+error.message); return; }
    }
    state.timeOffRequests = [req, ...state.timeOffRequests.filter(r=>r.id!==req.id)];
    render();
    notifyRequestStatus(req);
  }
  function closeModalRoot(){ $("#modalRoot").innerHTML = ""; }

  // ---------------- reset de senha (mesma Edge Function do painel desktop) ----------------
  async function resetEmployeePassword(employee){
    if(!employee || !confirm(`Resetar a senha de ${employee.name}? Uma senha temporária nova vai ser gerada.`)) return;
    try{
      // Busca a sessão FRESCA na hora de chamar, em vez de usar state.session (só setado uma vez no
      // login) -- essa Edge Function confere o token de acesso de verdade, então um token velho (sessão
      // aberta há muito tempo no celular) batia "Sessão inválida ou expirada" mesmo o gestor continuando
      // logado normalmente no resto do app. Mesmo bug e mesma correção do painel desktop.
      await ensureFreshSession();
      const { data: { session: freshSession } } = await supabase.auth.getSession();
      if(!freshSession){ alert("Sua sessão expirou -- faça login de novo e tente outra vez."); return; }
      const resp = await fetch(`${SUPABASE_URL}/functions/v1/admin-reset-password`, {
        method: "POST",
        headers: { "Content-Type":"application/json", "Authorization": `Bearer ${freshSession.access_token}` },
        body: JSON.stringify({ employeeId: employee.id }),
      });
      const result = await resp.json();
      if(!resp.ok || result.error){ alert("Não consegui resetar a senha: "+(result.error||resp.statusText)); return; }
      employee.lockedAt = null;
      render();
      alert(`Senha resetada! Senha temporária de ${employee.name}: ${result.tempPassword}\n\nAvise o colaborador (ele pode trocar depois no "🔑 Senha" do portal dele).${result.relinked ? "\n\n(A conta dele(a) estava com o vínculo quebrado -- já corrigi isso também.)" : ""}`);
    }catch(err){ alert("Falha de conexão ao resetar a senha: "+err.message); }
  }

        <button class="btn small" id="newEmployeeBtn" style="width:auto">+ Novo</button>
      </div>
      ${locked.length ? `<div class="alert-banner">🔒 <div><b>${locked.length} colaborador(es)</b> com login bloqueado.</div></div>` : ""}
      <div class="field" style="margin-bottom:14px"><input class="input" id="employeeSearchInput" placeholder="Buscar por nome ou cargo…" value="${esc(state.employeeSearch||"")}" /></div>
      <div class="card" style="padding:4px 16px">
        ${list.map(e => {
          const company = state.companies.find(c=>c.id===e.companyId);
          return `
          <div class="req-row" data-openemp="${e.id}">
            <div class="d">${esc(e.name)}${e.status==="Inativo"?' <span style="color:var(--muted);font-weight:400">(inativo)</span>':''}</div>
            <div class="sub">${esc(e.cargo||"")}${company?` · ${esc(company.name)}`:""}</div>
            ${e.lockedAt ? `<button class="btn small" data-resetpw="${e.id}" style="margin-top:8px">🔑 Resetar senha</button>` : ""}
          </div>`;
        }).join("") || `<p class="empty">${q?"Nenhum funcionário encontrado.":"Nenhum funcionário cadastrado."}</p>`}

  }
  // Ficha completa (criar/editar) — mesma lógica de troca de turno do painel desktop: se o turno padrão
  // mudou, grava uma linha de histórico (gênese + nova, se ainda não havia histórico) e notifica o
  // colaborador, pra shiftIdForEmployeeOnDate continuar resolvendo corretamente datas passadas.
  function openEmployeeModal(employee){
    const f = employee ? {...employee, rates:{...employee.rates}} : {
      id: uid(), name:"", email:"", cargo:"", companyId: state.companies[0]?.id || "", shiftId:"", admissao: todayISO(), status:"Ativo",
      rates: Object.fromEntries(BILLING_KEYS.map(k=>[k,0])), attendance: [], shiftHistory: [], feriasSaldoDias: 30,
    };
    const rateFieldsHTML = (companyId) => {
      const company = state.companies.find(c=>c.id===companyId);
      if(!company) return `<div style="color:var(--muted);font-size:12.5px">Selecione uma empresa pra ver os campos de custo aplicáveis.</div>`;
      const applicable = BILLING_KEYS.filter(k => company.billing[k]);
      if(!applicable.length) return `<div style="color:var(--muted);font-size:12.5px">Essa empresa não tem formas de cobrança configuradas.</div>`;
      return applicable.map(k => `
        <div class="field"><label>${BILLING_LABELS[k]} ${k==='hh'?'(R$/hora)':'(R$/mês)'}</label>
        <input type="number" step="0.01" class="input" id="e_rate_${k}" value="${f.rates[k]||0}" /></div>`).join("");
    };
    $("#modalRoot").innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="modal-head"><h3>${employee?"Editar funcionário":"Novo funcionário"}</h3><button class="btn ghost small" id="closeModal" type="button">✕</button></div>
          <div class="field"><label>Nome completo</label><input class="input" id="e_name" value="${esc(f.name)}" /></div>
          <div class="field"><label>E-mail (login do portal do colaborador)</label><input type="email" class="input" id="e_email" value="${esc(f.email||"")}" placeholder="nome@exemplo.com" /></div>
          <div class="field"><label>Cargo / função</label><input class="input" id="e_cargo" value="${esc(f.cargo)}" /></div>
          <div class="field"><label>Empresa</label>
            <select class="input" id="e_company">${[...state.companies].sort((a,b)=>a.name.localeCompare(b.name,"pt-BR")).map(c=>`<option value="${c.id}" ${c.id===f.companyId?'selected':''}>${esc(c.name)}</option>`).join("")}</select>
          </div>
          <div class="field"><label>Turno padrão</label>
            <select class="input" id="e_shift">
              <option value="">— não definido —</option>
              ${[...state.shifts].sort((a,b)=>a.name.localeCompare(b.name,"pt-BR")).map(s=>`<option value="${s.id}" ${s.id===f.shiftId?'selected':''}>${esc(s.name)}</option>`).join("")}
            </select>
          </div>
          <div class="field" id="e_shiftEffectiveWrap" style="display:none">
            <label>Turno novo vigente a partir de</label>
            <input type="date" class="input" id="e_shiftEffectiveDate" value="${todayISO()}" />
          </div>
          <div class="field"><label>Data de admissão</label><input type="date" class="input" id="e_admissao" value="${f.admissao}" /></div>
          <div class="field"><label>Status</label>
            <select class="input" id="e_status"><option ${f.status==='Ativo'?'selected':''}>Ativo</option><option ${f.status==='Inativo'?'selected':''}>Inativo</option></select>
          </div>
          <div class="field"><label>Saldo de férias (dias)</label><input type="number" class="input" id="e_ferias_saldo" value="${f.feriasSaldoDias}" /></div>
          <div id="rateFields">${rateFieldsHTML(f.companyId)}</div>
          <div class="modal-actions">
            <button class="btn ghost" id="cancelModal" type="button">Cancelar</button>
            <button class="btn" id="saveEmployee" type="button">Salvar funcionário</button>
          </div>
        </div>
      </div>
    `;
    const close = () => { $("#modalRoot").innerHTML = ""; };
    $("#closeModal").addEventListener("click", close);
    $("#cancelModal").addEventListener("click", close);
    $("#backdrop").addEventListener("click", e => { if(e.target.id==="backdrop") close(); });
    $("#e_company").addEventListener("change", e => { $("#rateFields").innerHTML = rateFieldsHTML(e.target.value); });
    const refreshShiftEffectiveWrap = () => {
      const changed = f.shiftId && $("#e_shift").value && $("#e_shift").value !== f.shiftId;
      $("#e_shiftEffectiveWrap").style.display = changed ? "block" : "none";
    };
    $("#e_shift").addEventListener("change", refreshShiftEffectiveWrap);
    refreshShiftEffectiveWrap();
    $("#saveEmployee").addEventListener("click", async () => {
      const companyId = $("#e_company").value;
      const company = state.companies.find(c=>c.id===companyId);
      const rates = {...f.rates};
      if(company) BILLING_KEYS.filter(k=>company.billing[k]).forEach(k => { const el = $(`#e_rate_${k}`); if(el) rates[k] = Number(el.value||0); });
      const updated = {
        id: f.id, name: $("#e_name").value.trim() || "Sem nome", email: $("#e_email").value.trim(), cargo: $("#e_cargo").value,
        companyId, shiftId: $("#e_shift").value, admissao: $("#e_admissao").value, status: $("#e_status").value,
        rates, attendance: f.attendance || [], shiftHistory: f.shiftHistory || [],
        feriasSaldoDias: Math.max(0, Number($("#e_ferias_saldo").value)||0),
      };
      // Lida ANTES de close() apagar o modal do DOM — senão o campo já não existe mais na hora de ler
      // o valor (bug real: a data escolhida nunca era usada, sempre caía no "hoje").
      const shiftEffectiveDateInput = $("#e_shiftEffectiveDate")?.value;
      const btn = $("#saveEmployee"); btn.disabled = true; btn.textContent = "Salvando…";
      const { error } = await supabase.from("employees").upsert(employeeToRow(updated));
      if(error){ alert("Não consegui salvar: "+error.message); btn.disabled = false; btn.textContent = "Salvar funcionário"; return; }
      const exists = state.employees.some(e=>e.id===updated.id);
      state.employees = exists ? state.employees.map(e=>e.id===updated.id?updated:e) : [...state.employees, updated];
      close(); render();
      // Só avisa/grava histórico numa mudança de turno de verdade — não no cadastro inicial (f.shiftId vazio).
      if(f.shiftId && updated.shiftId && f.shiftId!==updated.shiftId){
        const oldShift = state.shifts.find(s=>s.id===f.shiftId);
        const newShift = state.shifts.find(s=>s.id===updated.shiftId);
        const effectiveDate = shiftEffectiveDateInput || todayISO();
        const newRows = [];
        if(!updated.shiftHistory.length) newRows.push({ shiftId: f.shiftId, effectiveFrom: f.admissao || "2000-01-01" });
        newRows.push({ shiftId: updated.shiftId, effectiveFrom: effectiveDate });
        updated.shiftHistory = [...updated.shiftHistory, ...newRows];
        try{
          await supabase.from("employee_shift_history").upsert(newRows.map(h=>shiftHistoryObjToRow(updated.id, h)), { onConflict:"employee_id,effective_from" });
        }catch(err){ console.error("Falha ao gravar histórico de turno", err); }
        insertNotifications([{ employee_id: updated.id, type:"turno", title:"Seu turno foi alterado", body:`Seu turno foi alterado de ${oldShift?oldShift.name:"—"} para ${newShift?newShift.name:"—"}, a partir de ${brDate(effectiveDate)}.` }]);
        const empresa = state.companies.find(c=>c.id===updated.companyId);
        const { subject, body } = buildShiftChangeEmailText(updated, empresa, oldShift, newShift, effectiveDate);
        openShiftChangeEmailModal(subject, body);
      }
    });
  }

  // E-mail padrão pra avisar a empresa terceirizada de uma troca de turno — só monta o texto (sem
  // guardar e-mail de empresa nenhum), o gestor copia/abre no próprio programa de e-mail e preenche o
  // destinatário na hora.
  function buildShiftChangeEmailText(employee, company, oldShift, newShift, effectiveDate){
    const subject = `Alteração de turno — ${employee.name}`;
    const body = `Prezados,\n\nInformamos que o turno do(a) colaborador(a) ${employee.name}${employee.cargo ? ` (${employee.cargo})` : ""}, alocado(a) em ${company?company.name:"—"}, foi alterado:\n\nTurno anterior: ${oldShift?oldShift.name:"—"}\nNovo turno: ${newShift?newShift.name:"—"}\nVigência: a partir de ${brDate(effectiveDate)}\n\nQualquer dúvida, estamos à disposição.\n\nAtenciosamente,\nFertgrow`;
    return { subject, body };
  }
  function openShiftChangeEmailModal(subject, body){
    $("#modalRoot").innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="modal-head"><h3>E-mail pronto pra empresa</h3><button class="btn ghost small" id="closeModal" type="button">✕</button></div>
          <p style="font-size:12px;color:var(--muted);margin-top:0">Copie o texto (ou abra direto no seu app de e-mail) e preencha o destinatário — não guardamos e-mail de empresa no sistema.</p>
          <div class="field"><label>Assunto</label><input class="input" id="email_subject" readonly value="${esc(subject)}" /></div>
          <div class="field"><label>Corpo</label><textarea class="input" id="email_body" readonly rows="9">${esc(body)}</textarea></div>
          <div class="modal-actions">
            <button class="btn ghost" id="copyEmailBtn" type="button">📋 Copiar texto</button>
            <a class="btn" id="openMailBtn" href="mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">✉️ Abrir no e-mail</a>
          </div>
          <div class="modal-actions">
            <button class="btn ghost" id="cancelModal" type="button">Fechar</button>
          </div>
        </div>
      </div>
    `;
    const close = () => { $("#modalRoot").innerHTML = ""; };
    $("#closeModal").addEventListener("click", close);
    $("#cancelModal").addEventListener("click", close);
    $("#backdrop").addEventListener("click", e => { if(e.target.id==="backdrop") close(); });
    $("#copyEmailBtn").addEventListener("click", async () => {
      const full = `Assunto: ${subject}\n\n${body}`;
      const btn = $("#copyEmailBtn");
      try{
        await navigator.clipboard.writeText(full);
        btn.textContent = "✅ Copiado!";
        setTimeout(() => { const b = $("#copyEmailBtn"); if(b) b.textContent = "📋 Copiar texto"; }, 1800);
      }catch(err){
        const ta = $("#email_body"); ta.focus(); ta.select();
        alert("Não consegui copiar automaticamente — selecionei o texto do corpo, use Ctrl+C pra copiar (e copie o assunto à parte).");
      }
    });
  }

  // ---------------- Mais (menu pro resto do escopo — próximos passes) ----------------
  function maisHTML(){
    const items = [
      { ic:"🕐", lbl:"Frequência", tab:"frequencia" },
      { ic:"🔄", lbl:"Turnos", tab:"turnos" }, { ic:"📅", lbl:"Feriados", tab:"feriados" },
      { ic:"🗓️", lbl:"Calendário", tab:"calendario" }, { ic:"🏖️", lbl:"Mapa de Férias", tab:"mapaferias" }, { ic:"📊", lbl:"Indicadores", tab:"indicadores" },

  // ---------------- Banners (aniversário / ano de empresa / férias) -- mesmo gerador do painel
  // desktop (canvas próprio, sem depender de serviço externo), só com a UI em coluna única pro celular.
  // Cada tipo tem um layout de verdade diferente: aniversário e ano de empresa são comemorativos (um
  // foca no nome, o outro numa medalha com o número de anos), férias é compacto e só informativo.
  const BANNER_MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  function bnFormatLong(iso){
    if(!iso) return "";
    const [y,m,d] = iso.split("-").map(Number);
    return `${d} de ${BANNER_MESES[m-1]}`;
  }
  function bnFitFont(ctx, text, maxWidth, maxSize, minSize, weight, family){
    let size = maxSize;
    ctx.font = `${weight} ${size}px "${family}"`;
    while(size > minSize && ctx.measureText(text).width > maxWidth){
      size -= 2;
      ctx.font = `${weight} ${size}px "${family}"`;
    }
    return size;
  }
  function bnRoundRectPath(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  // Só primeiro + último nome no banner -- nome completo (com os do meio) estourava a largura em
  // sobrenomes compostos, mesmo com o fitFont reduzindo a fonte até o mínimo.
  function bnShortName(name){
    const parts = (name||"").trim().split(/\s+/).filter(Boolean);
    if(parts.length<=1) return parts[0]||"";
    return parts[0] + " " + parts[parts.length-1];
  }
  // Paleta clara + verde da marca, alinhada com os banners que a Fertgrow já usa hoje (fundo claro,
  // balões verde/branco, confete dourado, tipografia bold sans) -- a versão anterior (fundo escuro +
  // serifada + dourado) lia como cartão de Natal, não como o material da empresa.
  function bnWatermarkArcs(ctx, W, H, color){
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    [[W*0.18,H*0.0,520],[W*0.9,H*0.16,440],[W*0.02,H*0.86,480],[W*0.98,H*1.02,520]].forEach(([cx,cy,r])=>{
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    });
    ctx.restore();
  }
  function bnConfetti(ctx, pieces, color){
    pieces.forEach(([x,y,len,ang])=>{
      ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
      ctx.fillStyle = color; ctx.fillRect(-len/2,-3,len,6);
      ctx.restore();
    });
  }
  function bnBalloon(ctx, cx, cy, w, h, color, highlight){
    const grad = ctx.createRadialGradient(cx-w*0.26,cy-h*0.3,w*0.05,cx,cy,w*0.78);
    grad.addColorStop(0,highlight); grad.addColorStop(1,color);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(cx,cy,w/2,h/2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx-7,cy+h/2-4); ctx.lineTo(cx+7,cy+h/2-4); ctx.lineTo(cx,cy+h/2+14);
    ctx.closePath(); ctx.fill();
  }
  // Três balões meio cortados pela borda (igual ao material de referência) -- "dir" espelha o cacho
  // pro lado direito, pra usar o mesmo helper nos dois cantos.
  function bnBalloonCluster(ctx, cx, cy, green, dir){
    bnBalloon(ctx, cx-40*dir, cy+10, 130, 160, green, "#4fb876");
    bnBalloon(ctx, cx+55*dir, cy-30, 110, 140, "#f7f6f1", "#ffffff");
    bnBalloon(ctx, cx+10*dir, cy+70, 100, 128, green, "#4fb876");
  }
  function bnWrapCentered(ctx, text, cx, y, maxWidth, lineHeight){
    const words = text.split(" ");
    let line = "", lines = [];
    words.forEach(w=>{
      const test = line ? line+" "+w : w;
      if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
      else line = test;
    });
    if(line) lines.push(line);
    const startY = y - (lines.length-1)*lineHeight/2;
    lines.forEach((l,i)=>ctx.fillText(l, cx, startY + i*lineHeight));
  }
  function bnWordmark(ctx, cx, y, logoImg, color){
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    if(logoImg){
      const maxH=84, maxW=420;
      let lw=logoImg.width, lh=logoImg.height;
      const scale = Math.min(maxH/lh, maxW/lw, 1);
      lw*=scale; lh*=scale;
      ctx.drawImage(logoImg, cx-lw/2, y-lh, lw, lh);
    } else {
      ctx.fillStyle = color;
      ctx.font = `800 34px "Manrope"`;
      ctx.fillText("FERTGROW", cx, y);
    }
  }
  const BN_GREEN = "#0B6B33", BN_GREEN_LIGHT = "#AFD676", BN_DARK = "#17291d", BN_MUTED = "rgba(23,41,29,0.55)", BN_BG = "#f5f4ef";
  function drawAniversarioBanner(ctx, W, H, data, logoImg){
    ctx.fillStyle = BN_BG; ctx.fillRect(0,0,W,H);
    bnWatermarkArcs(ctx, W, H, "rgba(23,41,29,0.06)");
    bnConfetti(ctx, [[130,70,26,0.3],[900,50,22,-0.5],[820,150,18,0.9],[80,190,16,-0.2],[960,230,14,0.6],[200,40,18,-0.7]], "#cda029");
    bnBalloonCluster(ctx, W*0.04, H*0.94, BN_GREEN, 1);
    bnBalloonCluster(ctx, W*0.98, H*0.9, BN_GREEN, -1);

    bnWordmark(ctx, W/2, 190, logoImg, BN_DARK);

    ctx.textAlign = "center";
    ctx.fillStyle = BN_GREEN;
    ctx.font = `800 66px "Manrope"`;
    ctx.fillText("Feliz aniversário!", W/2, 330);

    const nome = (bnShortName(data.nome)||"Nome do colaborador").toUpperCase();
    const nameSize = bnFitFont(ctx, nome, 880, 52, 32, 800, "Manrope");
    ctx.fillStyle = BN_DARK; ctx.font = `800 ${nameSize}px "Manrope"`;
    ctx.fillText(nome, W/2, 410);

    if(data.cargo){
      ctx.save(); ctx.fillStyle = BN_MUTED; ctx.font = `600 22px "Manrope"`; ctx.letterSpacing = "2px";
      ctx.fillText(data.cargo.toUpperCase(), W/2, 448); ctx.restore();
    }

    ctx.fillStyle = BN_DARK; ctx.font = `500 32px "Manrope"`;
    bnWrapCentered(ctx, "Que o novo ciclo venha acompanhado de saúde e alegrias!", W/2, 530, 800, 42);

    if(data.data1){
      ctx.fillStyle = BN_MUTED; ctx.font = `600 22px "Manrope"`;
      ctx.fillText(bnFormatLong(data.data1), W/2, 630);
    }

    ctx.fillStyle = BN_MUTED; ctx.font = `500 18px "Manrope"`;
    ctx.fillText("Equipe Fertgrow", W/2, H-70);
  }
  function drawAnoEmpresaBanner(ctx, W, H, data, logoImg){
    ctx.fillStyle = BN_BG; ctx.fillRect(0,0,W,H);
    bnWatermarkArcs(ctx, W, H, "rgba(23,41,29,0.06)");
    bnBalloonCluster(ctx, W*0.02, H*0.1, BN_GREEN, 1);
    bnBalloonCluster(ctx, W*0.99, H*0.92, BN_GREEN, -1);

    bnWordmark(ctx, W/2, 140, logoImg, BN_DARK);

    ctx.textAlign = "center";
    ctx.fillStyle = BN_GREEN;
    ctx.font = `800 68px "Manrope"`;
    ctx.fillText("Parabéns!", W/2, 400);

    const nome = (bnShortName(data.nome)||"Nome do colaborador").toUpperCase();
    const nameSize = bnFitFont(ctx, nome, 880, 46, 28, 800, "Manrope");
    ctx.fillStyle = BN_DARK; ctx.font = `800 ${nameSize}px "Manrope"`;
    ctx.fillText(nome, W/2, 460);

    if(data.cargo){
      ctx.save(); ctx.fillStyle = BN_MUTED; ctx.font = `600 20px "Manrope"`; ctx.letterSpacing = "2px";
      ctx.fillText(data.cargo.toUpperCase(), W/2, 496); ctx.restore();
    }

    const anos = data.anos || "1";
    ctx.fillStyle = BN_GREEN; ctx.font = `800 170px "Manrope"`;
    ctx.fillText(String(anos), W/2, 700);

    const label = Number(anos)===1 ? "1 ANO DE EMPRESA" : `${anos} ANOS DE EMPRESA`;
    ctx.font = `800 34px "Manrope"`;
    const labelW = ctx.measureText(label).width;
    ctx.fillStyle = BN_GREEN_LIGHT;
    bnRoundRectPath(ctx, W/2-labelW/2-18, 730, labelW+36, 52, 8); ctx.fill();
    ctx.fillStyle = BN_GREEN;
    ctx.fillText(label, W/2, 766);

    ctx.fillStyle = BN_DARK; ctx.font = `500 30px "Manrope"`;
    bnWrapCentered(ctx, "Mais um ano compartilhando desafios e resultados.", W/2, 860, 780, 40);

    ctx.fillStyle = BN_MUTED; ctx.font = `500 18px "Manrope"`;
    ctx.fillText("Equipe Fertgrow", W/2, H-70);
  }
  function drawFeriasBanner(ctx, W, H, data, logoImg){
    ctx.fillStyle = BN_BG; ctx.fillRect(0,0,W,H);
    bnWatermarkArcs(ctx, W, H, "rgba(23,41,29,0.05)");

    bnWordmark(ctx, W/2, 150, logoImg, BN_DARK);

    ctx.textAlign = "center";
    ctx.save(); ctx.fillStyle = BN_GREEN; ctx.font = `800 24px "Manrope"`; ctx.letterSpacing = "3px";
    ctx.fillText("AVISO DE FÉRIAS", W/2, 210); ctx.restore();

    const nome = (bnShortName(data.nome)||"Nome do colaborador").toUpperCase();
    const nameSize = bnFitFont(ctx, nome, 880, 58, 34, 800, "Manrope");
    ctx.fillStyle = BN_DARK; ctx.font = `800 ${nameSize}px "Manrope"`;
    ctx.fillText(nome, W/2, 610);

    if(data.cargo){
      ctx.save(); ctx.fillStyle = BN_MUTED; ctx.font = `600 24px "Manrope"`; ctx.letterSpacing = "2px";
      ctx.fillText(data.cargo.toUpperCase(), W/2, 655); ctx.restore();
    }

    ctx.strokeStyle = "rgba(23,41,29,0.18)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W/2-90,710); ctx.lineTo(W/2+90,710); ctx.stroke();

    const col1X = W/2-200, col2X = W/2+200;
    ctx.save(); ctx.fillStyle = BN_MUTED; ctx.font = `700 18px "Manrope"`; ctx.letterSpacing = "2px";
    ctx.fillText("SAÍDA", col1X, 780);
    ctx.fillText("RETORNO", col2X, 780);
    ctx.restore();
    ctx.fillStyle = BN_DARK; ctx.font = `700 42px "Manrope"`;
    ctx.fillText(bnFormatLong(data.data1)||"—", col1X, 835);
    ctx.fillStyle = BN_GREEN; ctx.font = `700 42px "Manrope"`;
    ctx.fillText(bnFormatLong(data.data2)||"—", col2X, 835);

    ctx.strokeStyle = "rgba(23,41,29,0.15)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W/2,750); ctx.lineTo(W/2,845); ctx.stroke();

    ctx.fillStyle = BN_MUTED; ctx.font = `500 18px "Manrope"`;
    ctx.fillText("Equipe Fertgrow", W/2, H-70);
  }
  // Detecta sozinho quem faz aniversário, aniversário de empresa ou começa férias HOJE -- pedido
  // explícito do usuário: "nada manual, quero só baixar". bnAutoMatches guarda o resultado do último
  // render pro clique no botão (que só manda o índice) achar de volta o funcionário/dados certos.
  let bnAutoMatches = [];
  function bnComputeAutoMatches(){
    const today = todayISO();
    const now = new Date(); now.setHours(0,0,0,0);
    const list = [];
    state.employees.filter(e=>e.status==="Ativo").forEach(e => {
      [
        e.birthDate ? { date:e.birthDate, kind:"aniversario" } : null,
        e.admissao ? { date:e.admissao, kind:"ano_empresa" } : null,
      ].filter(Boolean).forEach(({date,kind}) => {
        const [y,m,d] = date.split("-").map(Number);
        if(!y || !m || !d || m!==(now.getMonth()+1) || d!==now.getDate()) return;
        const years = now.getFullYear() - y;
        if(kind==="ano_empresa" && years<=0) return;
        list.push(kind==="aniversario" ? { kind, employee:e } : { kind, employee:e, years });
      });
    });
    state.timeOffRequests.filter(r=>r.type==="ferias" && r.status==="aprovado" && r.dateStart===today).forEach(r => {
      const employee = state.employees.find(e=>e.id===r.employeeId);
      if(employee) list.push({ kind:"ferias", employee, request:r });
    });
    bnAutoMatches = list;
    return list;
  }
  function bnAutoAvisoHTML(){
    const matches = bnComputeAutoMatches();
    const todayLabel = new Date().toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long"});
    return `
      <div class="card" style="margin-bottom:14px">
        <div style="font-weight:700;margin-bottom:2px">Hoje</div>
        <p style="font-size:11.5px;color:var(--muted);margin:0 0 10px;text-transform:capitalize">${esc(todayLabel)}</p>
        ${!matches.length ? `<p class="empty" style="margin:0">Nenhum aniversário, aniversário de empresa ou início de férias hoje.</p>` : `
        <div style="display:flex;flex-direction:column;gap:8px">
          ${matches.map((m,i) => {
            const label = m.kind==="aniversario" ? "🎂 Aniversário"
              : m.kind==="ano_empresa" ? `🏆 ${m.years} ano${m.years===1?"":"s"} de empresa`
              : `🌿 Início das férias — volta em ${brDate(m.request.dateEnd)}`;
            return `<div class="row-flex" style="justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;background:var(--surface2);border-radius:10px">
              <div><b style="font-size:14px">${esc(m.employee.name)}</b><div style="font-size:12px;color:var(--muted)">${label}</div></div>
              <button class="btn small" style="width:auto" data-bnauto="${i}">⬇ Baixar</button>
            </div>`;
          }).join("")}
        </div>`}
      </div>
    `;
  }
  function bannersHTML(){

    const canvasW = 1080, canvasH = 1350;
    return `

        <span class="link" data-tab="mais">← Mais</span>
      </div>
      ${bnAutoAvisoHTML()}
      <div class="tabs2" style="margin-bottom:14px">
        <div class="t ${type==='aniversario'?'active':''}" data-bannertype="aniversario">Aniversário</div>
        <div class="t ${type==='ano_empresa'?'active':''}" data-bannertype="ano_empresa">Ano de empresa</div>
        <div class="t ${type==='ferias'?'active':''}" data-bannertype="ferias">Férias</div>

      ${type==="aniversario" ? `
      <div class="field" style="margin-top:10px"><label>Data de aniversário</label><input type="date" class="input" id="bn_data1" value="${state.bannerData1||todayISO()}" /></div>

        <div class="field" style="flex:1"><label>Retorno</label><input type="date" class="input" id="bn_data2" value="${state.bannerData2||todayISO()}" /></div>

        <label>Logo da empresa (opcional)</label>
        <div class="row-flex" style="gap:10px;align-items:center">
          <input type="file" id="bn_logo" accept="image/png,image/jpeg,image/svg+xml,image/webp" />
          ${bannerLogoImg ? `<button class="btn ghost small" id="bn_logo_clear" type="button" style="width:auto">Remover</button>` : ""}
        </div>
      </div>
      <div style="display:flex;justify-content:center;margin-top:16px">
        <canvas id="bn_canvas" width="${canvasW}" height="${canvasH}" style="width:100%;max-width:340px;height:auto;border-radius:14px;box-shadow:0 8px 24px -10px rgba(0,0,0,.4);display:block"></canvas>
      </div>

    `;
  }
  let bannerLogoImg = null; // logo enviada pro banner -- só em memória, não persiste
  function bnDraw(){
    const canvas = $("#bn_canvas"); if(!canvas) return;
    const ctx = canvas.getContext("2d");
    const data = {
      nome: ($("#bn_nome")?.value||"").trim(),
      cargo: ($("#bn_cargo")?.value||"").trim(),
      data1: $("#bn_data1")?.value || "",
      data2: $("#bn_data2")?.value || "",
      anos: $("#bn_anos")?.value || "",
    };
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(state.bannerType==="aniversario") drawAniversarioBanner(ctx, canvas.width, canvas.height, data, bannerLogoImg);
    else if(state.bannerType==="ano_empresa") drawAnoEmpresaBanner(ctx, canvas.width, canvas.height, data, bannerLogoImg);
    else drawFeriasBanner(ctx, canvas.width, canvas.height, data, bannerLogoImg);
  }
  function bnSlug(s){
    return (s||"banner").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "banner";
  }
  function wireBanners(){
    $$("[data-bannertype]").forEach(el => el.addEventListener("click", () => { state.bannerType = el.dataset.bannertype; render(); }));
    $$("[data-bnauto]").forEach(el => el.addEventListener("click", () => {
      const m = bnAutoMatches[Number(el.dataset.bnauto)];
      if(!m) return;
      state.bannerType = m.kind;
      state.bannerNome = m.employee.name;
      state.bannerCargo = m.employee.cargo || "";
      if(m.kind==="aniversario") state.bannerData1 = todayISO();
      else if(m.kind==="ano_empresa") state.bannerAnos = String(m.years);
      else { state.bannerData1 = m.request.dateStart; state.bannerData2 = m.request.dateEnd; }
      render();
      setTimeout(() => { $("#bn_download")?.click(); }, 250);
    }));
    const nome = $("#bn_nome"); if(nome) nome.addEventListener("input", () => { state.bannerNome = nome.value; bnDraw(); });
    const cargo = $("#bn_cargo"); if(cargo) cargo.addEventListener("input", () => { state.bannerCargo = cargo.value; bnDraw(); });
    const data1 = $("#bn_data1"); if(data1) data1.addEventListener("change", () => { state.bannerData1 = data1.value; bnDraw(); });
    const data2 = $("#bn_data2"); if(data2) data2.addEventListener("change", () => { state.bannerData2 = data2.value; bnDraw(); });
    const anos = $("#bn_anos"); if(anos) anos.addEventListener("input", () => { state.bannerAnos = anos.value; bnDraw(); });
    const logo = $("#bn_logo");
    if(logo) logo.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => { bannerLogoImg = img; bnDraw(); render(); };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
    const logoClear = $("#bn_logo_clear");
    if(logoClear) logoClear.addEventListener("click", () => { bannerLogoImg = null; render(); });
    const downloadBtn = $("#bn_download");
    if(downloadBtn) downloadBtn.addEventListener("click", () => {
      const canvas = $("#bn_canvas"); if(!canvas) return;
      canvas.toBlob((blob) => {
        if(!blob){ $("#bn_status").textContent = "Não consegui gerar a imagem."; return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `banner-${state.bannerType}-${bnSlug($("#bn_nome").value)}.png`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        $("#bn_status").textContent = "Banner baixado!";
      }, "image/png");
    });
    bnDraw();
    if(document.fonts && document.fonts.ready){
      Promise.all([
        document.fonts.load('700 90px "Fraunces"'),
        document.fonts.load('italic 600 52px "Fraunces"'),
        document.fonts.load('800 34px "Manrope"'),
      ]).then(bnDraw).catch(()=>{});
      document.fonts.ready.then(bnDraw);
    }
  }

  const PR_DB_NAME = "fertgrow_relatorios_fotograficos";
  const PR_DB_VERSION = 1;
  const PR_STORE = "drafts";
  function prOpenDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(PR_DB_NAME, PR_DB_VERSION);
      req.onupgradeneeded = () => {
        const idb = req.result;
        if(!idb.objectStoreNames.contains(PR_STORE)) idb.createObjectStore(PR_STORE, { keyPath: "id" });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function prSaveDraft(draft){
    const idb = await prOpenDB();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(PR_STORE, "readwrite");
      tx.objectStore(PR_STORE).put(draft);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function prLoadDrafts(){
    const idb = await prOpenDB();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(PR_STORE, "readonly");
      const req = tx.objectStore(PR_STORE).getAll();
      req.onsuccess = () => resolve((req.result||[]).sort((a,b) => (b.updatedAt||"").localeCompare(a.updatedAt||"")));
      req.onerror = () => reject(req.error);
    });
  }
  async function prGetDraft(id){
    const idb = await prOpenDB();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(PR_STORE, "readonly");
      const req = tx.objectStore(PR_STORE).get(id);
      req.onsuccess = () => resolve(req.result||null);
      req.onerror = () => reject(req.error);
    });
  }
  async function prDeleteDraft(id){
    const idb = await prOpenDB();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(PR_STORE, "readwrite");
      tx.objectStore(PR_STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  function prNewDraft(){
    return { id: "pr-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7), title:"", subtitle:"", location:"", date: todayISO(), responsavel: (state.session && state.session.user && state.session.user.email) || "", updatedAt: new Date().toISOString(), photos: [] };
  }
  async function prLoadBitmap(file){
    if(window.createImageBitmap){
      try{ return await createImageBitmap(file, { imageOrientation: "from-image" }); }catch(e){}
    }
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = url;
    });
  }
  async function prCompressImageInner(file, maxDim, quality){
    const bitmap = await prLoadBitmap(file);
    let width = bitmap.width, height = bitmap.height;
    if(width > maxDim || height > maxDim){
      const scale = maxDim / Math.max(width, height);
      width = Math.max(1, Math.round(width*scale));
      height = Math.max(1, Math.round(height*scale));
    }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, width, height);
    if(bitmap.close) bitmap.close();
    return new Promise(resolve => canvas.toBlob(blob => resolve({ blob, width, height }), "image/jpeg", quality));
  }

      const url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); resolve({ width: img.naturalWidth||1600, height: img.naturalHeight||1200 }); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }
  // Em alguns celulares (foto de câmera muito grande, navegador mais antigo), createImageBitmap/canvas
  // trava sem nunca dar erro nem terminar -- sem um limite de tempo, "Adicionar fotos" ficava preso em
  // "Processando..." pra sempre (bug real reportado no app do colaborador). Se travar, usa a foto
  // ORIGINAL sem reduzir (mais pesada no PDF, mas pelo menos entra) em vez de travar o app.
  async function prCompressImage(file, maxDim=1600, quality=0.82){
    try{
      return await Promise.race([
        prCompressImageInner(file, maxDim, quality),
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 20000)),
      ]);
    }catch(err){
      console.error("Compressão da foto travou/falhou, usando original sem reduzir:", err);
      try{
        const dims = await prReadImageDims(file);
        return { blob: file, width: dims.width, height: dims.height };
      }catch(err2){
        return { blob: file, width: 1600, height: 1200 };
      }
    }
  }
  function prBlobToDataURL(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }
  function prSlug(s){
    return (s||"relatorio").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "relatorio";
  }

  function prRemovePhoto(id){
    const idx = prCurrent.photos.findIndex(p=>p.id===id);

  function prMovePhoto(id, dir){
    const idx = prCurrent.photos.findIndex(p=>p.id===id);
    const swapIdx = idx+dir;
    if(idx<0 || swapIdx<0 || swapIdx>=prCurrent.photos.length) return;
    const [item] = prCurrent.photos.splice(idx,1);
    prCurrent.photos.splice(swapIdx,0,item);
    prScheduleAutosave();

  async function prGeneratePdf(draft){
    const doc = new jspdf.jsPDF({ unit:"mm", format:"a4" });
    const PAGE_W = 210, PAGE_H = 297, MARGIN = 14;
    const BRAND = [11,107,51];
    function prDrawFooter(){
      doc.setFont(undefined,"normal"); doc.setFontSize(7.5); doc.setTextColor(170,170,170);
      doc.text("Gerado por Manutenção Fabril", PAGE_W/2, PAGE_H-8, { align:"center" });
    }
    const logoW = 34, logoH = logoW;
    doc.addImage(PR_LOGO_BASE64, "PNG", MARGIN, MARGIN, logoW, logoH);
    doc.setFont(undefined,"bold"); doc.setFontSize(20); doc.setTextColor(...BRAND);
    doc.text(draft.title || "Relatório Fotográfico", MARGIN, MARGIN + logoH + 14);
    doc.setFont(undefined,"normal"); doc.setFontSize(12); doc.setTextColor(90,90,90);
    let y = MARGIN + logoH + 22;
    if(draft.subtitle){ doc.text(draft.subtitle, MARGIN, y); y += 8; }
    doc.setFontSize(10); doc.setTextColor(60,60,60);
    if(draft.location){ doc.text(`Local/Ativo: ${draft.location}`, MARGIN, y); y += 6; }
    if(draft.responsavel){ doc.text(`Responsável: ${draft.responsavel}`, MARGIN, y); y += 6; }
    doc.text(`Data: ${brDate(draft.date)}`, MARGIN, y); y += 6;
    doc.text(`Total de fotos: ${draft.photos.length}`, MARGIN, y); y += 6;
    doc.setDrawColor(...BRAND); doc.setLineWidth(0.6);
    doc.line(MARGIN, y+4, PAGE_W-MARGIN, y+4);
    prDrawFooter();

    const cols = 2, rows = 2, perPage = cols*rows;
    const headerH = 12, gutter = 6, captionH = 22;
    const gridTop = MARGIN + headerH;
    const cellW = (PAGE_W - MARGIN*2 - gutter*(cols-1)) / cols;
    const cellH = (PAGE_H - gridTop - MARGIN - gutter*(rows-1)) / rows;
    const imgH = cellH - captionH;

    for(let i=0;i<draft.photos.length;i++){
      const p = draft.photos[i];
      const posInPage = i % perPage;
      if(posInPage===0){
        doc.addPage();
        doc.setFont(undefined,"bold"); doc.setFontSize(9); doc.setTextColor(...BRAND);
        doc.text(draft.title || "Relatório Fotográfico", MARGIN, MARGIN);
        doc.setFont(undefined,"normal"); doc.setFontSize(9); doc.setTextColor(150,150,150);
        doc.text(`Página ${doc.internal.getNumberOfPages()-1}`, PAGE_W-MARGIN, MARGIN, { align:"right" });
        doc.setDrawColor(...BRAND); doc.setLineWidth(0.3);
        doc.line(MARGIN, MARGIN+2, PAGE_W-MARGIN, MARGIN+2);
        prDrawFooter();
      }
      const col = posInPage % cols, row = Math.floor(posInPage/cols);
      const x = MARGIN + col*(cellW+gutter);
      const cy = gridTop + row*(cellH+gutter);
      const dataUrl = await prBlobToDataURL(p.blob);
      const ratio = Math.min(cellW/p.width, imgH/p.height);
      const drawW = p.width*ratio, drawH = p.height*ratio;
      const dx = x + (cellW-drawW)/2, dy = cy + (imgH-drawH)/2;
      doc.addImage(dataUrl, "JPEG", dx, dy, drawW, drawH);
      // Legenda vira uma faixa presa embaixo da foto (fundo + linha + moldura única) -- antes era só
      // texto pequeno solto abaixo da borda, sem parecer parte da mesma "peça" da foto.
      doc.setFillColor(247,246,242);
      doc.rect(x, cy+imgH, cellW, captionH, "F");
      doc.setDrawColor(210,210,205); doc.setLineWidth(0.25);
      doc.line(x, cy+imgH, x+cellW, cy+imgH);
      doc.roundedRect(x, cy, cellW, cellH, 1.5, 1.5, "S");
      doc.setFont(undefined,"bold"); doc.setFontSize(9.5); doc.setTextColor(...BRAND);
      doc.text(String(i+1), x+4, cy+imgH+8);
      doc.setFont(undefined,"normal"); doc.setFontSize(9.5); doc.setTextColor(55,55,55);
      const capLines = doc.splitTextToSize(p.description ? p.description : "Sem descrição", cellW-13);
      doc.text(capLines.slice(0,3), x+10, cy+imgH+8);
    }
    doc.save(`relatorio-fotografico-${prSlug(draft.title)}-${draft.date||todayISO()}.pdf`);
  }

  function pcmPainelCardHTML(o){
    const done = o.status==="realizada";
    return `
      <div class="req-row" style="cursor:default;${done?'opacity:.7':''}">
