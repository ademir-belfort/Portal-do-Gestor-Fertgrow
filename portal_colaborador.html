<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MANUTENÇÃO — Portal do Colaborador</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0B6B33" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="MANUTENÇÃO" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Manrope: só usada pelo banner diário (aniversário/ano de empresa/férias), desenhado num <canvas>. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#070f0a; --surface:#111f17; --surface2:#17281e; --border:rgba(178,214,180,.12);
    --text:#f2f8f3; --muted:#8fa892; --brand:#0B6B33; --brand2:#149449; --brand-light:#AFD676;
    --emerald:#34d399; --amber:#fbbf24; --rose:#fb7185; --cyan:#22d3ee; --violet:#a78bfa;
    --grad-brand: linear-gradient(135deg, var(--brand2), var(--brand));
    --r-sm:12px; --r-md:18px; --r-lg:24px; --r-pill:999px;
    --shadow-card: 0 1px 2px rgba(0,0,0,.2), 0 10px 24px -12px rgba(0,0,0,.5);
    --shadow-glow: 0 6px 20px -6px rgba(20,148,73,.55);
    --ease-fluid: cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;color:var(--text);font-family:-apple-system,'Segoe UI',Inter,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;
    background:
      radial-gradient(900px 480px at 15% -8%, rgba(20,148,73,.16), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(175,214,118,.08), transparent 55%),
      var(--bg);
    background-attachment:fixed;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:92px;}
  header.top{padding:18px 20px;position:sticky;top:0;background:rgba(9,17,12,.82);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);z-index:20;box-shadow:0 1px 0 var(--border), 0 12px 24px -18px rgba(0,0,0,.6);}
  header.top .brand{font-weight:800;font-size:17px;letter-spacing:-.01em;}
  header.top .who{font-size:12.5px;color:var(--muted);margin-top:3px;}
  main{flex:1;padding:18px;}
  .card{background:linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%), var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-card);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:var(--r-sm);font-size:15px;transition:border-color .15s var(--ease-fluid), box-shadow .15s var(--ease-fluid);}
  .input:focus{outline:none;border-color:var(--brand-light);box-shadow:0 0 0 4px rgba(175,214,118,.14);}
  .btn{width:100%;background:var(--grad-brand);color:#fff;border:none;padding:13px 18px;border-radius:var(--r-pill);font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-glow);letter-spacing:.01em;}
  .btn:active{filter:brightness(1.12);}
  .btn.ghost{background:var(--surface2);border:1px solid var(--border);color:var(--text);box-shadow:none;font-weight:600;}
  .btn.small{padding:9px 14px;font-size:13px;width:auto;border-radius:var(--r-pill);}
  .msg{font-size:13px;padding:11px 14px;border-radius:var(--r-sm);margin-bottom:14px;}
  .msg.err{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fca5b1;}
  .msg.ok{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#6ee7b7;}
  .tabs2{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:var(--r-pill);margin-bottom:16px;border:1px solid var(--border);}
  .tabs2 .t{flex:1;text-align:center;padding:9px;border-radius:var(--r-pill);font-size:13px;color:var(--muted);cursor:pointer;font-weight:600;}
  .tabs2 .t.active{background:var(--grad-brand);color:#fff;font-weight:700;box-shadow:var(--shadow-glow);}
  nav.bottom{
    position:fixed;bottom:14px;left:14px;right:14px;background:rgba(15,28,19,.86);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
    display:flex;max-width:452px;margin:0 auto;z-index:30;border-radius:var(--r-lg);border:1px solid var(--border);
    box-shadow:0 16px 40px -12px rgba(0,0,0,.55);padding:6px;
  }
  nav.bottom .n{flex:1;text-align:center;padding:7px 1px;color:var(--muted);cursor:pointer;font-size:8.8px;line-height:1.15;letter-spacing:-.01em;position:relative;border-radius:var(--r-md);}
  nav.bottom .n .ic{display:flex;align-items:center;justify-content:center;height:19px;margin-bottom:2px;position:relative;z-index:1;overflow:visible;}
  nav.bottom .n .ic svg{width:17px;height:17px;flex-shrink:0;}
  nav.bottom .n>*{position:relative;z-index:1;}
  nav.bottom .n.active{color:#fff;font-weight:700;}
  nav.bottom .n.active::before{content:"";position:absolute;inset:0;background:var(--grad-brand);border-radius:var(--r-md);box-shadow:var(--shadow-glow);}
  h2.section{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 12px;font-weight:800;}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .cal-head b{font-size:14.5px;text-transform:capitalize;font-weight:700;}
  .iconbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--r-sm);width:34px;height:34px;font-size:16px;cursor:pointer;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-grid .dow{text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding-bottom:2px;}
  .cal-grid .day{border-radius:var(--r-sm);padding:7px 2px;text-align:center;font-size:12px;min-height:38px;}
  .legend2{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:10.5px;color:var(--muted);}
  .legend2 span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .att-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(33,51,40,.6);}
  .att-row:last-child{border-bottom:none;}
  .att-row .d{font-size:13px;font-weight:600;}
  .att-row .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .badge{padding:4px 11px;border-radius:var(--r-pill);font-size:11px;font-weight:700;white-space:nowrap;}
  .badge.presente{background:rgba(11,107,51,.15);color:var(--brand-light);border:1px solid rgba(11,107,51,.35);}
  .badge.falta{background:rgba(251,113,133,.15);color:var(--rose);border:1px solid rgba(251,113,133,.35);}
  .badge.folga{background:#1c2b21;color:var(--muted);}
  .badge.ferias{background:rgba(34,211,238,.15);color:var(--cyan);border:1px solid rgba(34,211,238,.35);}
  .badge.pendente{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.35);}
  .badge.aprovado{background:rgba(52,211,153,.15);color:var(--emerald);border:1px solid rgba(52,211,153,.35);}
  .badge.rejeitado{background:rgba(251,113,133,.15);color:var(--rose);border:1px solid rgba(251,113,133,.35);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(3,8,5,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);}
  .modal h3{margin:0;font-size:17px;font-weight:800;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .req-row{padding:10px 0;border-bottom:1px solid rgba(33,51,40,.6);}
  .req-row:last-child{border-bottom:none;}
  .req-row .d{font-size:13px;font-weight:600;}
  .req-row .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .eq-area-title{font-size:13px;font-weight:800;color:var(--brand-light);margin:18px 0 8px;padding-left:10px;border-left:3px solid var(--brand-light);}
  .eq-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:13px;margin-bottom:8px;box-shadow:var(--shadow-card);}
  .eq-card.selected{border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(175,214,118,.16), var(--shadow-card);}
  .eq-top{display:flex;align-items:center;gap:10px;}
  .eq-top input[type=checkbox]{width:20px;height:20px;flex-shrink:0;accent-color:var(--brand-light);}
  .eq-name{font-weight:600;font-size:13.5px;flex:1;}
  .eq-status-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .eq-status-btn{flex:1;min-width:42px;padding:8px 4px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);font-size:16px;cursor:pointer;text-align:center;color:var(--text);}
  .eq-status-btn.active{border-color:transparent;background:var(--grad-brand);box-shadow:var(--shadow-glow);}
  .wb-likert-row{display:flex;gap:6px;margin-top:8px;}
  .wb-likert-btn{flex:1;padding:10px 4px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);font-size:15px;font-weight:700;cursor:pointer;text-align:center;color:var(--text);}
  .wb-likert-btn.active{border-color:transparent;background:var(--grad-brand);color:#fff;box-shadow:var(--shadow-glow);}
  .wb-score-ring{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:0 auto;border:5px solid var(--border);box-shadow:0 0 0 6px rgba(255,255,255,.02);}
  .eq-details{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .eq-details textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:var(--r-sm);font-size:13px;min-height:52px;resize:vertical;font-family:inherit;}
  .mass-bar{position:sticky;top:64px;z-index:15;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;margin-bottom:12px;box-shadow:var(--shadow-card);}
  .mass-bar .row1{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:8px;}
  .mass-bar .row1 input{width:20px;height:20px;accent-color:var(--brand);}
  .report-output{background:#050a07;color:#d7e6da;padding:12px;border-radius:10px;white-space:pre-wrap;font-family:Consolas,monospace;font-size:11.5px;line-height:1.5;max-height:420px;overflow-y:auto;}
  .colega-suggestions{margin-top:6px;border:1px solid var(--border);border-radius:9px;overflow:hidden;max-height:200px;overflow-y:auto;}
  .colega-suggestion{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid rgba(33,51,40,.6);}
  .colega-suggestion:last-child{border-bottom:none;}
  .colega-suggestion:active{background:var(--surface2);}
  .colega-suggestion .sub{color:var(--muted);font-size:11.5px;margin-left:6px;}
  .colega-suggestion.muted{color:var(--muted);cursor:default;}
  .colega-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--surface2);border-radius:8px;}
  .colega-item .name{font-size:13px;}
  .colega-item .name .sub{color:var(--muted);font-size:11.5px;margin-left:6px;}
  .hist-row{padding:10px 0;border-bottom:1px solid rgba(33,51,40,.6);font-size:12.5px;}
  .hist-row:last-child{border-bottom:none;}
  .hist-row .d{font-weight:600;font-size:13px;}
  .hist-row .sub{color:var(--muted);margin-top:2px;}
  .nav-badge{position:absolute;top:-4px;right:-6px;background:var(--rose);color:#fff;border-radius:999px;min-width:15px;height:15px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;z-index:2;}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:13px;}
  a.link{color:var(--brand-light);cursor:pointer;text-decoration:underline;font-size:13px;}

  /* ---------------- interface moderna: transições/animações ---------------- */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }
  @keyframes fadeInUp{from{opacity:0;transform:translateY(14px) scale(.99);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalPop{from{opacity:0;transform:translateY(14px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulseBadge{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  /* main é recriado inteiro a cada render() (innerHTML trocado) -- a animação toca de novo sozinha em
     toda troca de aba/tela, dando a sensação de transição mesmo sem manter DOM antigo/novo ao mesmo tempo.
     Em navegadores com View Transitions API (ver startViewTransition em render()), isso some por baixo
     de um cross-fade nativo mais suave entre o estado antigo e o novo -- essa animação aqui vira só o
     fallback pra quem não suporta. */
  main{animation:fadeInUp .32s var(--ease-fluid) both;}
  .card{transition:border-color .2s var(--ease-fluid), transform .15s var(--ease-fluid), box-shadow .2s var(--ease-fluid);}
  .btn{transition:filter .15s var(--ease-fluid), transform .12s var(--ease-fluid), opacity .15s var(--ease-fluid), box-shadow .2s var(--ease-fluid);}
  .btn:active{transform:scale(.97);}
  .btn.ghost:active{background:var(--surface);}
  .eq-status-btn,.wb-likert-btn,.iconbtn,.tabs2 .t,nav.bottom .n{transition:background-color .2s var(--ease-fluid), border-color .2s var(--ease-fluid), color .2s var(--ease-fluid), transform .15s var(--ease-fluid), box-shadow .2s var(--ease-fluid);}
  .eq-status-btn:active,.wb-likert-btn:active{transform:scale(.94);}
  nav.bottom .n{-webkit-tap-highlight-color:transparent;}
  nav.bottom .n:active .ic{transform:scale(.88);}
  nav.bottom .n .ic{display:inline-block;transition:transform .15s var(--ease-fluid);}
  .nav-badge{animation:pulseBadge 1.8s ease-in-out infinite;}
  .modal-backdrop{animation:fadeIn .18s var(--ease-fluid) both;}
  .modal{animation:modalPop .28s var(--ease-fluid) both;}
  .badge{transition:background-color .2s var(--ease-fluid), color .2s var(--ease-fluid);}
  .input{transition:border-color .15s var(--ease-fluid);}
  /* Spinner de carregamento: anel girando em vez de só texto parado */
  .spinner{text-align:center;padding:52px 16px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:14px;animation:fadeIn .2s ease both;}
  .spinner::before{content:"";width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--brand-light);animation:spin .7s linear infinite;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  // ===================================================================
  // CONFIGURAÇÃO — cole aqui a URL e a chave "anon public" do seu
  // projeto Supabase (Project Settings > API). Sem isso o portal não
  // consegue se conectar ao banco compartilhado.
  // ===================================================================
  const SUPABASE_URL = "https://eusvotyusfwxolczqzlc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_2Uee6RYvUtvR5m4Vy6yyDQ_fgEeGEsX";

  const configured = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  const supabase = configured && window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // Mesma proteção do painel desktop/app do gestor: mantém o token de sessão sempre renovado, em vez de
  // confiar só no timer interno do supabase-js (que pode atrasar com o app muito tempo em segundo plano
  // no celular). Já causou "permission denied" numa sessão longa do painel -- token mesmo vencido, não
  // era bug de RLS/GRANT. Renova sempre que o app volta a ficar visível, e periodicamente.
  // Trava pra nunca ter duas renovações em voo ao mesmo tempo -- o token de refresh só pode ser usado
  // UMA vez (o Supabase invalida a sessão inteira se detectar reuso), então visibilitychange + o
  // intervalo periódico + uma chamada explícita antes de uma ação podiam disparar refreshSession() quase
  // ao mesmo tempo, um "vencer a corrida" do outro e invalidar a sessão de propósito. Com a trava, quem
  // chamar ensureFreshSession() enquanto já tem uma renovação em andamento espera essa MESMA renovação.
  let freshSessionRefreshPromise = null;
  async function ensureFreshSession(){
    if(!configured || !supabase) return;
    try{
      const { data, error } = await supabase.auth.getSession();
      if(error || !data || !data.session) return;
      const expiresAt = data.session.expires_at;
      const now = Math.floor(Date.now()/1000);
      if(expiresAt && (expiresAt - now) < 300){
        if(!freshSessionRefreshPromise){
          freshSessionRefreshPromise = supabase.auth.refreshSession().finally(() => { freshSessionRefreshPromise = null; });
        }
        await freshSessionRefreshPromise;
      }
    }catch(err){ /* melhor esforço -- se falhar aqui, a próxima gravação real ainda reporta o erro visivelmente */ }
  }
  if(configured && supabase){
    document.addEventListener("visibilitychange", () => {
      if(document.visibilityState === "visible") ensureFreshSession();
    });
    setInterval(ensureFreshSession, 4*60*1000);
  }

  // Mesmo helper de paginação do painel/app do gestor: um "select('*')" sem paginar volta truncado no
  // limite do projeto (1000 linhas por padrão) sem erro nenhum visível -- aqui o risco é bem menor (só
  // o attendance do PRÓPRIO colaborador, precisaria de anos de histórico diário pra passar de 1000),
  // mas mantém a mesma defesa por consistência.
  async function fetchAllRows(table, orderCol, filterFn){
    const PAGE = 1000;
    let allRows = [];
    let from = 0;
    while(true){
      let q = supabase.from(table).select("*").order(orderCol);
      if(filterFn) q = filterFn(q);
      const { data, error } = await q.range(from, from+PAGE-1);
      if(error) return { data: null, error };
      if(!data || !data.length) break;
      allRows = allRows.concat(data);
      from += data.length;
    }
    return { data: allRows, error: null };
  }

  // ---------------- helpers (mesma lógica do painel do gestor) ----------------
  const $ = (sel, root=document) => root.querySelector(sel);
  const esc = (s) => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // Ícones de linha fina (SVG inline, sem depender de fonte de emoji nem de CDN externo -- o service
  // worker só faz cache do próprio HTML) -- substituem os emojis coloridos da barra de navegação por
  // pedido do usuário ("os ícones coloridos não estão legais, faz algo mais prêmio"). stroke=
  // "currentColor" pra herdar a cor do estado ativo/inativo do CSS de .n/.n.active, sem precisar de
  // classe extra por ícone.
  const NAV_ICONS = {
    calendar: `<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/>`,
    clock: `<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>`,
    sun: `<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>`,
    clipboardCheck: `<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><polyline points="9 13 11 15 15 11"/>`,

  // new Date().toISOString() converte pra UTC — perto da meia-noite local (Brasil, UTC-3) isso pode
  // devolver o dia de AMANHÃ. Monta a data a partir dos componentes locais em vez disso.
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c==="x" ? r : (r&0x3|0x8);
    return v.toString(16);
  });
  function toISO(d){ return d.toISOString().slice(0,10); }
  function brDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
  function addDays(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return toISO(d); }
  function addMonths(monthStr, delta){
    const [y,m] = monthStr.split("-").map(Number);
    const d = new Date(y, (m-1)+delta, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }
  function round2(n){ return Math.round((Number(n)||0)*100)/100; }

  // Logo da empresa do colega mencionado no aviso (aniversário/desligamento) -- related_id é o id do
  // funcionário em questão, que pode ser o PRÓPRIO colaborador logado (não sai em allEmployeesPublic,
  // que exclui a si mesmo de propósito) ou outra pessoa (só sai em allEmployeesPublic).
  function notificationLogoHTML(n){
    if((n.type!=="aniversario" && n.type!=="desligamento") || !n.related_id) return "";
    const emp = n.related_id===state.employee.id ? state.employee : state.allEmployeesPublic.find(e=>e.id===n.related_id);
    if(!emp) return "";
    const companyId = emp.company_id || emp.companyId;
    const company = companyId ? state.companies.find(c=>c.id===companyId) : null;
    return `<img src="${companyLogoFor(company?company.name:null)}" alt="" style="width:20px;height:20px;object-fit:contain;border-radius:4px;background:#fff;padding:1px;vertical-align:middle;margin-right:5px" />`;
  }

  // Sem logo cadastrada (nome não bate exatamente com a chave acima, ou sem empresa) -- antes caía num
  // fallback "Fertgrow" que na verdade estava quebrado (literalmente a string
  // "data:image/png;base64,undefined", virava ícone de imagem quebrada na tela). Gera um avatar simples
  // com a inicial da empresa em vez de arriscar mostrar uma imagem quebrada.
  function companyInitialAvatar(companyName){
    const initial = String(companyName||"?").trim().charAt(0).toUpperCase() || "?";
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72"><rect width="72" height="72" rx="12" fill="#0b6b33"/><text x="36" y="47" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">${initial}</text></svg>`;
    return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
  }
  // Compara ignorando acento/maiúscula/espaço nas pontas -- uma logo cadastrada pra "Bentec" não devia
  // deixar de aparecer só porque o nome da empresa no cadastro tem uma letra maiúscula/espaço diferente.
  function companyLogoFor(companyName){
    const norm = s => String(s||"").trim().toLowerCase();
    const key = Object.keys(COMPANY_LOGOS).find(k => norm(k)===norm(companyName));
    return key ? COMPANY_LOGOS[key] : companyInitialAvatar(companyName);
  }

    const cycleLen = Math.max(1, Number(shift.cycle_work||0) + Number(shift.cycle_rest||0));

      if(!current || !novaSenha || !confirmSenha){ showErr("Preencha todos os campos."); return; }
      if(novaSenha.length < 6){ showErr("A nova senha precisa ter pelo menos 6 caracteres."); return; }
      if(novaSenha !== confirmSenha){ showErr("A confirmação não bate com a nova senha."); return; }
      const btn = $("#cp_submit"); btn.disabled = true; btn.textContent = "Salvando…";
      try{
        // Reautentica com a senha atual antes de trocar — evita que alguém troque a senha de outra
        // pessoa só porque achou uma sessão aberta no celular de um colega.
        const { error: reauthErr } = await supabase.auth.signInWithPassword({ email: state.session.user.email, password: current });
        if(reauthErr){ showErr("Senha atual incorreta."); btn.disabled=false; btn.textContent="Salvar nova senha"; return; }
        const { error: updateErr } = await supabase.auth.updateUser({ password: novaSenha });
        if(updateErr){ showErr("Não consegui trocar a senha: "+updateErr.message); btn.disabled=false; btn.textContent="Salvar nova senha"; return; }
        close();
        alert("Senha alterada com sucesso!");
      }catch(err){ showErr("Falha de conexão: "+err.message); btn.disabled=false; btn.textContent="Salvar nova senha"; }
    });
  }

  function buildChecklistDraft(){
    const raw = state.checklistToday && Array.isArray(state.checklistToday.items) ? state.checklistToday.items : [];
    const validShape = !raw.length || raw[0].equipment_id !== undefined;
    const byEquipId = new Map(validShape ? raw.map(it=>[it.equipment_id, it]) : []);

      return { equipment_id: eq.id, area_id: eq.area_id, status: saved?.status||"", obs: saved?.obs||"", pendencia: saved?.pendencia||"", acao: saved?.acao||"" };

  // ---------------- fila de sincronização offline ----------------
  // Guarda operações que falharam (queda de sinal, chão de fábrica costuma ter zona morta) pra
  // reenviar sozinho quando a conexão voltar, em vez de perder o que o colaborador digitou. Cada item
  // é seguro de reenviar mais de uma vez (checklist já é upsert por chave natural; pedido usa um id
  // gerado no cliente e só insere se ainda não existir — nunca faz UPDATE, que a policy de RLS de
  // time_off_requests não libera pro colaborador de propósito, só INSERT/SELECT da própria linha).
  function pendingSyncKey(){ return "pendingSync_" + (state.employee?.id || "anon"); }
  function loadPendingSyncQueue(){
    try{ return JSON.parse(localStorage.getItem(pendingSyncKey()) || "[]"); }catch(e){ return []; }
  }
  function savePendingSyncQueue(queue){
    try{ localStorage.setItem(pendingSyncKey(), JSON.stringify(queue)); }catch(e){}
  }
  function enqueuePendingSync(kind, payload){
    const queue = loadPendingSyncQueue();
    queue.push({ id: uid(), kind, payload, createdAt: new Date().toISOString() });
    savePendingSyncQueue(queue);
    cachedPendingSyncCount = queue.length;
    refreshPendingSyncBadge();
  }
  // pendingSyncCount() é lido no template a cada render() (troca de aba, clique, o poll de 30s...) —
  // cachear em memória evita reabrir e reanalisar o localStorage inteiro toda vez só pra saber um
  // tamanho, já que loadPendingSyncQueue/savePendingSyncQueue já mantêm isso atualizado nas duas únicas
  // funções que de fato mudam a fila (enqueuePendingSync e flushPendingQueue).
  let cachedPendingSyncCount = null;
  function pendingSyncCount(){
    if(cachedPendingSyncCount===null) cachedPendingSyncCount = loadPendingSyncQueue().length;
    return cachedPendingSyncCount;
  }
  function refreshPendingSyncBadge(){
    const el = document.getElementById("pendingSyncBadge");
    const n = pendingSyncCount();
    if(el) { if(n) el.textContent = `🔄 ${n}`; else el.remove(); }
    // se o badge ainda não existe na tela (contador vinha de 0) ele aparece no próximo render()
    // natural — não força um render aqui pra não atrapalhar quem estiver digitando no checklist.
  }
  async function syncOneItem(item){
    if(item.kind==="checklist"){
      const { error } = await supabase.from("daily_checklists").upsert(item.payload, {onConflict:"employee_id,date,category_id"});
      return !error;
    }
    if(item.kind==="timeoff"){
      // reenviar não pode virar UPDATE (RLS não libera isso pro colaborador) — confere se já foi
      // enviado numa tentativa anterior que só não confirmou a tempo, antes de inserir de novo.
      const { data: existing, error: selErr } = await supabase.from("time_off_requests").select("id").eq("id", item.payload.id).maybeSingle();
      if(selErr) return false;
      if(existing) return true;
      const { error } = await supabase.from("time_off_requests").insert(item.payload);
      return !error;
    }
    return true;
  }
  let flushingPendingSync = false;
  async function flushPendingQueue(){
    if(flushingPendingSync || !supabase) return;
    flushingPendingSync = true;
    try{
      let queue = loadPendingSyncQueue();
      while(queue.length){
        let ok = false;
        try{ ok = await syncOneItem(queue[0]); }catch(e){ ok = false; }
        if(!ok) break; // mantém a ordem — para na primeira falha, tenta o resto na próxima rodada
        queue = queue.slice(1);
        savePendingSyncQueue(queue);
        cachedPendingSyncCount = queue.length;
      }
    } finally {
      flushingPendingSync = false;
      if(state.view==="app") render();
    }
  }

  async function saveChecklistDraft(){
    if(!state.checklistCategory) return;
    const category = state.checklistCategories.find(c=>c.id===state.checklistCategory);
    const items = state.checklistDraft.map(d => {
      const eq = state.checklistEquipment.find(e=>e.id===d.equipment_id);
      const area = eq ? state.checklistAreas.find(a=>a.id===eq.area_id) : null;
      return {
        equipment_id: d.equipment_id, area_id: d.area_id,
        equipment_name: eq?eq.name:"", area_name: area?area.name:"",
        category_id: state.checklistCategory, category_name: category?category.name:"",
        status: d.status, obs: d.obs, pendencia: d.pendencia, acao: d.acao,
        updatedAt: new Date().toISOString(),
      };
    });
    const row = { employee_id: state.employee.id, date: todayISO(), category_id: state.checklistCategory, items, colegas: state.checklistColegas };
    state.checklistToday = row; // aplica local na hora — o colaborador não fica esperando a rede pra ver o próprio preenchimento
    state.checklistTodayRows = [...state.checklistTodayRows.filter(r=>r.category_id!==state.checklistCategory), row];
    try{
      const { data, error } = await supabase.from("daily_checklists").upsert(row, {onConflict:"employee_id,date,category_id"}).select().maybeSingle();
      if(error) throw error;
      state.checklistToday = data || row;
      state.checklistTodayRows = [...state.checklistTodayRows.filter(r=>r.category_id!==state.checklistCategory), state.checklistToday];
    }catch(err){
      console.error("Falha ao salvar checklist, guardando pra reenviar depois", err);
      enqueuePendingSync("checklist", row);
    }
  }
  function buildChecklistReportText(){
    const category = state.checklistCategories.find(c=>c.id===state.checklistCategory);
    const lines = [];
    lines.push(`Checklist de turno — ${category?category.name+" — ":""}${brDate(todayISO())}`);
    lines.push(`Funcionário: ${state.employee.name}`);
    if(state.checklistColegas.length){
      const porCargo = {};
      state.checklistColegas.forEach(c => { (porCargo[c.cargo||"Outro"] = porCargo[c.cargo||"Outro"]||[]).push(c.name); });
      lines.push("");
      Object.keys(porCargo).forEach(cargo => lines.push(`${cargo}: ${porCargo[cargo].join(" / ")}`));
    }
    lines.push("");
    lines.push("LEGENDA:");
    lines.push("✅ Conforme   ❌ Fora de funcionamento   ⚠️ Com pendência   🚧 Bloqueado   🚨 Atenção");
    const areas = state.checklistAreas.filter(a=>a.category_id===state.checklistCategory).sort((a,b)=>a.order-b.order);
    const draftByEquip = new Map(state.checklistDraft.map(d=>[d.equipment_id,d]));
    const pendencias = [];
    areas.forEach(a => {
      const equip = state.checklistEquipment.filter(e=>e.area_id===a.id).sort((x,y)=>x.order-y.order);
      const withContent = equip.filter(eq => { const d=draftByEquip.get(eq.id); return d && (d.status||d.obs||d.pendencia||d.acao); });
      if(!withContent.length) return;
      lines.push(""); lines.push(a.name);
      withContent.forEach(eq => {
        const d = draftByEquip.get(eq.id);
        let line = `- ${eq.name}`;
        if(d.status) line += ` ${d.status}`;
        if(d.obs) line += ` ${d.obs}`;
        lines.push(line);
        if(d.pendencia){ lines.push(`  Pendência: ${d.pendencia}`); pendencias.push(`${a.name} - ${eq.name}: ${d.pendencia}`); }
        if(d.acao) lines.push(`  Ação realizada: ${d.acao}`);
      });
    });
    if(pendencias.length){
      lines.push(""); lines.push("PENDÊNCIAS:");
      pendencias.forEach((p,i)=>lines.push(`🚨 Pendência ${String(i+1).padStart(2,"0")}: ${p}`));
    }
    return lines.join("\n").trim();
  }
  function copyChecklistReport(){
    const texto = state.checklistReport;
    if(!texto) return;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(showCopyMsg).catch(() => copyFallback(texto));
    } else {
      copyFallback(texto);
    }
  }
  function copyFallback(texto){
    const area = document.createElement("textarea");
    area.value = texto;
    area.setAttribute("readonly", "");
    area.style.position = "fixed"; area.style.top = "0"; area.style.left = "0"; area.style.opacity = "0";
    document.body.appendChild(area);
    area.focus(); area.select();
    try{ document.execCommand("copy"); showCopyMsg(); }
    catch(e){ alert("Não consegui copiar automaticamente. Segure o dedo no texto do relatório e copie manualmente."); }
    document.body.removeChild(area);
  }

  // abrir o portal depois que o gestor respondeu (o painel também faz essa varredura no próprio boot).
  async function autoFinalizeStaleGeneralRequests(){
    const twoDaysAgo = new Date(Date.now() - 2*86400000).toISOString();
    const stale = state.myRequests.filter(r =>
      r.type==="solicitacao_geral" && r.status!=="pendente" && !r.finalizado_em && r.admin_responded_at && r.admin_responded_at < twoDaysAgo
    );
    if(!stale.length) return;
    const finalizadoEm = new Date().toISOString();
    await Promise.all(stale.map(async r => {
      const { error } = await supabase.from("time_off_requests").update({ finalizado_em: finalizadoEm }).eq("id", r.id);
      if(!error) r.finalizado_em = finalizadoEm;
    }));

  // ---------------- Bem-estar (quiz mensal de clima psicológico + satisfação) ----------------
  function currentPeriodStartISO(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
  }
  function nextPeriodStartISO(periodISO){
    const [y,m] = periodISO.split("-").map(Number);
    const nd = new Date(y, m, 1); // m já é 1-indexado (mês atual) -> new Date(y,m,1) cai no dia 1 do MÊS SEGUINTE
    return `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,"0")}-01`;
  }
  function periodLabel(periodISO){
    const [y,m] = periodISO.split("-").map(Number);
    const label = new Date(y,m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    return label.charAt(0).toUpperCase()+label.slice(1);
  }
  function wellbeingScoreColor(score){
    return score>=70 ? "var(--emerald)" : score>=50 ? "var(--brand-light)" : "var(--rose)";
  }
  // Gráfico simples feito à mão (não existe nenhuma lib de gráfico nesse arquivo) — só o próprio
  // colaborador vê essa evolução, não precisa de mais que uma linha com pontos.
  function wellbeingChartSVG(history){
    const points = [...history].reverse().slice(-12); // mais antigo -> mais recente, até 12 pontos
    if(points.length < 2) return "";
    const W = 280, H = 90, PAD = 10;
    const stepX = (W - PAD*2) / (points.length - 1);
    const yFor = (score) => H - PAD - (Math.max(0,Math.min(100,score))/100) * (H - PAD*2);
    const coords = points.map((p,i) => [PAD + i*stepX, yFor(Number(p.score)||0)]);
    const path = coords.map((c,i) => `${i===0?"M":"L"}${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(" ");
    const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="var(--brand-light)" />`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;margin-top:8px">
      <line x1="${PAD}" y1="${yFor(50).toFixed(1)}" x2="${W-PAD}" y2="${yFor(50).toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3" />
      <path d="${path}" fill="none" stroke="var(--brand-light)" stroke-width="2" />
      ${dots}
    </svg>`;
  }

  // ---------------- Gate semanal obrigatório de Bem-estar ----------------
  // Uma vez por semana, ao entrar, mostra a tela de Bem-estar ANTES do resto do app (sem bottom nav) —
  // pode adiar ("Lembrar amanhã") só dentro de 2 dias corridos desde que ficou pendente; depois disso
  // só sai confirmando ("Já vi, obrigado"). "Lembrar amanhã" é só client-side (sessionStorage) — não
  // mexe no ciclo real de 7 dias, guardado em profiles.wellbeing_prompt_due_at.
  function wellbeingGateSessionKey(){ return "wbGateDismissed_" + (state.employee ? state.employee.id : ""); }
  function wellbeingGateStatus(){
    const dueAtRaw = state.profile && state.profile.wellbeing_prompt_due_at;
    if(!dueAtRaw) return { due:false };
    const dueAt = new Date(dueAtRaw);
    const daysOverdue = (Date.now() - dueAt.getTime()) / 86400000;
    if(daysOverdue < 0) return { due:false };
    const forced = daysOverdue > 2;
    const dismissedThisSession = !forced && sessionStorage.getItem(wellbeingGateSessionKey()) === "1";
    return { due: !dismissedThisSession, forced };
  }
  function wellbeingGateHTML(forced){
    const consented = !!(state.profile && state.profile.wellbeing_consent_at);
    return `
      <header class="top"><div class="brand">MANUTENÇÃO</div><div class="who">💚 Check-in semanal de bem-estar</div></header>
      <main>

        ${bemEstarBodyHTML()}
        ${consented ? `
        <div style="display:flex;gap:10px;margin-top:16px">
          ${forced ? "" : `<button class="btn ghost" id="wbGateSnoozeBtn" type="button" style="flex:1">Lembrar amanhã</button>`}
          <button class="btn" id="wbGateAckBtn" type="button" style="flex:1">Já vi, obrigado</button>

  // Compartilhado entre a aba normal "Bem-estar" e o gate semanal — os dois renderizam o MESMO corpo
  // (bemEstarBodyHTML), então precisam ligar os mesmos botões (consentimento, respostas, enviar).
  function wireBemEstarBody(){
    const consentBtn = $("#wbConsentBtn");
    if(consentBtn) consentBtn.addEventListener("click", async () => {
      consentBtn.disabled = true;
      try{
        await supabase.rpc("record_wellbeing_consent");
        state.profile.wellbeing_consent_at = new Date().toISOString();
      }catch(err){ alert("Não consegui registrar seu aceite: "+err.message); }
      consentBtn.disabled = false;
      render();
    });
    document.querySelectorAll("[data-wbanswer]").forEach(el => el.addEventListener("click", () => {
      const [qid, val] = el.dataset.wbanswer.split(":");
      state.wellbeingDraft = state.wellbeingDraft || {};
      state.wellbeingDraft[qid] = Number(val);
      render();
    }));
    const submitBtn = $("#wbSubmitBtn");
    if(submitBtn) submitBtn.addEventListener("click", async () => {
      const draft = state.wellbeingDraft || {};
      if(!WELLBEING_QUESTIONS.every(q => draft[q.id])) return;
      submitBtn.disabled = true; submitBtn.textContent = "Enviando…";
      const periodStart = currentPeriodStartISO();
      const { data, error } = await supabase.from("wellbeing_responses")
        .insert({ employee_id: state.employee.id, period_start: periodStart, answers: draft })
        .select("period_start, score, created_at").maybeSingle();
      if(error){
        alert("Não consegui enviar suas respostas: "+error.message);
        submitBtn.disabled = false; submitBtn.textContent = "Enviar";
        return;
      }
      state.wellbeing.history = [data, ...(state.wellbeing.history||[])];
      state.wellbeingDraft = {};
      render();
    });
  }

    // não tiver sido atualizado no Supabase isso não pode derrubar o carregamento do resto do app.

  // Versão enxuta de loadEmployeeData, só com o que pode mudar de fora (ação do gestor) enquanto o
  // colaborador está com o app aberto — usada pelo poll de 30s. shifts/holidays/checklist_categories/
  // checklist_areas/checklist_equipment/allEmployeesPublic/companies praticamente nunca mudam no meio
  // de um turno, então refetchar tudo de novo a cada 30s só gastaria dado móvel/bateria à toa.
  async function loadLiveUpdates(){
    const [{data: myRequests}, {data: notifications}, {data: dssToday}, {data: attendance}, {data: shiftHistory}] = await Promise.all([
      supabase.from("time_off_requests").select("*").eq("employee_id", state.employee.id).order("created_at",{ascending:false}),
      supabase.from("notifications").select("*").eq("employee_id", state.employee.id).order("created_at",{ascending:false}),
      supabase.from("dss_topics").select("*").eq("date", todayISO()).maybeSingle(),
      fetchAllRows("attendance", "id", q => q.eq("employee_id", state.employee.id)),
      supabase.from("employee_shift_history").select("*").eq("employee_id", state.employee.id).order("effective_from"),
    ]);
    state.myRequests = myRequests || [];
    state.notifications = notifications || [];
    state.dssToday = dssToday || null;
    state.attendance = attendance || [];
    // Se o gestor trocou o turno do colaborador com o app aberto, isso é o que faz a escala/calendário
    // refletir a troca sem precisar relogar — state.shift (turno "de hoje", usado só de rótulo no
    // cabeçalho) fica intencionalmente parado até o próximo login, já que shiftForDate() (usada no
    // calendário/apontamentos) resolve pelo histórico, não por state.shift.
    state.shiftHistory = (shiftHistory || []).map(r => ({ shiftId: r.shift_id, effectiveFrom: r.effective_from }));
    try{
      const { data: myOS, error: myOSErr } = state.employee.setor
        ? await supabase.from("service_orders").select("*").eq("setor", state.employee.setor)
        : { data: [], error: null };
      if(myOSErr) throw myOSErr;
      state.myServiceOrders = (myOS||[]).map(serviceOrderFromRow);
    }catch(err){ /* schema novo ainda não rodado, ou sem conexão — mantém a lista anterior */ }
  }
  // Escolhe a categoria de checklist ativa nesta sessão e monta o rascunho a partir do envio de
  // hoje PRA ESSA categoria, se já existir (cada categoria tem sua própria linha em daily_checklists).
  function selectChecklistCategory(categoryId){
    state.checklistCategory = categoryId;
    const today = state.checklistTodayRows.find(r=>r.category_id===categoryId) || null;
    state.checklistToday = today;
    state.checklistColegas = (today && Array.isArray(today.colegas)) ? today.colegas : [];
    buildChecklistDraft();
    render();
  }

  // ---------------- Banner diário (aniversário / ano de empresa / férias) -- mesmo gerador de imagem
  // do painel desktop e do app do gestor (código idêntico, só que aqui é mostrado sozinho, em tela
  // cheia, ao entrar no app, em vez de gerado manualmente). Um card na vez, com X pra fechar; se tiver
  // mais de um evento hoje (ex: 3 aniversariantes), o X do primeiro revela o próximo, em sequência.
  const BANNER_MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  function bnFormatLong(iso){
    if(!iso) return "";
    const [y,m,d] = iso.split("-").map(Number);
    return `${d} de ${BANNER_MESES[m-1]}`;
  }
  function bnShortName(name){
    const parts = (name||"").trim().split(/\s+/).filter(Boolean);
    if(parts.length<=1) return parts[0]||"";
    return parts[0] + " " + parts[parts.length-1];
  }
  function bnFitFont(ctx, text, maxWidth, maxSize, minSize, weight, family){
    let size = maxSize;
    ctx.font = `${weight} ${size}px "${family}"`;
    while(size > minSize && ctx.measureText(text).width > maxWidth){
      size -= 2;
      ctx.font = `${weight} ${size}px "${family}"`;
    }
    return size;
  }
  function bnRoundRectPath(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function bnWatermarkArcs(ctx, W, H, color){
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    [[W*0.18,H*0.0,520],[W*0.9,H*0.16,440],[W*0.02,H*0.86,480],[W*0.98,H*1.02,520]].forEach(([cx,cy,r])=>{
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    });
    ctx.restore();
  }
  function bnConfetti(ctx, pieces, color){
    pieces.forEach(([x,y,len,ang])=>{
      ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
      ctx.fillStyle = color; ctx.fillRect(-len/2,-3,len,6);
      ctx.restore();
    });
  }
  function bnBalloon(ctx, cx, cy, w, h, color, highlight){
    const grad = ctx.createRadialGradient(cx-w*0.26,cy-h*0.3,w*0.05,cx,cy,w*0.78);
    grad.addColorStop(0,highlight); grad.addColorStop(1,color);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(cx,cy,w/2,h/2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx-7,cy+h/2-4); ctx.lineTo(cx+7,cy+h/2-4); ctx.lineTo(cx,cy+h/2+14);
    ctx.closePath(); ctx.fill();
  }
  function bnBalloonCluster(ctx, cx, cy, green, dir){
    bnBalloon(ctx, cx-40*dir, cy+10, 130, 160, green, "#4fb876");
    bnBalloon(ctx, cx+55*dir, cy-30, 110, 140, "#f7f6f1", "#ffffff");
    bnBalloon(ctx, cx+10*dir, cy+70, 100, 128, green, "#4fb876");
  }
  function bnWrapCentered(ctx, text, cx, y, maxWidth, lineHeight){
    const words = text.split(" ");
    let line = "", lines = [];
    words.forEach(w=>{
      const test = line ? line+" "+w : w;
      if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
      else line = test;
    });
    if(line) lines.push(line);
    const startY = y - (lines.length-1)*lineHeight/2;
    lines.forEach((l,i)=>ctx.fillText(l, cx, startY + i*lineHeight));
  }
  function bnWordmark(ctx, cx, y, logoImg, color){
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    if(logoImg){
      const maxH=84, maxW=420;
      let lw=logoImg.width, lh=logoImg.height;
      const scale = Math.min(maxH/lh, maxW/lw, 1);
      lw*=scale; lh*=scale;
      ctx.drawImage(logoImg, cx-lw/2, y-lh, lw, lh);
    } else {
      ctx.fillStyle = color;
      ctx.font = `800 34px "Manrope"`;
      ctx.fillText("FERTGROW", cx, y);
    }
  }
  const BN_GREEN = "#0B6B33", BN_GREEN_LIGHT = "#AFD676", BN_DARK = "#17291d", BN_MUTED = "rgba(23,41,29,0.55)", BN_BG = "#f5f4ef";
  function drawAniversarioBanner(ctx, W, H, data, logoImg){
    ctx.fillStyle = BN_BG; ctx.fillRect(0,0,W,H);
    bnWatermarkArcs(ctx, W, H, "rgba(23,41,29,0.06)");
    bnConfetti(ctx, [[130,70,26,0.3],[900,50,22,-0.5],[820,150,18,0.9],[80,190,16,-0.2],[960,230,14,0.6],[200,40,18,-0.7]], "#cda029");
    bnBalloonCluster(ctx, W*0.04, H*0.94, BN_GREEN, 1);
    bnBalloonCluster(ctx, W*0.98, H*0.9, BN_GREEN, -1);

    bnWordmark(ctx, W/2, 190, logoImg, BN_DARK);

    ctx.textAlign = "center";
    ctx.fillStyle = BN_GREEN;
    ctx.font = `800 66px "Manrope"`;
    ctx.fillText("Feliz aniversário!", W/2, 330);

    const nome = (bnShortName(data.nome)||"Nome do colaborador").toUpperCase();
    const nameSize = bnFitFont(ctx, nome, 880, 52, 32, 800, "Manrope");
    ctx.fillStyle = BN_DARK; ctx.font = `800 ${nameSize}px "Manrope"`;
    ctx.fillText(nome, W/2, 410);

    if(data.cargo){
      ctx.save(); ctx.fillStyle = BN_MUTED; ctx.font = `600 22px "Manrope"`; ctx.letterSpacing = "2px";
      ctx.fillText(data.cargo.toUpperCase(), W/2, 448); ctx.restore();
    }

    ctx.fillStyle = BN_DARK; ctx.font = `500 32px "Manrope"`;
    bnWrapCentered(ctx, "Que o novo ciclo venha acompanhado de saúde e alegrias!", W/2, 530, 800, 42);

    if(data.data1){
      ctx.fillStyle = BN_MUTED; ctx.font = `600 22px "Manrope"`;
      ctx.fillText(bnFormatLong(data.data1), W/2, 630);
    }

    ctx.fillStyle = BN_MUTED; ctx.font = `500 18px "Manrope"`;
    ctx.fillText("Equipe Fertgrow", W/2, H-70);
  }
  function drawAnoEmpresaBanner(ctx, W, H, data, logoImg){
    ctx.fillStyle = BN_BG; ctx.fillRect(0,0,W,H);
    bnWatermarkArcs(ctx, W, H, "rgba(23,41,29,0.06)");
    bnBalloonCluster(ctx, W*0.02, H*0.1, BN_GREEN, 1);
    bnBalloonCluster(ctx, W*0.99, H*0.92, BN_GREEN, -1);

    bnWordmark(ctx, W/2, 140, logoImg, BN_DARK);

    ctx.textAlign = "center";
    ctx.fillStyle = BN_GREEN;
    ctx.font = `800 68px "Manrope"`;
    ctx.fillText("Parabéns!", W/2, 400);

    const nome = (bnShortName(data.nome)||"Nome do colaborador").toUpperCase();
    const nameSize = bnFitFont(ctx, nome, 880, 46, 28, 800, "Manrope");
    ctx.fillStyle = BN_DARK; ctx.font = `800 ${nameSize}px "Manrope"`;
    ctx.fillText(nome, W/2, 460);

    if(data.cargo){
      ctx.save(); ctx.fillStyle = BN_MUTED; ctx.font = `600 20px "Manrope"`; ctx.letterSpacing = "2px";
      ctx.fillText(data.cargo.toUpperCase(), W/2, 496); ctx.restore();
    }

    const anos = data.anos || "1";
    ctx.fillStyle = BN_GREEN; ctx.font = `800 170px "Manrope"`;
    ctx.fillText(String(anos), W/2, 700);

    const label = Number(anos)===1 ? "1 ANO DE EMPRESA" : `${anos} ANOS DE EMPRESA`;
    ctx.font = `800 34px "Manrope"`;
    const labelW = ctx.measureText(label).width;
    ctx.fillStyle = BN_GREEN_LIGHT;
    bnRoundRectPath(ctx, W/2-labelW/2-18, 730, labelW+36, 52, 8); ctx.fill();
    ctx.fillStyle = BN_GREEN;
    ctx.fillText(label, W/2, 766);

    ctx.fillStyle = BN_DARK; ctx.font = `500 30px "Manrope"`;
    bnWrapCentered(ctx, "Mais um ano compartilhando desafios e resultados.", W/2, 860, 780, 40);

    ctx.fillStyle = BN_MUTED; ctx.font = `500 18px "Manrope"`;
    ctx.fillText("Equipe Fertgrow", W/2, H-70);
  }
  function drawFeriasBanner(ctx, W, H, data, logoImg){
    ctx.fillStyle = BN_BG; ctx.fillRect(0,0,W,H);
    bnWatermarkArcs(ctx, W, H, "rgba(23,41,29,0.05)");

    bnWordmark(ctx, W/2, 150, logoImg, BN_DARK);

    ctx.textAlign = "center";
    ctx.save(); ctx.fillStyle = BN_GREEN; ctx.font = `800 24px "Manrope"`; ctx.letterSpacing = "3px";
    ctx.fillText("AVISO DE FÉRIAS", W/2, 210); ctx.restore();

    const nome = (bnShortName(data.nome)||"Nome do colaborador").toUpperCase();
    const nameSize = bnFitFont(ctx, nome, 880, 58, 34, 800, "Manrope");
    ctx.fillStyle = BN_DARK; ctx.font = `800 ${nameSize}px "Manrope"`;
    ctx.fillText(nome, W/2, 610);

    if(data.cargo){
      ctx.save(); ctx.fillStyle = BN_MUTED; ctx.font = `600 24px "Manrope"`; ctx.letterSpacing = "2px";
      ctx.fillText(data.cargo.toUpperCase(), W/2, 655); ctx.restore();
    }

    ctx.strokeStyle = "rgba(23,41,29,0.18)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W/2-90,710); ctx.lineTo(W/2+90,710); ctx.stroke();

    const col1X = W/2-200, col2X = W/2+200;
    ctx.save(); ctx.fillStyle = BN_MUTED; ctx.font = `700 18px "Manrope"`; ctx.letterSpacing = "2px";
    ctx.fillText("SAÍDA", col1X, 780);
    ctx.fillText("RETORNO", col2X, 780);
    ctx.restore();
    ctx.fillStyle = BN_DARK; ctx.font = `700 42px "Manrope"`;
    ctx.fillText(bnFormatLong(data.data1)||"—", col1X, 835);
    ctx.fillStyle = BN_GREEN; ctx.font = `700 42px "Manrope"`;
    ctx.fillText(bnFormatLong(data.data2)||"—", col2X, 835);

    ctx.strokeStyle = "rgba(23,41,29,0.15)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W/2,750); ctx.lineTo(W/2,845); ctx.stroke();

    ctx.fillStyle = BN_MUTED; ctx.font = `500 18px "Manrope"`;
    ctx.fillText("Equipe Fertgrow", W/2, H-70);
  }
  // Guarda em localStorage quais eventos de hoje já foram fechados (por tipo+funcionário), pra não
  // mostrar o mesmo banner de novo a cada vez que o colaborador reabre o app no mesmo dia -- por
  // dispositivo, não sincroniza entre aparelhos (aceitável pra um aviso do dia, sem gravidade nenhuma
  // se aparecer de novo num celular diferente).
  function bnDismissedKey(){ return "dismissedBanners_" + todayISO(); }
  function bnIsDismissed(ev){
    try{
      const list = JSON.parse(localStorage.getItem(bnDismissedKey()) || "[]");
      return list.includes(ev.kind + ":" + ev.employee_id);
    }catch(err){ return false; }
  }
  function bnMarkDismissed(ev){
    try{
      const list = JSON.parse(localStorage.getItem(bnDismissedKey()) || "[]");
      list.push(ev.kind + ":" + ev.employee_id);
      localStorage.setItem(bnDismissedKey(), JSON.stringify(list));
    }catch(err){ /* sem storage disponível (modo privado etc.) -- só reaparece na próxima abertura */ }
  }
  async function loadDailyBanners(){
    try{
      const { data, error } = await supabase.rpc("today_banner_events");
      if(error || !data) return;
      const pending = data.filter(ev => !bnIsDismissed(ev));
      if(pending.length){ state.dailyBanners = pending; state.dailyBannerIndex = 0; }
    }catch(err){ /* schema novo ainda não rodado, ou sem conexão -- só não mostra o banner dessa vez */ }
  }
  function dailyBannerHTML(){
    return `
      <div style="position:fixed;inset:0;z-index:999;background:rgba(4,10,6,.92);display:flex;align-items:center;justify-content:center;padding:20px">
        <div style="position:relative;max-width:420px;width:100%">
          <button id="dailyBannerClose" type="button" aria-label="Fechar" style="position:absolute;top:-16px;right:-16px;width:38px;height:38px;border-radius:50%;background:#fff;color:#17291d;border:0;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)">✕</button>
          <canvas id="dailyBannerCanvas" width="1080" height="1350" style="width:100%;height:auto;border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,.5);display:block"></canvas>
        </div>
      </div>
    `;
  }
  function drawDailyBanner(){
    const canvas = $("#dailyBannerCanvas"); if(!canvas) return;
    const ev = (state.dailyBanners||[])[state.dailyBannerIndex];
    if(!ev) return;
    const ctx = canvas.getContext("2d");
    const data = { nome: ev.name, cargo: ev.cargo||"", data1: ev.kind==="aniversario" ? todayISO() : ev.date_start, data2: ev.date_end, anos: ev.years };
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(ev.kind==="aniversario") drawAniversarioBanner(ctx, canvas.width, canvas.height, data, null);
    else if(ev.kind==="ano_empresa") drawAnoEmpresaBanner(ctx, canvas.width, canvas.height, data, null);
    else drawFeriasBanner(ctx, canvas.width, canvas.height, data, null);
  }
  function wireDailyBanner(){
    drawDailyBanner();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawDailyBanner);
    const closeBtn = $("#dailyBannerClose");
    if(closeBtn) closeBtn.addEventListener("click", () => {
      const ev = (state.dailyBanners||[])[state.dailyBannerIndex];
      if(ev) bnMarkDismissed(ev);
      state.dailyBannerIndex++;
      render();
    });
  }

  const PR_DB_NAME = "fertgrow_relatorios_fotograficos";
  const PR_DB_VERSION = 1;
  const PR_STORE = "drafts";
  function prOpenDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(PR_DB_NAME, PR_DB_VERSION);
      req.onupgradeneeded = () => {
        const idb = req.result;
        if(!idb.objectStoreNames.contains(PR_STORE)) idb.createObjectStore(PR_STORE, { keyPath: "id" });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function prSaveDraft(draft){
    const idb = await prOpenDB();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(PR_STORE, "readwrite");
      tx.objectStore(PR_STORE).put(draft);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function prLoadDrafts(){
    const idb = await prOpenDB();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(PR_STORE, "readonly");
      const req = tx.objectStore(PR_STORE).getAll();
      req.onsuccess = () => resolve((req.result||[]).sort((a,b) => (b.updatedAt||"").localeCompare(a.updatedAt||"")));
      req.onerror = () => reject(req.error);
    });
  }
  async function prGetDraft(id){
    const idb = await prOpenDB();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(PR_STORE, "readonly");
      const req = tx.objectStore(PR_STORE).get(id);
      req.onsuccess = () => resolve(req.result||null);
      req.onerror = () => reject(req.error);
    });
  }
  async function prDeleteDraft(id){
    const idb = await prOpenDB();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(PR_STORE, "readwrite");
      tx.objectStore(PR_STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  function prNewDraft(){
    return { id: "pr-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7), title:"", subtitle:"", location:"", date: todayISO(), responsavel: (state.employee && state.employee.name) || "", updatedAt: new Date().toISOString(), photos: [] };
  }
  async function prLoadBitmap(file){
    if(window.createImageBitmap){
      try{ return await createImageBitmap(file, { imageOrientation: "from-image" }); }catch(e){}
    }
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = url;
    });
  }
  async function prCompressImageInner(file, maxDim, quality){
    const bitmap = await prLoadBitmap(file);
    let width = bitmap.width, height = bitmap.height;
    if(width > maxDim || height > maxDim){
      const scale = maxDim / Math.max(width, height);
      width = Math.max(1, Math.round(width*scale));
      height = Math.max(1, Math.round(height*scale));
    }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, width, height);
    if(bitmap.close) bitmap.close();
    return new Promise(resolve => canvas.toBlob(blob => resolve({ blob, width, height }), "image/jpeg", quality));
  }

      const url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); resolve({ width: img.naturalWidth||1600, height: img.naturalHeight||1200 }); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }
  // Em alguns celulares (foto de câmera muito grande, navegador mais antigo), createImageBitmap/canvas
  // trava sem nunca dar erro nem terminar -- sem um limite de tempo, "Adicionar fotos" ficava preso em
  // "Processando..." pra sempre (bug real reportado no app do colaborador). Se travar, usa a foto
  // ORIGINAL sem reduzir (mais pesada no PDF, mas pelo menos entra) em vez de travar o app.
  async function prCompressImage(file, maxDim=1600, quality=0.82){
    try{
      return await Promise.race([
        prCompressImageInner(file, maxDim, quality),
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 20000)),
      ]);
    }catch(err){
      console.error("Compressão da foto travou/falhou, usando original sem reduzir:", err);
      try{
        const dims = await prReadImageDims(file);
        return { blob: file, width: dims.width, height: dims.height };
      }catch(err2){
        return { blob: file, width: 1600, height: 1200 };
      }
    }
  }
  function prBlobToDataURL(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }
  function prSlug(s){
    return (s||"relatorio").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "relatorio";
  }

  function prRemovePhoto(id){

  function prMovePhoto(id, dir){
    const idx = prCurrent.photos.findIndex(p=>p.id===id);
    const swapIdx = idx+dir;
    if(idx<0 || swapIdx<0 || swapIdx>=prCurrent.photos.length) return;
    const [item] = prCurrent.photos.splice(idx,1);
    prCurrent.photos.splice(swapIdx,0,item);

  async function prGeneratePdf(draft){
    const doc = new jspdf.jsPDF({ unit:"mm", format:"a4" });
    const PAGE_W = 210, PAGE_H = 297, MARGIN = 14;
    const BRAND = [11,107,51];
    function prDrawFooter(){
      doc.setFont(undefined,"normal"); doc.setFontSize(7.5); doc.setTextColor(170,170,170);
      doc.text("Gerado por Manutenção Fabril", PAGE_W/2, PAGE_H-8, { align:"center" });
    }
    const logoW = 34, logoH = logoW;
    doc.addImage(PR_LOGO_BASE64, "PNG", MARGIN, MARGIN, logoW, logoH);
    doc.setFont(undefined,"bold"); doc.setFontSize(20); doc.setTextColor(...BRAND);
    doc.text(draft.title || "Relatório Fotográfico", MARGIN, MARGIN + logoH + 14);
    doc.setFont(undefined,"normal"); doc.setFontSize(12); doc.setTextColor(90,90,90);
    let y = MARGIN + logoH + 22;
    if(draft.subtitle){ doc.text(draft.subtitle, MARGIN, y); y += 8; }
    doc.setFontSize(10); doc.setTextColor(60,60,60);
    if(draft.location){ doc.text(`Local/Ativo: ${draft.location}`, MARGIN, y); y += 6; }
    if(draft.responsavel){ doc.text(`Responsável: ${draft.responsavel}`, MARGIN, y); y += 6; }
    doc.text(`Data: ${brDate(draft.date)}`, MARGIN, y); y += 6;
    doc.text(`Total de fotos: ${draft.photos.length}`, MARGIN, y); y += 6;
    doc.setDrawColor(...BRAND); doc.setLineWidth(0.6);
    doc.line(MARGIN, y+4, PAGE_W-MARGIN, y+4);
    prDrawFooter();

    const cols = 2, rows = 2, perPage = cols*rows;
    const headerH = 12, gutter = 6, captionH = 22;
    const gridTop = MARGIN + headerH;
    const cellW = (PAGE_W - MARGIN*2 - gutter*(cols-1)) / cols;
    const cellH = (PAGE_H - gridTop - MARGIN - gutter*(rows-1)) / rows;
    const imgH = cellH - captionH;

    for(let i=0;i<draft.photos.length;i++){
      const p = draft.photos[i];
      const posInPage = i % perPage;
      if(posInPage===0){
        doc.addPage();
        doc.setFont(undefined,"bold"); doc.setFontSize(9); doc.setTextColor(...BRAND);
        doc.text(draft.title || "Relatório Fotográfico", MARGIN, MARGIN);
        doc.setFont(undefined,"normal"); doc.setFontSize(9); doc.setTextColor(150,150,150);
        doc.text(`Página ${doc.internal.getNumberOfPages()-1}`, PAGE_W-MARGIN, MARGIN, { align:"right" });
        doc.setDrawColor(...BRAND); doc.setLineWidth(0.3);
        doc.line(MARGIN, MARGIN+2, PAGE_W-MARGIN, MARGIN+2);
        prDrawFooter();
      }
      const col = posInPage % cols, row = Math.floor(posInPage/cols);
      const x = MARGIN + col*(cellW+gutter);
      const cy = gridTop + row*(cellH+gutter);
      const dataUrl = await prBlobToDataURL(p.blob);
      const ratio = Math.min(cellW/p.width, imgH/p.height);
      const drawW = p.width*ratio, drawH = p.height*ratio;
      const dx = x + (cellW-drawW)/2, dy = cy + (imgH-drawH)/2;
      doc.addImage(dataUrl, "JPEG", dx, dy, drawW, drawH);
      // Legenda vira uma faixa presa embaixo da foto (fundo + linha + moldura única) -- antes era só
      // texto pequeno solto abaixo da borda, sem parecer parte da mesma "peça" da foto.
      doc.setFillColor(247,246,242);
      doc.rect(x, cy+imgH, cellW, captionH, "F");
      doc.setDrawColor(210,210,205); doc.setLineWidth(0.25);
      doc.line(x, cy+imgH, x+cellW, cy+imgH);
      doc.roundedRect(x, cy, cellW, cellH, 1.5, 1.5, "S");
      doc.setFont(undefined,"bold"); doc.setFontSize(9.5); doc.setTextColor(...BRAND);
      doc.text(String(i+1), x+4, cy+imgH+8);
      doc.setFont(undefined,"normal"); doc.setFontSize(9.5); doc.setTextColor(55,55,55);
      const capLines = doc.splitTextToSize(p.description ? p.description : "Sem descrição", cellW-13);
      doc.text(capLines.slice(0,3), x+10, cy+imgH+8);
    }
    doc.save(`relatorio-fotografico-${prSlug(draft.title)}-${draft.date||todayISO()}.pdf`);
  }

  async function bootstrap(){
    if(!configured){ state.view = "unconfigured"; render(); return; }
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){ state.view = "auth"; render(); return; }
    state.session = session;
    await afterLogin();
  }

  async function afterLogin(){
    state.view = "loading"; render();
    const { data: profile } = await supabase.from("profiles").select("*").eq("id", state.session.user.id).maybeSingle();
    state.profile = profile;
    if(!profile || !profile.employee_id){ state.view = "unlinked"; render(); return; }
    const { data: employee } = await supabase.from("employees").select("*").eq("id", profile.employee_id).maybeSingle();
    if(!employee){ state.view = "unlinked"; render(); return; }
    // Pega quem já estava logado (sessão válida) no momento em que foi desligado -- o bloqueio lá no
    // login (is_employee_inactive) só vale pra quem ainda não tinha entrado.
    if(employee.status === "Inativo"){
      await supabase.auth.signOut();
      state.view = "inactive"; state.session = null; state.profile = null; state.employee = null;
      render();
      return;
    }
    state.employee = employee;
    await loadEmployeeData();
    // Inicializa (só se nunca tiver sido setado) o ciclo do check-in semanal obrigatório de Bem-estar —
    // dá uma semana de folga antes do primeiro aparecer, em vez de forçar todo mundo assim que essa
    // atualização for publicada. Idempotente: chamadas seguintes não fazem nada (a function só seta
    // "where wellbeing_prompt_due_at is null").
    if(!state.profile.wellbeing_prompt_due_at){
      try{
        await supabase.rpc("wellbeing_ping_prompt");
        state.profile.wellbeing_prompt_due_at = new Date(Date.now() + 7*86400000).toISOString();
      }catch(err){ /* sem essa function ainda (schema não rodado), ou sem conexão — segue sem o gate */ }
    }
    await loadDailyBanners();
    state.view = "app"; state.tab = "escala";
    render();
    flushPendingQueue(); // pode ter sobrado fila de uma sessão offline anterior
    autoFinalizeStaleGeneralRequests();
    // Fire-and-forget: se hoje for aniversário (nascimento ou de empresa) de alguém, manda o aviso pra
    // todo mundo -- roda tanto daqui quanto do painel do gestor, o "on conflict do nothing" no banco
    // garante que só manda uma vez por dia por pessoa, não importa quem abriu o app primeiro. .then(ok,
    // err) em vez de .catch(): só .then() é garantido em qualquer thenable, evita quebrar o resto do
    // afterLogin() com uma exceção não tratada se o objeto devolvido não tiver .catch().
    supabase.rpc("check_and_notify_birthdays").then(()=>{}, ()=>{});
  }

    document.querySelectorAll("[data-tab]").forEach(el => el.addEventListener("click", async () => {
      if(el.dataset.tab==="logout"){ await supabase.auth.signOut(); state = {...state, view:"auth", session:null, profile:null, employee:null}; render(); return; }
      if(el.dataset.tab==="relatorios" && state.tab!=="relatorios"){
        state.prTab = "list";
        prRefreshList().then(() => { if(state.tab==="relatorios") render(); });
      }
      state.tab = el.dataset.tab; render();
    }));

    if(state.tab==="escala"){
      $("#calPrev").addEventListener("click", () => { state.calMonth = addMonths(state.calMonth,-1); render(); });
      $("#calNext").addEventListener("click", () => { state.calMonth = addMonths(state.calMonth,1); render(); });
      document.querySelectorAll("[data-calday]").forEach(el => el.addEventListener("click", () => openDayStatusModal(el.dataset.calday)));
      localStorage.setItem("lastSeenRequests_"+state.employee.id, new Date().toISOString());
      const dssCard = $("#dssTodayCard");
      if(dssCard) dssCard.addEventListener("click", () => { state.dssExpanded = !state.dssExpanded; render(); });
      const newRequestBtn = $("#newRequestBtn");
      if(newRequestBtn) newRequestBtn.addEventListener("click", openNewRequestTypeMenu);
      document.querySelectorAll("[data-toggle-reply]").forEach(el => el.addEventListener("click", () => {
        replyOpenForRequestId = replyOpenForRequestId===el.dataset.toggleReply ? null : el.dataset.toggleReply;
        render();
      }));
      document.querySelectorAll("[data-send-reply]").forEach(el => el.addEventListener("click", () => {
        const box = $("#reply_"+el.dataset.sendReply);
        submitGeneralRequestReply(el.dataset.sendReply, box ? box.value : "");
      }));
      document.querySelectorAll("[data-finalize-req]").forEach(el => el.addEventListener("click", () => finalizeGeneralRequest(el.dataset.finalizeReq)));
    }
    if(state.tab==="ferias"){
      const newFeriasBtn = $("#newFeriasBtn");
      if(newFeriasBtn) newFeriasBtn.addEventListener("click", openFeriasRequestModal);
      localStorage.setItem("lastSeenFerias_"+state.employee.id, new Date().toISOString());
    }
    if(state.tab==="os"){
      document.querySelectorAll("[data-marcarosfeita]").forEach(el => el.addEventListener("click", () => {
        const os = state.myServiceOrders.find(o=>o.id===el.dataset.marcarosfeita);
        if(os) markServiceOrderDone(os);
      }));
    }
    if(state.tab==="relatorios"){
      wirePhotoReport();
    }
    if(state.tab==="bemestar") wireBemEstarBody();
    if(state.tab==="checklist"){
      document.querySelectorAll("[data-selectcategory]").forEach(el => el.addEventListener("click", () => selectChecklistCategory(el.dataset.selectcategory)));
      const backBtn = $("#backToCategoriesBtn");
      if(backBtn) backBtn.addEventListener("click", () => { state.checklistCategory = null; render(); });
      const colegaInput = $("#colegaSearch");
      if(colegaInput) colegaInput.addEventListener("input", () => {
        colegaSearch = colegaInput.value;
        render();
        const el = $("#colegaSearch");
        if(el){ el.focus(); const v = el.value; el.setSelectionRange(v.length, v.length); }
      });
      document.querySelectorAll("[data-addcolega]").forEach(el => el.addEventListener("click", () => addColega(el.dataset.addcolega)));
      document.querySelectorAll("[data-removecolega]").forEach(el => el.addEventListener("click", () => removeColega(Number(el.dataset.removecolega))));
      const selectAll = $("#checkSelectAll");
      if(selectAll) selectAll.addEventListener("change", () => {
        const ids = state.checklistDraft.map(d=>d.equipment_id);
        if(selectAll.checked) ids.forEach(id=>checklistSelected.add(id)); else checklistSelected.clear();
        render();
      });
      document.querySelectorAll("[data-eqselect]").forEach(el => el.addEventListener("change", () => {
        if(el.checked) checklistSelected.add(el.dataset.eqselect); else checklistSelected.delete(el.dataset.eqselect);
        render();
      }));
      document.querySelectorAll("[data-massstatus]").forEach(el => el.addEventListener("click", () => {
        if(!checklistSelected.size){ alert("Selecione ao menos um equipamento (marque as caixinhas)."); return; }
        applyStatusToSelected(el.dataset.massstatus);
      }));
      document.querySelectorAll("[data-eqstatus]").forEach(el => el.addEventListener("click", () => setChecklistStatus(el.dataset.eqstatus, el.dataset.status)));
      document.querySelectorAll("[data-eqfield]").forEach(el => el.addEventListener("input", () => {
        const d = state.checklistDraft.find(x=>x.equipment_id===el.dataset.eqfield);
        if(d) d[el.dataset.field] = el.value;
        scheduleChecklistSave();
      }));
      const genBtn = $("#genReportBtn");
      if(genBtn) genBtn.addEventListener("click", () => { state.checklistReport = buildChecklistReportText(); render(); });
      const copyBtn = $("#copyReportBtn");
      if(copyBtn) copyBtn.addEventListener("click", copyChecklistReport);
    }
  }

  async function onAuthSubmit(){
    const email = $("#auth_email").value.trim();
    const password = $("#auth_password").value;
    state.authError = ""; state.authInfo = "";
    if(!email || !password){ state.authError = "Preencha e-mail e senha."; render(); return; }
    if(state.authMode==="signup"){
      const { data, error } = await supabase.auth.signUp({ email, password });
      if(error){ state.authError = error.message; render(); return; }
      if(!data.session){
        state.authMode = "login";
        state.authInfo = "Conta criada. Confira seu e-mail pra confirmar (se pedido), depois entre normalmente.";
        render();
        return;
      }
      state.session = data.session;
      await afterLogin();
    } else {
      // Falha ao checar bloqueio não deve travar quem está tentando logar normalmente — segue tentando.
      try{
        const { data: locked } = await supabase.rpc("is_login_locked", { p_email: email });
        if(locked){
          state.authError = "Conta bloqueada após 3 tentativas incorretas. Fale com o gestor pra resetar sua senha.";
          render();
          return;
        }
      }catch(err){}
      // Funcionário desligado (status Inativo) -- barra o login antes de tentar autenticar de verdade.
      try{
        const { data: inactive } = await supabase.rpc("is_employee_inactive", { p_email: email });
        if(inactive){
          state.authError = "Essa conta foi desligada e não tem mais acesso ao portal. Fale com o gestor se achar que isso é um engano.";
          render();
          return;
        }
      }catch(err){}
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if(error){
        try{
          const { data: result } = await supabase.rpc("record_failed_login", { p_email: email });
          const r = Array.isArray(result) ? result[0] : result;
          if(r && r.locked){
            state.authError = "Conta bloqueada após 3 tentativas incorretas. Fale com o gestor pra resetar sua senha.";
          } else if(r && r.attempts>0){
            state.authError = `Senha incorreta. Mais ${Math.max(0,3-r.attempts)} tentativa(s) antes do bloqueio.`;
          } else {
            state.authError = "E-mail ou senha inválidos.";
          }
        }catch(err){ state.authError = "E-mail ou senha inválidos."; }
        render();
        return;
      }
      // Fire-and-forget (não atrasa o login por causa disso) — try/catch em vez de encadear .catch()
      // direto, já que nem todo objeto retornado por .rpc() garante esse método antes de ser aguardado.
      (async () => { try{ await supabase.rpc("reset_failed_login", { p_email: email }); }catch(err){} })();
      state.session = data.session;
      await afterLogin();
    }
  }

  // Celular pode ser minimizado no meio do preenchimento do checklist (chão de fábrica) — força salvar
  // o que já foi digitado (debounced) assim que a aba perde foco, em vez de arriscar perder o texto.
  document.addEventListener("visibilitychange", () => { if(document.visibilityState==="hidden") flushChecklistSave(); });
  window.addEventListener("pagehide", flushChecklistSave);

  // PWA: guarda o prompt de instalação do Android/Chrome pra disparar no clique do botão (não pode
  // ser mostrado direto no evento) e some com o botão depois de instalado.
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if(state.view==="app") render();
  });
  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null; installDismissed = true;
    if(state.view==="app") render();
  });
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
  }

  // Reenvia a fila de sincronização offline quando a conexão volta — o evento "online" nem sempre
  // dispara de forma confiável em celular, por isso também tenta de tempos em tempos enquanto a fila
  // não estiver vazia.
  window.addEventListener("online", flushPendingQueue);
  setInterval(() => { if(pendingSyncCount()>0) flushPendingQueue(); }, 30000);

  // Sem isso, status de solicitação/notificações/DSS só atualizavam num reload manual — busca de novo
  // em segundo plano a cada 30s. Pula a re-renderização (mas mantém os dados buscados pra próxima vez)
  // se o colaborador estiver com um campo em foco ou um modal aberto, pra não interromper o que ele
  // estiver digitando.
  setInterval(async () => {
    if(state.view!=="app") return;
    const activeTag = document.activeElement && document.activeElement.tagName;
    if(activeTag==="INPUT" || activeTag==="TEXTAREA" || activeTag==="SELECT") return;
    if($("#modalRoot") && $("#modalRoot").innerHTML.trim()) return;
    await loadLiveUpdates();
    await autoFinalizeStaleGeneralRequests();
    render();
  }, 30000);

  bootstrap();
})();
</script>
